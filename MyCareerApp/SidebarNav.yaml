                  Height: =40
                  OnSelect: =Navigate(S2_ProfilPegawai, ScreenTransition.Fade)
                  PaddingLeft: =16
                  RadiusBottomLeft: =5
                  RadiusBottomRight: =5
                  RadiusTopLeft: =5
                  RadiusTopRight: =5

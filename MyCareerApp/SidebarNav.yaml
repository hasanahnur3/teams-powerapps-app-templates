ComponentDefinitions:
  SidebarNav:
    DefinitionType: CanvasComponent
    Properties:
      Height: =App.Height
      Width: =260
    Children:
      - SidebarContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(225, 223, 221, 1)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =SidebarNav.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =16
            Width: =SidebarNav.Width
          Children:

            # ── MENU PEGAWAI ──
            - LblSectionPegawai:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  PaddingBottom: =4
                  PaddingLeft: =10
                  PaddingTop: =4
                  Size: =10
                  Text: ="MENU PEGAWAI"
                  Width: =240

            - NavHomepage:
                Control: ModernText@1.0.0
                Properties:
                  Color: =If(App.ActiveScreen.Name = "S1_Homepage", RGBA(0, 120, 212, 1), RGBA(50, 49, 48, 1))
                  Fill: =If(App.ActiveScreen.Name = "S1_Homepage", RGBA(222, 236, 249, 1), RGBA(0, 0, 0, 0))
                  Font: =Font.'Open Sans'
                  FontWeight: =If(App.ActiveScreen.Name = "S1_Homepage", FontWeight.Semibold, FontWeight.Normal)
                  Height: =40
                  OnSelect: =Navigate(S1_Homepage, ScreenTransition.Fade)
                  PaddingLeft: =16
                  RadiusBottomLeft: =5
                  RadiusBottomRight: =5
                  RadiusTopLeft: =5
                  RadiusTopRight: =5
                  Size: =13
                  Text: ="Homepage"
                  Width: =240

            - NavProfilPegawai:

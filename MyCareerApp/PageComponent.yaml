Screens:
  ScreenName:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - GridPage:
          Control: GroupContainer@1.5.0
          Variant: GridLayout
          Properties:
            Fill: =RGBA(243, 242, 241, 1)
            Height: =Parent.Height
            LayoutGap: =0
            LayoutGridColumns: =10
            LayoutGridRows: =8
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Width: =Parent.Width
          Children:
            - HeaderBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 56, 100, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGridColumnEnd: =11
                  LayoutGridColumnStart: =1
                  LayoutGridRowEnd: =2
                  LayoutGridRowStart: =1
                  PaddingBottom: =10
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =10
                Children:
                  - AppTitleBar:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =20
                        Text: ="MyCareerApp"
                  - HeaderUser:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Right
                        Color: =RGBA(199, 224, 244, 1)
                        Font: =Font.'Open Sans'
                        Height: =36
                        Size: =13
                        Text: =User().FullName
                        Width: =500
            - SidebarNav1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 56, 100, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGridColumnEnd: =3
                  LayoutGridColumnStart: =1
                  LayoutGridRowEnd: =9
                  LayoutGridRowStart: =2
            - MainContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(243, 242, 241, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutGridColumnEnd: =11
                  LayoutGridColumnStart: =3
                  LayoutGridRowEnd: =9
                  LayoutGridRowStart: =2
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =20
                Children:
                  - Breadcrumb:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Open Sans'
                        Height: =20
                        Size: =12
                        Text: ="Home - Page Name"
                  - PageTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(31, 56, 100, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =18
                        Text: ="Page Name"

Screens:
  TEMPLATE:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - MainGrid:
          Control: GroupContainer@1.5.0
          Variant: GridLayout
          Properties:
            Fill: =RGBA(243, 242, 241, 1)
            Height: =Parent.Height
            LayoutGap: =0
            LayoutGridColumns: =10
            LayoutGridRows: =8
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Width: =Parent.Width
          Children:
            - SidebarNav_1:
                Control: CanvasComponent
                ComponentName: SidebarNav
                Properties:
                  ActiveItem: =""
                  Height: =App.Height
                  LayoutGridColumnEnd: =3
                  LayoutGridColumnStart: =1
                  LayoutGridRowEnd: =9
                  LayoutGridRowStart: =2
                  Width: =260
            - Header:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 56, 100, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGridColumnEnd: =-1
                  LayoutGridColumnStart: =1
                  LayoutGridRowEnd: =1
                  LayoutGridRowStart: =1
                  PaddingBottom: =10
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =10
                Children:
                  - AppTitle_1:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =20
                        Text: ="MyCareerApp"
                  - HeaderUserName_1:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: |
                          =Align.Right
                        Color: =RGBA(199, 224, 244, 1)
                        Font: =Font.'Open Sans'
                        Height: =36
                        Size: =13
                        Text: =User().FullName
                        Width: =500
            - MainContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutGridColumnEnd: =11
                  LayoutGridColumnStart: =3
                  LayoutGridRowEnd: =9
                  LayoutGridRowStart: =2
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                Children:
                  - StatusRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                      Children:
                        - AnnouncementsPanel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1.4
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8

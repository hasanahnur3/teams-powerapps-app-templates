Screens:
  S9C_CoachingKarir_Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(9, 33, 98, 1)
      OnVisible: |-
        =If(
            IsEmpty(colNonFormNavigationHistory) ||
            Last(colNonFormNavigationHistory).ScreenName <> App.ActiveScreen.Name,
            Collect(
                colNonFormNavigationHistory,
                {
                    ScreenName: App.ActiveScreen.Name,
                    ScreenRef: App.ActiveScreen
                }
            )
        );
        UpdateContext({locShowDeleteCK: false, locShowDetailImagePreview: false, locDetailImageFull: Blank()})
    Children:
      - CKDetailScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - CKDetailHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackCKDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =If(
                              IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                              If(
                                  !IsEmpty(colNonFormNavigationHistory),
                                  Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                  Back()
                              ),
                              If(
                                  CountRows(colNonFormNavigationHistory) > 1,
                                  Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                  Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                  Back()
                              )
                          )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameCKDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: =If(Coalesce(gblPimpinanView, false), Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-") & " (" & Text(gblSubjectNIP) & ")", "MyCareerApp")
                  - CKDetailHeaderSpacer:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - CKDetailHeaderShadow:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - CKDetailMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - CKDetailHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =48
                      Children:
                        - CKDetailPageTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Detail Coaching Karir"
                        - BtnEditCKDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(9, 33, 98, 1))
                              DisplayMode: =If(Coalesce(gblPimpinanView, false), DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(235, 240, 252, 1))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: |-
                                =Set(gblCoachingKarirCoachEditMode, true);
                                Set(gblCoachingKarirListMode, "Coach");
                                Navigate(S9B_CoachingKarir_Coach_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: ="Edit"
                              Visible: =And(!Coalesce(gblPimpinanView, false), gblCoachingKarirListMode = "Coach", Trim(gblSelectedCoachingKarir.MentorNIP) = Trim(Text(gblCurrentNIP)))
                              Width: =90
                        - BtnDeleteCKDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                              DisplayMode: =If(Coalesce(gblPimpinanView, false), DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(196, 43, 28, 1))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: |-
                                =UpdateContext({locShowDeleteCK: true})
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: ="Hapus"
                              Visible: =And(!Coalesce(gblPimpinanView, false), gblCoachingKarirListMode = "Coach", Trim(gblSelectedCoachingKarir.MentorNIP) = Trim(Text(gblCurrentNIP)))
                              Width: =90
                  - CKDetailCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =Max(
                              If(Parent.Width < 640, 680, 500),
                              CKDetailInfoRow.Height +
                                  CKDetailDivider.Height +
                                  CKDetailCatatanLabel.Height +
                                  CKDetailCatatan.Height +
                                  CKDetailResultLabel.Height +
                                  CKDetailResult.Height +
                                  CKDetailActionItemsLabel.Height +
                                  CKDetailActionItemsGallery.Height +
                                  If(Parent.Width < 640, 170, 210)
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: |-
                          =Max(
                              If(Parent.Width < 640, 680, 500),
                              CKDetailInfoRow.Height +
                                  CKDetailDivider.Height +
                                  CKDetailCatatanLabel.Height +
                                  CKDetailCatatan.Height +
                                  CKDetailResultLabel.Height +
                                  CKDetailResult.Height +
                                  CKDetailActionItemsLabel.Height +
                                  CKDetailActionItemsGallery.Height +
                                  If(Parent.Width < 640, 170, 210)
                          )
                        PaddingBottom: =If(Parent.Width < 640, 18, 28)
                        PaddingLeft: =If(Parent.Width < 640, 18, 28)
                        PaddingRight: =If(Parent.Width < 640, 18, 28)
                        PaddingTop: =If(Parent.Width < 640, 18, 28)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - CKDetailInfoRow:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Parent.Width < 640, 270, 92)
                              LayoutMinHeight: =If(Parent.Width < 640, 270, 92)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - CKDetailMenteeLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="MENTEE"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                              - CKDetailMenteeValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =72
                                    Size: =19
                                    Text: =Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingKarir.MenteeNIP, Nama), gblSelectedCoachingKarir.MenteeNIP, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    Y: =32
                              - CKDetailDateLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="TANGGAL"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, ((Parent.Width - 32) / 3) + 16)
                                    Y: =If(Parent.Width < 640, 90, 0)
                              - CKDetailDateValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =72
                                    Size: =19
                                    Text: |-
                                      =If(
                                          IsBlank(gblSelectedCoachingKarir.Tanggal),
                                          "-",
                                          IfError(
                                              Text(gblSelectedCoachingKarir.Tanggal, "[$-id-ID]dd mmmm yyyy"),
                                              Text(Date(1899, 12, 30) + Value(gblSelectedCoachingKarir.Tanggal), "[$-id-ID]dd mmmm yyyy")
                                          )
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, ((Parent.Width - 32) / 3) + 16)
                                    Y: =If(Parent.Width < 640, 122, 32)
                              - CKDetailMentorLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="MENTOR"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 32) / 3) + 16) * 2)
                                    Y: =If(Parent.Width < 640, 180, 0)
                              - CKDetailMentorValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =72
                                    Size: =19
                                    Text: =Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingKarir.MentorNIP, Nama), gblSelectedCoachingKarir.MentorNIP, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 32) / 3) + 16) * 2)
                                    Y: =If(Parent.Width < 640, 212, 32)
                        - CKDetailDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(235, 235, 235, 1)
                              Height: =1
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CKDetailCatatanLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="CATATAN"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CKDetailCatatan:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =96
                              Size: =16
                              Text: =Coalesce(gblSelectedCoachingKarir.Catatan, "-")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CKDetailResultLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="HASIL COACHING"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CKDetailResult:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: ="Klik untuk memperbesar foto bukti Coaching Karir"
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderThickness: =1
                              Fill: =RGBA(250, 250, 250, 1)
                              Height: =If(Parent.Width < 640, 260, 220)
                              Image: =gblSelectedCoachingKarir.FotoBukti.Large
                              OnSelect: |-
                                =If(
                                    !IsBlank(gblSelectedCoachingKarir.FotoBukti),
                                    UpdateContext({locDetailImageFull: gblSelectedCoachingKarir.FotoBukti.Full, locShowDetailImagePreview: true})
                                )
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CKDetailActionItemsLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="ACTION ITEMS"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CKDetailActionItemsGallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderThickness: =0
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =If(
                                    IsEmpty(Filter(ActionItem, CoachingID = gblSelectedCoachingKarir.ID)),
                                    88,
                                    CountRows(Filter(ActionItem, CoachingID = gblSelectedCoachingKarir.ID)) * 160 + 8
                                )
                              Items: |-
                                =Sort(
                                    Filter(
                                        ActionItem,
                                        CoachingID = gblSelectedCoachingKarir.ID
                                    ),
                                    Title,
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: |-
                                =If(
                                    IsEmpty(Filter(ActionItem, CoachingID = gblSelectedCoachingKarir.ID)),
                                    88,
                                    CountRows(Filter(ActionItem, CoachingID = gblSelectedCoachingKarir.ID)) * 160 + 8
                                )
                              TemplatePadding: =0
                              TemplateSize: =160
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - CKDetailActionDivider:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =RGBA(237, 235, 233, 1)
                                    Height: =1
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                              - CKDetailActionCategoryBadge:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: |-
                                      =Switch(
                                          ThisItem.Kategori,
                                          "Pendidikan (PTB)", RGBA(0, 84, 153, 1),
                                          "Sertifikasi", RGBA(0, 100, 0, 1),
                                          "Exposure", RGBA(98, 48, 180, 1),
                                          RGBA(50, 49, 48, 1)
                                      )
                                    Fill: |-
                                      =Switch(
                                          ThisItem.Kategori,
                                          "Pendidikan (PTB)", RGBA(222, 236, 249, 1),
                                          "Sertifikasi", RGBA(218, 242, 208, 1),
                                          "Exposure", RGBA(239, 224, 255, 1),
                                          RGBA(245, 245, 245, 1)
                                      )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =34
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =12
                                    Text: =Coalesce(ThisItem.Kategori, "-")
                                    Width: =Min(Parent.TemplateWidth - 64, 220)
                                    X: =32
                                    Y: =22
                              - CKDetailActionType:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    Size: =18
                                    Text: =Coalesce(ThisItem.Tipe.Value, "-")
                                    Width: =Parent.TemplateWidth - 64
                                    X: =32
                                    Y: =66
                              - CKDetailActionItemDetail:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =56
                                    Size: =13
                                    Text: =Coalesce(ThisItem.Detail, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.TemplateWidth - 64
                                    X: =32
                                    Y: =106
                              - CKDetailActionItemsEmpty:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =60
                                    Size: =12
                                    Text: ="Belum ada action item."
                                    Visible: =IsEmpty(Parent.AllItems)
                                    Width: =Parent.TemplateWidth
                                    Y: =14
                        - CKDetailActionItemsEmptyState:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =60
                              Size: =12
                              Text: ="Belum ada action item."
                              Visible: =IsEmpty(Filter(ActionItem, CoachingID = gblSelectedCoachingKarir.ID))
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
      - CKDeleteOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Visible: =Coalesce(locShowDeleteCK, false)
            Width: =Parent.Width
          Children:
            - CKDeleteDialog:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(225, 223, 221, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =220
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =220
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Min(480, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
                Children:
                  - CKDeleteTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: ="Hapus Coaching Karir?"
                        Width: =Parent.Width
                  - CKDeleteMessage:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Text: ="Data yang sudah dihapus tidak dapat dikembalikan."
                        Width: =Parent.Width
                  - CKDeleteActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Height: =46
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =46
                        Width: =Parent.Width
                      Children:
                        - BtnCancelDeleteCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              Height: =42
                              OnSelect: |-
                                =UpdateContext({locShowDeleteCK: false})
                              Text: ="Batal"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
                        - BtnConfirmDeleteCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =IfError(
                                    RemoveIf(ActionItem, CoachingID = gblSelectedCoachingKarir.ID);
                                    Remove(CoachingKarir, gblSelectedCoachingKarir);
                                    Refresh(ActionItem);
                                    Refresh(CoachingKarir);
                                    UpdateContext({locShowDeleteCK: false});
                                    Notify("Coaching Karir berhasil dihapus.", NotificationType.Success);
                                    Set(gblSelectedCoachingKarir, Defaults(CoachingKarir));
                                    Set(gblCoachingKarirCoachEditMode, false);
                                    If(
                                        gblCoachingKarirListMode = "Coach",
                                        Navigate(S9A_CoachingKarir_Coach_List, ScreenTransition.Fade),
                                        Navigate(S9A_CoachingKarir_Mentee_List, ScreenTransition.Fade)
                                    ),
                                    Notify(
                                        "Gagal menghapus Coaching Karir: " & FirstError.Message,
                                        NotificationType.Error
                                    )
                                )
                              Text: ="Ya, Hapus"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
      - CKImagePreviewOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.88)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12

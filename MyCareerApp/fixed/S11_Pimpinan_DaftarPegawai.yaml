Screens:
  S11_Pimpinan_DaftarPegawai:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(9, 33, 98, 1)
      OnVisible: |-
        =If(
            IsEmpty(colNonFormNavigationHistory) ||
            Last(colNonFormNavigationHistory).ScreenName <> App.ActiveScreen.Name,
            Collect(
                colNonFormNavigationHistory,
                {
                    ScreenName: App.ActiveScreen.Name,
                    ScreenRef: App.ActiveScreen
                }
            )
        );
        Set(gblPimpinanView, false);
        If(
            IsBlank(gblSubjectNIP),
            Set(gblSelectedEmployee, Blank())
        );
        UpdateContext({locShowDevelopmentWarning: false})
    Children:
      - PimpinanScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - PimpinanHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackPimpinan:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                              =Set(gblPimpinanView, false);
                              Set(gblSubjectNIP, Blank());
                              Set(gblSelectedEmployee, Blank());
                              If(
                                  IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                                  If(
                                      !IsEmpty(colNonFormNavigationHistory),
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  ),
                                  If(
                                      CountRows(colNonFormNavigationHistory) > 1,
                                      Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  )
                              )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNamePimpinan:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - HeaderSpacerPimpinan:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - PimpinanHeaderShadow:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - PimpinanContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - PimpinanPageTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(31, 56, 100, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: ="Daftar Pegawai"
                  - PimpinanDevelopmentWarning:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(161, 98, 7, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 244, 206, 1)
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =64
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(locShowDevelopmentWarning, false)
                      Children:
                        - PimpinanDevelopmentWarningIcon:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(161, 98, 7, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =20
                              Text: ="⚠"
                              Width: =36
                        - PimpinanDevelopmentWarningText:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(122, 70, 0, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Size: =13
                              Text: ="Fitur Dalam Development"
                        - BtnClosePimpinanDevelopmentWarning:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: ="Tutup peringatan"
                              Align: =Align.Center
                              Color: =RGBA(122, 70, 0, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              OnSelect: |-
                                =UpdateContext({locShowDevelopmentWarning: false})
                              Size: =18
                              Text: ="×"
                              Width: =40
                  - EmployeeSelectorCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 620, 150, 100)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        LayoutMinHeight: =If(Parent.Width < 620, 150, 100)
                        LayoutWrap: =true
                        PaddingBottom: =20
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =20
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - LblSelectEmployee:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =14
                              Text: ="Pilih Pegawai:"
                              Width: =If(Parent.Width < 620, Parent.Width - 48, 180)
                        - CmbPimpinanEmployee:
                            Control: ComboBox@0.0.51
                            Properties:
                              AccessibleLabel: ="Pilih Pegawai"
                              DefaultSelectedItems: |-
                                =If(
                                    IsBlank(gblSubjectNIP),
                                    Blank(),
                                    Filter(
                                        ForAll(Pegawai, {Value: Nama, NIP: Title}),
                                        NIP = Text(gblSubjectNIP)
                                    )
                                )
                              InputTextPlaceholder: ="-- Pilih nama pegawai --"
                              Items: |-
                                =SortByColumns(
                                    ForAll(
                                        Pegawai,
                                        {
                                            Value: Nama,
                                            NIP: Title
                                        }
                                    ),
                                    "Value",
                                    SortOrder.Ascending
                                )
                              OnChange: |-
                                =Set(gblSelectedEmployee, Self.Selected);
                                Set(gblSubjectNIP, Self.Selected.NIP)
                              SelectMultiple: =false
                              Width: =If(Parent.Width < 620, Parent.Width - 48, Min(640, Parent.Width - 250))
                  - PimpinanTabCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Self.Width - Self.PaddingLeft - Self.PaddingRight < 620, 380, If(Self.Width - Self.PaddingLeft - Self.PaddingRight < 900, 200, If(Self.Width - Self.PaddingLeft - Self.PaddingRight < 1200, 140, 80)))
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =If(Self.Width - Self.PaddingLeft - Self.PaddingRight < 620, 380, If(Self.Width - Self.PaddingLeft - Self.PaddingRight < 900, 200, If(Self.Width - Self.PaddingLeft - Self.PaddingRight < 1200, 140, 80)))
                        LayoutWrap: =true
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =!IsBlank(gblSubjectNIP)
                      Children:
                        - TabProfilePimpinan:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(0, 120, 212, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              LayoutMinWidth: =If(Parent.Width < 1200, 280, 140)
                              OnSelect: |-
                                =Set(gblPimpinanView, true);
                                Navigate(S2_ProfilPegawai, ScreenTransition.Fade)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="Profil Pegawai"
                        - TabMentoringPimpinan:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(96, 94, 92, 1)
                              Fill: =RGBA(225, 223, 221, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              LayoutMinWidth: =If(Parent.Width < 1200, 280, 140)
                              OnSelect: |-
                                =UpdateContext({locShowDevelopmentWarning: true})
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="Mentoring"
                        - TabPRPimpinan:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(0, 120, 212, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              LayoutMinWidth: =If(Parent.Width < 1200, 280, 140)
                              OnSelect: |-
                                =Set(gblPimpinanView, true);
                                Navigate(S3A_PR_List, ScreenTransition.Fade)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="Performance Review"
                        - TabCareerPimpinan:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(0, 120, 212, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              LayoutMinWidth: =If(Parent.Width < 1200, 280, 140)
                              OnSelect: |-
                                =Set(gblPimpinanView, true);
                                Navigate(S9A_CoachingKarir_Mentee_List, ScreenTransition.Fade)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="Coaching Karir"
                        - TabThematicPimpinan:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(96, 94, 92, 1)
                              Fill: =RGBA(225, 223, 221, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              LayoutMinWidth: =If(Parent.Width < 1200, 280, 140)
                              OnSelect: |-
                                =UpdateContext({locShowDevelopmentWarning: true})
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="Coaching Tematik"
                        - TabIDPPimpinan:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(0, 120, 212, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              LayoutMinWidth: =If(Parent.Width < 1200, 280, 140)
                              OnSelect: |-
                                =Set(gblPimpinanView, true);
                                Set(gblLineManagerView, false);
                                Navigate(S5A_IDP_View, ScreenTransition.Fade)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="IDP"
                  - PimpinanEmptyState:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =280
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =280
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =IsBlank(gblSubjectNIP)
                      Children:
                        - EmptyEmployeeIcon:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Open Sans'
                              Height: =70
                              Size: =42
                              Text: ="◯"
                              Width: =80
                        - EmptyEmployeeMessage:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              AutoHeight: =true
                              Size: =13
                              Text: ="Pilih nama pegawai untuk melihat data"
                              Width: =Parent.Width - 48

Screens:
  S4B_CoachingKarir_Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(9, 33, 98, 1)
      OnVisible: '=UpdateContext({locShowDeleteCK: false})'
    Children:
      - CKDetailScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - CKDetailHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - BtnBackCKDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Back()
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameCKDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - CKDetailHeaderSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =40
            - CKDetailMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                Children:
                  - CKDetailHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =48
                      Children:
                        - CKDetailPageTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Detail Coaching Karir"
                        - BtnEditCKDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(9, 33, 98, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(9, 33, 98, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(gblCoachingKarirEditMode, true);
                                Navigate(S9B_CoachingKarir_Coach_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: ="Edit"
                              Visible: =false
                              Width: =90
                        - BtnDeleteCKDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: '=UpdateContext({locShowDeleteCK: true})'
                              Text: ="Hapus"
                              Visible: =false
                              Width: =90
                  - CKDetailCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 640, 680, 500)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: =If(Parent.Width < 640, 680, 500)
                        PaddingBottom: =If(Parent.Width < 640, 18, 28)
                        PaddingLeft: =If(Parent.Width < 640, 18, 28)
                        PaddingRight: =If(Parent.Width < 640, 18, 28)
                        PaddingTop: =If(Parent.Width < 640, 18, 28)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - CKDetailInfoRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Parent.Width < 640, 252, 78)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =If(Parent.Width < 640, 252, 78)
                              LayoutWrap: =true
                            Children:
                              - CKDetailMentee:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =70
                                    Size: =12
                                    Text: '="MENTEE" & Char(10) & Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingKarir.MenteeNIP, Nama), gblSelectedCoachingKarir.MenteeNIP, "-")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                              - CKDetailDate:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =70
                                    Size: =12
                                    Text: |-
                                      ="TANGGAL" & Char(10) &
                                      If(
                                          IsBlank(gblSelectedCoachingKarir.Tanggal),
                                          "-",
                                          IfError(
                                              Text(gblSelectedCoachingKarir.Tanggal, "[$-id-ID]dd mmmm yyyy"),
                                              Text(Date(1899, 12, 30) + Value(gblSelectedCoachingKarir.Tanggal), "[$-id-ID]dd mmmm yyyy")
                                          )
                                      )
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                              - CKDetailMentor:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =70
                                    Size: =12
                                    Text: '="MENTOR" & Char(10) & Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingKarir.MentorNIP, Nama), gblSelectedCoachingKarir.MentorNIP, "-")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                        - CKDetailDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(235, 235, 235, 1)
                              Height: =1
                              Width: =Parent.Width
                        - CKDetailCatatanLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="CATATAN"
                        - CKDetailCatatan:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =16
                              Text: =Coalesce(gblSelectedCoachingKarir.Catatan, "-")
                        - CKDetailResultLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="HASIL COACHING"
                        - CKDetailResult:
                            Control: ModernText@1.0.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(50, 49, 48, 1)
                              Fill: =RGBA(250, 250, 250, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              Height: =180
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Size: =13
                              Text: =Coalesce(gblSelectedCoachingKarir.FotoBukti, "-")
                              VerticalAlign: =VerticalAlign.Top
      - CKDeleteOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Visible: =Coalesce(locShowDeleteCK, false)
            Width: =Parent.Width
          Children:
            - CKDeleteDialog:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(225, 223, 221, 1)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =220
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =220
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Hide
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Min(480, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
                Children:
                  - CKDeleteTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        Size: =16
                        Text: ="Hapus Coaching Karir?"
                  - CKDeleteMessage:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Text: ="Data yang sudah dihapus tidak dapat dikembalikan."
                        Width: =Parent.Width
                  - CKDeleteActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =46
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =46
                      Children:
                        - BtnCancelDeleteCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              Height: =42
                              OnSelect: '=UpdateContext({locShowDeleteCK: false})'
                              Text: ="Batal"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
                        - BtnConfirmDeleteCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =IfError(
                                    Remove(CoachingKarir, gblSelectedCoachingKarir);
                                    Refresh(CoachingKarir);
                                    UpdateContext({locShowDeleteCK: false});
                                    Notify("Coaching Karir berhasil dihapus.", NotificationType.Success);
                                    Set(gblSelectedCoachingKarir, Defaults(CoachingKarir));
                                    Set(gblCoachingKarirEditMode, false);
                                    Navigate(S4A_CoachingKarir_List, ScreenTransition.Fade),
                                    Notify(
                                        "Gagal menghapus Coaching Karir: " & FirstError.Message,
                                        NotificationType.Error
                                    )
                                )
                              Text: ="Ya, Hapus"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)

Screens:
  S3D_PR_LM_List:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - LMPRScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - LMPRHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - BtnBackLMPR:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Back()
                        PaddingLeft: =20
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameLMPR:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - HeaderSpacerLMPR:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =40
            - LMPRMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - LMPRPageTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(31, 56, 100, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        Size: =18
                        Text: ="Performance Review Tim"
                  - PimpinanContextLMPR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 480, 328, If(Parent.Width < 900, 156, 94))
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =If(Parent.Width < 480, 328, If(Parent.Width < 900, 156, 94))
                        LayoutWrap: =true
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(gblPimpinanView, false)
                      Children:
                        - PRContextNama:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextNama:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="NAMA PEGAWAI"
                              - ValContextNama:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: =Navigate(S11_Pimpinan_DaftarPegawai, ScreenTransition.Fade)
                                    Size: =14
                                    Text: =Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-")
                        - PRContextTanggal:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextTanggal:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="TANGGAL"
                              - ValContextTanggal:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: |-
                                      =With(
                                          {
                                              PRTerbaru:
                                                  First(
                                                      Sort(
                                                          Filter(PerformanceReview, NIP = Text(gblSubjectNIP)),
                                                          Value(Tahun) * 10 + Value(Semester),
                                                          SortOrder.Descending
                                                      )
                                                  )
                                          },
                                          If(IsBlank(PRTerbaru.Tanggal), "-", Text(PRTerbaru.Tanggal, "[$-id-ID]dd mmmm yyyy"))
                                      )
                        - PRContextSemester:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextSemester:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="SEMESTER"
                              - ValContextSemester:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: |-
                                      =Coalesce(
                                          Text(
                                              First(
                                                  Sort(
                                                      Filter(PerformanceReview, NIP = Text(gblSubjectNIP)),
                                                      Value(Tahun) * 10 + Value(Semester),
                                                      SortOrder.Descending
                                                  )
                                              ).Semester
                                          ),
                                          "-"
                                      )
                        - PRContextLineManager:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextLineManager:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="LINE MANAGER"
                              - ValContextLineManager:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: |-
                                      =With(
                                          {
                                              ManagerNIP:
                                                  First(
                                                      Sort(
                                                          Filter(PerformanceReview, NIP = Text(gblSubjectNIP)),
                                                          Value(Tahun) * 10 + Value(Semester),
                                                          SortOrder.Descending
                                                      )
                                                  ).LineManagerNIP
                                          },
                                          Coalesce(LookUp(Pegawai, Title = ManagerNIP, Nama), ManagerNIP, "-")
                                      )
                  - LMPRCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - LMPRColumnHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(243, 246, 250, 1)
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =48
                              PaddingLeft: =12
                              PaddingRight: =12
                              Visible: =App.Width >= 1200
                            Children:
                              - HeaderFotoPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Foto"
                                    Width: =(Parent.Width - 24) * 0.10
                              - HeaderTahunPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Tahun"
                                    Width: =(Parent.Width - 24) * 0.13
                              - HeaderSemesterPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Semester"
                                    Width: =(Parent.Width - 24) * 0.13
                              - HeaderTanggalPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Tanggal"
                                    Width: =(Parent.Width - 24) * 0.18
                              - HeaderManagerPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Pegawai"
                                    Width: =(Parent.Width - 24) * 0.30
                              - HeaderActionPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Aksi"
                                    Width: =(Parent.Width - 24) * 0.16
                        - GalleryLMPR:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Items: |-
                                =Sort(
                                    Filter(
                                        PerformanceReview,
                                        LineManagerNIP = Text(gblCurrentNIP)
                                    ),
                                    Value(Tahun) * 10 + Value(Semester),
                                    SortOrder.Descending
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              TemplatePadding: =0
                              TemplateSize: =If(App.Width < 1200, 152, 92)
                            Children:
                              - RowBackgroundLMPR:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(235, 235, 235, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =If(ThisItem.IsSelected, RGBA(245, 250, 255, 1), RGBA(255, 255, 255, 1))
                                    Height: =Parent.TemplateHeight - 6
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                              - ImgLMPR:
                                  Control: Image@2.2.3
                                  Properties:
                                    Fill: =RGBA(243, 242, 241, 1)
                                    Height: =If(App.Width < 1200, 58, 64)
                                    Image: =ThisItem.FotoBukti
                                    ImagePosition: =ImagePosition.Fit
                                    OnSelect: =Select(Parent)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =If(App.Width < 1200, 58, 64)
                                    X: |-
                                      =If(
                                          App.Width < 1200,
                                          12,
                                          12 + (((Parent.TemplateWidth - 24) * 0.10) - 64) / 2
                                      )
                                    Y: =If(App.Width < 1200, 14, 12)
                              - ValTahunLMPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: =If(App.Width < 1200, "Tahun " & Text(ThisItem.Tahun), Text(ThisItem.Tahun))
                                    Width: =If(App.Width < 1200, 150, (Parent.TemplateWidth - 24) * 0.13)
                                    X: =If(App.Width < 1200, 84, 12 + (Parent.TemplateWidth - 24) * 0.10)
                                    Y: =If(App.Width < 1200, 12, 30)
                              - ValSemesterLMPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =26
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: =If(App.Width < 1200, "Semester " & Text(ThisItem.Semester), Text(ThisItem.Semester))
                                    Width: =If(App.Width < 1200, 150, (Parent.TemplateWidth - 24) * 0.13)
                                    X: =If(App.Width < 1200, 84, 12 + (Parent.TemplateWidth - 24) * 0.23)
                                    Y: =If(App.Width < 1200, 39, 31)
                              - ValTanggalLMPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =28
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: =If(IsBlank(ThisItem.Tanggal), "-", Text(ThisItem.Tanggal, "[$-id-ID]dd mmm yyyy"))
                                    Width: =If(App.Width < 1200, 180, (Parent.TemplateWidth - 24) * 0.18)
                                    X: =If(App.Width < 1200, 84, 12 + (Parent.TemplateWidth - 24) * 0.36)
                                    Y: =If(App.Width < 1200, 64, 31)
                              - ValManagerLMPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =If(App.Width < 1200, 42, 32)
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: |-
                                      =If(
                                          App.Width < 1200,
                                          "Pegawai: " &
                                              Coalesce(
                                                  LookUp(Pegawai, Title = ThisItem.NIP, Nama),
                                                  ThisItem.NIP,
                                                  "-"
                                              ),
                                          Coalesce(
                                              LookUp(Pegawai, Title = ThisItem.NIP, Nama),
                                              ThisItem.NIP,
                                              "-"
                                          )
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 196, (Parent.TemplateWidth - 24) * 0.30)
                                    X: =If(App.Width < 1200, 84, 12 + (Parent.TemplateWidth - 24) * 0.54)
                                    Y: =If(App.Width < 1200, 94, 28)
                              - BtnDetailLMPR:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(9, 33, 98, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    OnSelect: |-
                                      =Set(gblSelectedPR, ThisItem);
                                      Navigate(S3C_PR_Detail, ScreenTransition.Fade)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =11
                                    Text: ="Detail"
                                    Width: =88
                                    X: |-
                                      =If(
                                          App.Width < 1200,
                                          Parent.TemplateWidth - 100,
                                          12 +
                                              (Parent.TemplateWidth - 24) * 0.84 +
                                              (((Parent.TemplateWidth - 24) * 0.16) - 88) / 2
                                      )
                                    Y: =If(App.Width < 1200, 24, 25)

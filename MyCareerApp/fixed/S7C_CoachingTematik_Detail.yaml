Screens:
  S7C_CoachingTematik_Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(9, 33, 98, 1)
      OnVisible: '=UpdateContext({locShowDeleteCT: false})'
    Children:
      - CTDetailScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - CTDetailHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - BtnBackCTDetail:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Kembali"
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        Icon: =Icon.ChevronLeft
                        OnSelect: =Back()
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        Tooltip: ="Kembali"
                        Width: =40
                  - LblAppNameCTDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - CTDetailHeaderSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =40
            - CTDetailMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                Children:
                  - CTDetailHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =48
                      Children:
                        - CTDetailPageTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Detail Coaching Tematik"
                        - BtnEditCTDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(9, 33, 98, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(9, 33, 98, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(gblCoachingTematikEditMode, true);
                                Navigate(S7B_CoachingTematik_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: ="Edit"
                              Visible: |-
                                =And(
                                    !Coalesce(gblPimpinanView, false),
                                    gblSelectedCoachingTematik.MenteeNIP = Text(gblCurrentNIP)
                                )
                              Width: =90
                        - BtnDeleteCTDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: '=UpdateContext({locShowDeleteCT: true})'
                              Text: ="Hapus"
                              Visible: |-
                                =And(
                                    !Coalesce(gblPimpinanView, false),
                                    gblSelectedCoachingTematik.MenteeNIP = Text(gblCurrentNIP)
                                )
                              Width: =90
                  - CTDetailCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =Max(
                              If(Parent.Width < 640, 680, 500),
                              CTDetailInfoRow.Height +
                                  CTDetailDivider.Height +
                                  CTDetailTopikLabel.Height +
                                  CTDetailTopik.Height +
                                  CTDetailResultLabel.Height +
                                  CTDetailResult.Height +
                                  If(Parent.Width < 640, 170, 210)
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: |-
                          =Max(
                              If(Parent.Width < 640, 680, 500),
                              CTDetailInfoRow.Height +
                                  CTDetailDivider.Height +
                                  CTDetailTopikLabel.Height +
                                  CTDetailTopik.Height +
                                  CTDetailResultLabel.Height +
                                  CTDetailResult.Height +
                                  If(Parent.Width < 640, 170, 210)
                          )
                        PaddingBottom: =If(Parent.Width < 640, 18, 28)
                        PaddingLeft: =If(Parent.Width < 640, 18, 28)
                        PaddingRight: =If(Parent.Width < 640, 18, 28)
                        PaddingTop: =If(Parent.Width < 640, 18, 28)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - CTDetailInfoRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: |-
                                =If(
                                    Parent.Width < 640,
                                    CTDetailMentee.Height + CTDetailDate.Height + CTDetailMentor.Height + 32,
                                    Max(CTDetailMentee.Height, CTDetailDate.Height, CTDetailMentor.Height)
                                )
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: |-
                                =If(
                                    Parent.Width < 640,
                                    CTDetailMentee.Height + CTDetailDate.Height + CTDetailMentor.Height + 32,
                                    Max(CTDetailMentee.Height, CTDetailDate.Height, CTDetailMentor.Height)
                                )
                              LayoutWrap: =true
                            Children:
                              - CTDetailMentee:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    Size: =12
                                    Text: '="MENTEE" & Char(10) & Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingTematik.MenteeNIP, Nama), gblSelectedCoachingTematik.MenteeNIP, "-")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                              - CTDetailDate:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    Size: =12
                                    Text: |-
                                      ="TANGGAL" & Char(10) &
                                      If(
                                          IsBlank(gblSelectedCoachingTematik.Tanggal),
                                          "-",
                                          Text(gblSelectedCoachingTematik.Tanggal, "[$-id-ID]dd mmmm yyyy")
                                      )
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                              - CTDetailMentor:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    Size: =12
                                    Text: '="MENTOR" & Char(10) & Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingTematik.MentorNIP, Nama), gblSelectedCoachingTematik.MentorNIP, "-")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                        - CTDetailDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(235, 235, 235, 1)
                              Height: =1
                              Width: =Parent.Width
                        - CTDetailTopikLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="TOPIK"
                              Width: =Parent.Width
                        - CTDetailTopik:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =16
                              Text: =Coalesce(gblSelectedCoachingTematik.Topik, "-")
                              Width: =Parent.Width
                        - CTDetailResultLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="HASIL COACHING"
                              Width: =Parent.Width
                        - CTDetailResult:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(50, 49, 48, 1)
                              Fill: =RGBA(250, 250, 250, 1)
                              Font: =Font.'Open Sans'
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Size: =13
                              Text: =Coalesce(gblSelectedCoachingTematik.HasilCoaching, "-")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
      - CTDeleteOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Visible: =Coalesce(locShowDeleteCT, false)
            Width: =Parent.Width
          Children:
            - CTDeleteDialog:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(225, 223, 221, 1)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =220
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =220
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Hide
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Min(480, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
                Children:
                  - CTDeleteTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: ="Hapus Coaching Tematik?"
                        Width: =Parent.Width
                  - CTDeleteMessage:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Text: ="Data yang sudah dihapus tidak dapat dikembalikan."
                        Width: =Parent.Width
                  - CTDeleteActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =46
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =46
                      Children:
                        - BtnCancelDeleteCT:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              Height: =42
                              OnSelect: '=UpdateContext({locShowDeleteCT: false})'
                              Text: ="Batal"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
                        - BtnConfirmDeleteCT:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =IfError(
                                    Remove(CoachingTematik, gblSelectedCoachingTematik);
                                    Refresh(CoachingTematik);
                                    UpdateContext({locShowDeleteCT: false});
                                    Notify("Coaching Tematik berhasil dihapus.", NotificationType.Success);
                                    Set(gblSelectedCoachingTematik, Defaults(CoachingTematik));
                                    Set(gblCoachingTematikEditMode, false);
                                    Navigate(S7A_CoachingTematik_List, ScreenTransition.Fade),
                                    Notify(
                                        "Gagal menghapus Coaching Tematik: " & FirstError.Message,
                                        NotificationType.Error
                                    )
                                )
                              Text: ="Ya, Hapus"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)

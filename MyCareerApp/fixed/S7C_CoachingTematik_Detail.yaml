Screens:
  S7C_CoachingTematik_Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(9, 33, 98, 1)
      OnVisible: |-
        =If(
            IsEmpty(colNonFormNavigationHistory) ||
            Last(colNonFormNavigationHistory).ScreenName <> App.ActiveScreen.Name,
            Collect(
                colNonFormNavigationHistory,
                {
                    ScreenName: App.ActiveScreen.Name,
                    ScreenRef: App.ActiveScreen
                }
            )
        );
        UpdateContext({locShowDeleteCT: false})
    Children:
      - CTDetailScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - CTDetailHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackCTDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                              =If(
                                  IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                                  If(
                                      !IsEmpty(colNonFormNavigationHistory),
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  ),
                                  If(
                                      CountRows(colNonFormNavigationHistory) > 1,
                                      Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  )
                              )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameCTDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: =If(Coalesce(gblPimpinanView, false), Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-") & " (" & Text(gblSubjectNIP) & ")", "MyCareerApp")
                  - CTDetailHeaderSpacer:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - CTDetailHeaderShadow:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - CTDetailMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - CTDetailHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =48
                      Children:
                        - CTDetailPageTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Detail Coaching Tematik"
                        - BtnEditCTDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(235, 240, 252, 1))
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(9, 33, 98, 1))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: |-
                                =Set(gblCoachingTematikEditMode, true);
                                Navigate(S7B_CoachingTematik_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: ="Edit"
                              Visible: |-
                                =And(
                                    !Coalesce(gblPimpinanView, false),
                                    gblSelectedCoachingTematik.MenteeNIP = Text(gblCurrentNIP)
                                )
                              Width: =90
                        - BtnDeleteCTDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              RadiusTopRight: =6
                              RadiusTopLeft: =6
                              RadiusBottomRight: =6
                              RadiusBottomLeft: =6
                              Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(196, 43, 28, 1))
                              BorderThickness: =0
                              BorderStyle: =BorderStyle.None
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Align: =Align.Center
                              Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: |-
                                =UpdateContext({locShowDeleteCT: true})
                              Text: ="Hapus"
                              Visible: |-
                                =And(
                                    !Coalesce(gblPimpinanView, false),
                                    gblSelectedCoachingTematik.MenteeNIP = Text(gblCurrentNIP)
                                )
                              Width: =90
                  - CTDetailCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =Max(
                              If(Parent.Width < 640, 680, 500),
                              CTDetailInfoRow.Height +
                                  CTDetailDivider.Height +
                                  CTDetailTopikLabel.Height +
                                  CTDetailTopik.Height +
                                  CTDetailResultLabel.Height +
                                  CTDetailResult.Height +
                                  If(Parent.Width < 640, 170, 210)
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: |-
                          =Max(
                              If(Parent.Width < 640, 680, 500),
                              CTDetailInfoRow.Height +
                                  CTDetailDivider.Height +
                                  CTDetailTopikLabel.Height +
                                  CTDetailTopik.Height +
                                  CTDetailResultLabel.Height +
                                  CTDetailResult.Height +
                                  If(Parent.Width < 640, 170, 210)
                          )
                        PaddingBottom: =If(Parent.Width < 640, 18, 28)
                        PaddingLeft: =If(Parent.Width < 640, 18, 28)
                        PaddingRight: =If(Parent.Width < 640, 18, 28)
                        PaddingTop: =If(Parent.Width < 640, 18, 28)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - CTDetailInfoRow:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Parent.Width < 640, 270, 92)
                              LayoutMinHeight: =If(Parent.Width < 640, 270, 92)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - CTDetailMenteeLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="MENTEE"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                              - CTDetailMenteeValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =52
                                    Size: =19
                                    Text: =Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingTematik.MenteeNIP, Nama), gblSelectedCoachingTematik.MenteeNIP, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    Y: =32
                              - CTDetailDateLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="TANGGAL"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, ((Parent.Width - 32) / 3) + 16)
                                    Y: =If(Parent.Width < 640, 90, 0)
                              - CTDetailDateValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =52
                                    Size: =19
                                    Text: |-
                                      =If(
                                          IsBlank(gblSelectedCoachingTematik.Tanggal),
                                          "-",
                                          Text(gblSelectedCoachingTematik.Tanggal, "[$-id-ID]dd mmmm yyyy")
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, ((Parent.Width - 32) / 3) + 16)
                                    Y: =If(Parent.Width < 640, 122, 32)
                              - CTDetailMentorLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="MENTOR"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 32) / 3) + 16) * 2)
                                    Y: =If(Parent.Width < 640, 180, 0)
                              - CTDetailMentorValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =72
                                    Size: =19
                                    Text: =Coalesce(LookUp(Pegawai, Title = gblSelectedCoachingTematik.MentorNIP, Nama), gblSelectedCoachingTematik.MentorNIP, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 32) / 3)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 32) / 3) + 16) * 2)
                                    Y: =If(Parent.Width < 640, 212, 32)
                        - CTDetailDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(235, 235, 235, 1)
                              Height: =1
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CTDetailTopikLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="TOPIK"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CTDetailTopik:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =56
                              Size: =16
                              Text: =Coalesce(gblSelectedCoachingTematik.Topik, "-")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CTDetailResultLabel:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(145, 145, 145, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="HASIL COACHING"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - CTDetailResult:
                            Control: ModernText@1.0.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(50, 49, 48, 1)
                              Fill: =RGBA(250, 250, 250, 1)
                              Font: =Font.'Open Sans'
                              Height: =If(Parent.Width < 640, 180, 120)
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Size: =13
                              Text: =Coalesce(gblSelectedCoachingTematik.HasilCoaching, "-")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
      - CTDeleteOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Visible: =Coalesce(locShowDeleteCT, false)
            Width: =Parent.Width
          Children:
            - CTDeleteDialog:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(225, 223, 221, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =220
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =220
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Min(480, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
                Children:
                  - CTDeleteTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: ="Hapus Coaching Tematik?"
                        Width: =Parent.Width
                  - CTDeleteMessage:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Text: ="Data yang sudah dihapus tidak dapat dikembalikan."
                        Width: =Parent.Width
                  - CTDeleteActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Height: =46
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =46
                        Width: =Parent.Width
                      Children:
                        - BtnCancelDeleteCT:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              Height: =42
                              OnSelect: |-
                                =UpdateContext({locShowDeleteCT: false})
                              Text: ="Batal"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
                        - BtnConfirmDeleteCT:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =IfError(
                                    Remove(CoachingTematik, gblSelectedCoachingTematik);
                                    Refresh(CoachingTematik);
                                    UpdateContext({locShowDeleteCT: false});
                                    Notify("Coaching Tematik berhasil dihapus.", NotificationType.Success);
                                    Set(gblSelectedCoachingTematik, Defaults(CoachingTematik));
                                    Set(gblCoachingTematikEditMode, false);
                                    Navigate(S7A_CoachingTematik_List, ScreenTransition.Fade),
                                    Notify(
                                        "Gagal menghapus Coaching Tematik: " & FirstError.Message,
                                        NotificationType.Error
                                    )
                                )
                              Text: ="Ya, Hapus"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)

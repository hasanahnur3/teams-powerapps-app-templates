Screens:
  S2C_Profil_SertifikasiTier2_Form:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(31, 56, 100, 1)
      OnVisible: |-
        =Set(gblSertifikasiTier2Submitting, false);
        UpdateContext({locConfirmDeleteSertifikasiTier2: false})
    Children:
      - ScreenContainerSertifikasiTier2Form:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - HeaderSertifikasiTier2Form:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackSertifikasiTier2Form:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: |-
                          =Set(gblSertifikasiTier2EditMode, false);
                          Set(gblSertifikasiTier2DetailMode, false);
                          UpdateContext({locConfirmDeleteSertifikasiTier2: false});
                          Set(gblSelectedSertifikasiTier2, Defaults(Profil_SertifikasiTier2));
                          Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNameSertifikasiTier2Form:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - HeaderSpacerSertifikasiTier2Form:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - TopBarShadowSertifikasiTier2Form:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0.08)
                  Height: =5
                  Width: =Parent.Width
            - MainSertifikasiTier2Form:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - CardSertifikasiTier2Form:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =770
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutMinHeight: =770
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - TitleSertifikasiTier2Form:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: =If(Coalesce(gblSertifikasiTier2DetailMode, false), "Detail Sertifikasi Tier 2", If(Coalesce(gblSertifikasiTier2EditMode, false), "Edit Sertifikasi Tier 2", "Tambah Sertifikasi Tier 2"))
                              Width: =Parent.Width
                        - SubtitleSertifikasiTier2Form:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Size: =12
                              Text: |-
                                ="Pegawai: " &
                                Coalesce(
                                    LookUp(
                                        Pegawai,
                                        Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                        Nama
                                    ),
                                    Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                )
                              Width: =Parent.Width
                        - DividerSertifikasiTier2Form:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 223, 221, 1)
                              Height: =1
                              Width: =Parent.Width
                        - FieldNamaSertifikatSertifikasiTier2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblNamaSertifikatSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Nama Sertifikat *"
                                    Width: =Parent.Width
                              - TxtNamaSertifikatSertifikasiTier2:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Nama Sertifikat"
                                    DisplayMode: =If(Coalesce(gblSertifikasiTier2DetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblSertifikasiTier2EditMode, false), Coalesce(gblSelectedSertifikasiTier2.NamaSertifikat, ""), "")
                                    Width: =Parent.Width

                        - FieldPenerbitSertifikasiTier2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblPenerbitSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Penerbit *"
                                    Width: =Parent.Width
                              - TxtPenerbitSertifikasiTier2:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Penerbit"
                                    DisplayMode: =If(Coalesce(gblSertifikasiTier2DetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblSertifikasiTier2EditMode, false), Coalesce(gblSelectedSertifikasiTier2.Penerbit, ""), "")
                                    Width: =Parent.Width

                        - FieldTanggalTerbitSertifikasiTier2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblTanggalTerbitSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal Terbit *"
                                    Width: =Parent.Width
                              - DateTanggalTerbitSertifikasiTier2:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Tanggal Terbit"
                                    DisplayMode: =If(Coalesce(gblSertifikasiTier2DetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    DefaultDate: |-
                                      =If(
                                          Coalesce(gblSertifikasiTier2EditMode, false) && !IsBlank(gblSelectedSertifikasiTier2.TanggalTerbit),
                                          IfError(
                                              Date(1899, 12, 30) + Value(gblSelectedSertifikasiTier2.TanggalTerbit),
                                              gblSelectedSertifikasiTier2.TanggalTerbit
                                          ),
                                          Today()
                                      )
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width

                        - FieldTanggalBerakhirSertifikasiTier2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblTanggalBerakhirSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal Berakhir *"
                                    Width: =Parent.Width
                              - DateTanggalBerakhirSertifikasiTier2:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Tanggal Berakhir"
                                    DisplayMode: =If(Coalesce(gblSertifikasiTier2DetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    DefaultDate: |-
                                      =If(
                                          Coalesce(gblSertifikasiTier2EditMode, false) && !IsBlank(gblSelectedSertifikasiTier2.TanggalBerakhir),
                                          IfError(
                                              Date(1899, 12, 30) + Value(gblSelectedSertifikasiTier2.TanggalBerakhir),
                                              gblSelectedSertifikasiTier2.TanggalBerakhir
                                          ),
                                          Today()
                                      )
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width

                        - FieldNomorSertifikatSertifikasiTier2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblNomorSertifikatSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Nomor Sertifikat *"
                                    Width: =Parent.Width
                              - TxtNomorSertifikatSertifikasiTier2:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Nomor Sertifikat"
                                    DisplayMode: =If(Coalesce(gblSertifikasiTier2DetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblSertifikasiTier2EditMode, false), Coalesce(gblSelectedSertifikasiTier2.NomorSertifikat, ""), "")
                                    Width: =Parent.Width


                        - FormActionsSertifikasiTier2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Coalesce(locConfirmDeleteSertifikasiTier2, false), 104, 48)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =If(Coalesce(locConfirmDeleteSertifikasiTier2, false), 104, 48)
                              LayoutWrap: =true
                              Visible: =!Coalesce(gblSertifikasiTier2DetailMode, false)
                              Width: =Parent.Width
                            Children:
                              - BtnBatalSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =Set(gblSertifikasiTier2EditMode, false);
                                      Set(gblSertifikasiTier2DetailMode, false);
                                      UpdateContext({locConfirmDeleteSertifikasiTier2: false});
                                      Set(gblSelectedSertifikasiTier2, Defaults(Profil_SertifikasiTier2));
                                      Back()
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Batal"
                                    Width: =110
                              - BtnHapusSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(196, 43, 28, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteSertifikasiTier2: true})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Hapus"
                                    Visible: =Coalesce(gblSertifikasiTier2EditMode, false) && !Coalesce(locConfirmDeleteSertifikasiTier2, false)
                                    Width: =110
                              - BtnBatalHapusSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteSertifikasiTier2: false})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Batal Hapus"
                                    Visible: =Coalesce(gblSertifikasiTier2EditMode, false) && Coalesce(locConfirmDeleteSertifikasiTier2, false)
                                    Width: =120
                              - BtnKonfirmasiHapusSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblSertifikasiTier2Submitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          !Coalesce(gblSertifikasiTier2Submitting, false),
                                          Set(gblSertifikasiTier2Submitting, true);
                                          IfError(
                                              Remove(Profil_SertifikasiTier2, gblSelectedSertifikasiTier2);
                                              Refresh(Profil_SertifikasiTier2);
                                              Notify("Data Sertifikasi Tier 2 berhasil dihapus.", NotificationType.Success);
                                              Set(gblSertifikasiTier2Submitting, false);
                                              Set(gblSertifikasiTier2EditMode, false);
                                              Set(gblSertifikasiTier2DetailMode, false);
                                              UpdateContext({locConfirmDeleteSertifikasiTier2: false});
                                              Set(gblSelectedSertifikasiTier2, Defaults(Profil_SertifikasiTier2));
                                              Navigate(S2_ProfilPegawai, ScreenTransition.Fade),
                                              Notify("Gagal menghapus data Sertifikasi Tier 2: " & FirstError.Message, NotificationType.Error);
                                              Set(gblSertifikasiTier2Submitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: =If(Coalesce(gblSertifikasiTier2Submitting, false), "Menghapus...", "Ya, Hapus")
                                    Visible: =Coalesce(gblSertifikasiTier2EditMode, false) && Coalesce(locConfirmDeleteSertifikasiTier2, false)
                                    Width: =120
                              - BtnSimpanSertifikasiTier2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblSertifikasiTier2Submitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(18, 38, 82, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          Or(
                                              IsBlank(Trim(TxtNamaSertifikatSertifikasiTier2.Value)),
                                              IsBlank(Trim(TxtPenerbitSertifikasiTier2.Value)),
                                              IsBlank(DateTanggalTerbitSertifikasiTier2.SelectedDate),
                                              IsBlank(DateTanggalBerakhirSertifikasiTier2.SelectedDate),
                                              IsBlank(Trim(TxtNomorSertifikatSertifikasiTier2.Value))
                                          ),
                                          Notify(
                                              "Lengkapi seluruh field Sertifikasi Tier 2.",
                                              NotificationType.Warning
                                          ),
                                          !Coalesce(gblSertifikasiTier2Submitting, false),
                                          Set(gblSertifikasiTier2Submitting, true);
                                          IfError(
                                              If(
                                                  Coalesce(gblSertifikasiTier2EditMode, false),
                                                  Patch(
                                                      Profil_SertifikasiTier2,
                                                      gblSelectedSertifikasiTier2,
                                                      {
                                                          NIP: gblSelectedSertifikasiTier2.NIP,
                                                          NamaSertifikat: Trim(TxtNamaSertifikatSertifikasiTier2.Value),
                                                          Penerbit: Trim(TxtPenerbitSertifikasiTier2.Value),
                                                          TanggalTerbit: DateTanggalTerbitSertifikasiTier2.SelectedDate,
                                                          TanggalBerakhir: DateTanggalBerakhirSertifikasiTier2.SelectedDate,
                                                          NomorSertifikat: Trim(TxtNomorSertifikatSertifikasiTier2.Value)
                                                      }
                                                  ),
                                                  With(
                                                      {
                                                          newRecord:
                                                              Patch(
                                                                  Profil_SertifikasiTier2,
                                                                  Defaults(Profil_SertifikasiTier2),
                                                                  {
                                                                      Title: "TEMP_" & Text(GUID()),
                                                                      NIP: Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                                                      NamaSertifikat: Trim(TxtNamaSertifikatSertifikasiTier2.Value),
                                                                      Penerbit: Trim(TxtPenerbitSertifikasiTier2.Value),
                                                                      TanggalTerbit: DateTanggalTerbitSertifikasiTier2.SelectedDate,
                                                                      TanggalBerakhir: DateTanggalBerakhirSertifikasiTier2.SelectedDate,
                                                                      NomorSertifikat: Trim(TxtNomorSertifikatSertifikasiTier2.Value)
                                                                  }
                                                              )
                                                      },
                                                      Patch(
                                                          Profil_SertifikasiTier2,
                                                          newRecord,
                                                          {Title: Text(newRecord.ID)}
                                                      )
                                                  )
                                              );
                                              Refresh(Profil_SertifikasiTier2);
                                              Notify(
                                                  If(Coalesce(gblSertifikasiTier2EditMode, false), "Data Sertifikasi Tier 2 berhasil diperbarui.", "Data Sertifikasi Tier 2 berhasil ditambahkan."),
                                                  NotificationType.Success
                                              );
                                              Set(gblSertifikasiTier2Submitting, false);
                                              Set(gblSertifikasiTier2EditMode, false);
                                              Set(gblSertifikasiTier2DetailMode, false);
                                              UpdateContext({locConfirmDeleteSertifikasiTier2: false});
                                              Set(gblSelectedSertifikasiTier2, Defaults(Profil_SertifikasiTier2));
                                              Navigate(S2_ProfilPegawai, ScreenTransition.Fade),
                                              Notify(
                                                  "Gagal menyimpan data Sertifikasi Tier 2: " & FirstError.Message,
                                                  NotificationType.Error
                                              );
                                              Set(gblSertifikasiTier2Submitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: =If(Coalesce(gblSertifikasiTier2Submitting, false), "Menyimpan...", "Simpan")
                                    Visible: =!Coalesce(locConfirmDeleteSertifikasiTier2, false)
                                    Width: =130

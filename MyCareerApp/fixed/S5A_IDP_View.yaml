Screens:
  S5A_IDP_View:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - IDPViewContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - IDPViewTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackIDPView:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: =Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNameIDPView:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - IDPViewTopBarSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - IDPViewTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0.08)
                  Height: =5
                  Width: =Parent.Width
            - IDPViewMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - IDPViewHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =48
                        Width: =Parent.Width
                      Children:
                        - IDPViewTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Individual Development Plan"
                        - BtnTambahIDP:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(18, 38, 82, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(gblIDPEditMode, false);
                                Set(gblSelectedIDP, Defaults(IDP));
                                Navigate(S5B_IDP_Edit, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="+ Tambah"
                              Width: =110
                  - IDPPimpinanContext:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =82
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =82
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(gblPimpinanView, false)
                        Width: =Parent.Width
                      Children:
                        - IDPContextEmployee:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              OnSelect: =Navigate(S11_Pimpinan_DaftarPegawai, ScreenTransition.Fade)
                              Size: =12
                              Text: '="Pegawai: " & Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-")'
                        - IDPContextCount:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(0, 120, 212, 1)
                              Fill: =RGBA(222, 236, 249, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =11
                              Text: '=CountRows(Filter(IDP, NIP = Text(gblSubjectNIP))) & " rencana"'
                              Width: =120
                  - IDPSummaryRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =If(Parent.Width < 640, 172, 80)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =If(Parent.Width < 640, 172, 80)
                        LayoutWrap: =true
                        Width: =Parent.Width
                      Children:
                        - SummaryTotalIDP:
                            Control: ModernText@1.0.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =80
                              PaddingLeft: =16
                              Size: =13
                              Text: |-
                                ="TOTAL RENCANA" & Char(10) &
                                CountRows(
                                    Filter(
                                        IDP,
                                        NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                    )
                                )
                              Width: =If(Parent.Width < 640, (Parent.Width - 12) / 2, (Parent.Width - 24) / 3)
                        - SummaryProsesIDP:
                            Control: ModernText@1.0.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(0, 120, 212, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =80
                              PaddingLeft: =16
                              Size: =13
                              Text: |-
                                ="PROSES" & Char(10) &
                                CountRows(
                                    Filter(
                                        IDP,
                                        NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)) &&
                                        Status = "Proses"
                                    )
                                )
                              Width: =If(Parent.Width < 640, (Parent.Width - 12) / 2, (Parent.Width - 24) / 3)
                        - SummarySelesaiIDP:
                            Control: ModernText@1.0.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(16, 124, 16, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =80
                              PaddingLeft: =16
                              Size: =13
                              Text: |-
                                ="SELESAI" & Char(10) &
                                CountRows(
                                    Filter(
                                        IDP,
                                        NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)) &&
                                        Status = "Selesai"
                                    )
                                )
                              Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 24) / 3)
                  - IDPListCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =180
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - GalleryIDP:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Items: |-
                                =Sort(
                                    Filter(
                                        IDP,
                                        NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                    ),
                                    Value(Tahun) * 100 + Value(ID),
                                    SortOrder.Descending
                                )
                              LayoutMinHeight: =180
                              TemplatePadding: =4
                              TemplateSize: =156
                            Children:
                              - IDPRowCard:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =If(ThisItem.IsSelected, RGBA(245, 250, 255, 1), RGBA(255, 255, 255, 1))
                                    Height: =148
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    PaddingBottom: =12
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =12
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.TemplateWidth - 8
                                  Children:
                                    - IDPRowHeader:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =28
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =28
                                          Width: =Parent.Width
                                        Children:
                                          - IDPRowTitle:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =RGBA(31, 56, 100, 1)
                                                FillPortions: =1
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Bold
                                                Height: =28
                                                OnSelect: =Select(Parent)
                                                Size: =13
                                                Text: =ThisItem.Kategori & " — " & ThisItem.Tipe
                                          - IDPRowStatus:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Align: =Align.Center
                                                Color: |-
                                                  =Switch(
                                                      ThisItem.Status,
                                                      "Selesai", RGBA(16, 124, 16, 1),
                                                      "Proses", RGBA(0, 120, 212, 1),
                                                      "Dibatalkan", RGBA(196, 43, 28, 1),
                                                      RGBA(161, 98, 7, 1)
                                                  )
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =28
                                                OnSelect: =Select(Parent)
                                                Size: =11
                                                Text: =Coalesce(ThisItem.Status, "Rencana")
                                                Width: =100
                                    - IDPRowMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =22
                                          OnSelect: =Select(Parent)
                                          Size: =11
                                          Text: '="Tahun " & Text(ThisItem.Tahun) & " • Target " & Coalesce(ThisItem.Target, "-")'
                                          Width: =Parent.Width
                                    - IDPRowDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =48
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: =Coalesce(ThisItem.Detail, "-")
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.Width
                                    - IDPRowActions:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =30
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutJustifyContent: =LayoutJustifyContent.End
                                          LayoutMinHeight: =30
                                          Width: =Parent.Width
                                        Children:
                                          - BtnEditIDPRow:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(0, 120, 212, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =30
                                                OnSelect: |-
                                                  =Set(gblSelectedIDP, ThisItem);
                                                  Set(gblIDPEditMode, true);
                                                  Navigate(S5B_IDP_Edit, ScreenTransition.Fade)
                                                Size: =11
                                                Text: ="Edit"
                                                Visible: =Value(ThisItem.Tahun) = Year(Today())
                                                Width: =70
                        - IDPEmptyState:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =80
                              Size: =12
                              Text: ="Belum ada rencana pengembangan."
                              Visible: =IsEmpty(GalleryIDP.AllItems)
                              Width: =Parent.Width

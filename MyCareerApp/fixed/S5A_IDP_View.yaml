Screens:
  S5A_IDP_View:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Refresh(CoachingKarir);
        Refresh(ActionItem);
        Refresh(IDP)
    Children:
      - IDPViewContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - IDPViewTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackIDPView:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: =Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNameIDPView:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - IDPViewTopBarSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - IDPViewTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0.08)
                  Height: =5
                  Width: =Parent.Width
            - IDPViewMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =18
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - IDPViewHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =48
                        Width: =Parent.Width
                      Children:
                        - IDPViewTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Individual Development Plan"
                        - BtnTambahIDP:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(18, 38, 82, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(gblIDPEditMode, false);
                                Set(gblSelectedIDP, Defaults(IDP));
                                Navigate(S5B_IDP_Edit, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="+ Tambah"
                              Width: =110
                  - IDPLastCKSection:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =440
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =440
                        Width: =Parent.Width
                      Children:
                        - LastCKActionTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              Size: =18
                              Text: ="Action Items Dari Coaching Karir Terakhir"
                              Width: =Parent.Width
                        - LastCKActionMetaRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =30
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =18
                              LayoutMinHeight: =30
                              Width: =Parent.Width
                            Children:
                              - LastCKActionMeta:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(80, 80, 80, 1)
                                    FillPortions: =0
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    Size: =14
                                    Text: |-
                                      =With(
                                          {
                                              lastCK: First(
                                                  SortByColumns(
                                                      Filter(
                                                          CoachingKarir,
                                                          MenteeNIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                                      ),
                                                      "Tanggal",
                                                      SortOrder.Descending,
                                                      "ID",
                                                      SortOrder.Descending
                                                  )
                                              )
                                          },
                                          If(
                                              IsBlank(lastCK.ID),
                                              "Belum ada sesi Coaching Karir.",
                                              "Sesi " & Text(lastCK.Tanggal, "[$-id-ID]dd mmmm yyyy") &
                                              " — Mentor: " &
                                              Coalesce(LookUp(Pegawai, Title = lastCK.MentorNIP, Nama), lastCK.MentorNIP, "-")
                                          )
                                      )
                                    Width: =Min(520, Parent.Width - 140)
                              - LastCKDetailLink:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(0, 120, 212, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    OnSelect: |-
                                      =With(
                                          {
                                              lastCK: First(
                                                  SortByColumns(
                                                      Filter(
                                                          CoachingKarir,
                                                          MenteeNIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                                      ),
                                                      "Tanggal",
                                                      SortOrder.Descending,
                                                      "ID",
                                                      SortOrder.Descending
                                                  )
                                              )
                                          },
                                          If(
                                              !IsBlank(lastCK.ID),
                                              Set(gblSelectedCoachingKarir, lastCK);
                                              Set(gblCoachingKarirListMode, "Mentee");
                                              Navigate(S9C_CoachingKarir_Detail, ScreenTransition.Fade)
                                          )
                                      )
                                    Size: =14
                                    Text: ="Lihat detail ›"
                                    Visible: |-
                                      =!IsBlank(
                                          First(
                                              SortByColumns(
                                                  Filter(
                                                      CoachingKarir,
                                                      MenteeNIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                                  ),
                                                  "Tanggal",
                                                  SortOrder.Descending,
                                                  "ID",
                                                  SortOrder.Descending
                                              )
                                          ).ID
                                      )
                                    Width: =120
                        - LastCKActionCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =320
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width
                            Children:
                              - GalleryLastCKActionItems:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Items: |-
                                      =With(
                                          {
                                              lastCK: First(
                                                  SortByColumns(
                                                      Filter(
                                                          CoachingKarir,
                                                          MenteeNIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                                      ),
                                                      "Tanggal",
                                                      SortOrder.Descending,
                                                      "ID",
                                                      SortOrder.Descending
                                                  )
                                              )
                                          },
                                          If(
                                              IsBlank(lastCK.ID),
                                              Filter(ActionItem, false),
                                              Sort(
                                                  Filter(ActionItem, CoachingID = lastCK.ID),
                                                  Title,
                                                  SortOrder.Ascending
                                              )
                                          )
                                      )
                                    LayoutMinHeight: =300
                                    TemplatePadding: =0
                                    TemplateSize: =112
                                  Children:
                                    - LastCKActionDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =RGBA(237, 235, 233, 1)
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                                    - LastCKCategoryBadge:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: |-
                                            =Switch(
                                                ThisItem.Kategori,
                                                "Pendidikan (PTB)", RGBA(0, 84, 153, 1),
                                                "Sertifikasi", RGBA(0, 100, 0, 1),
                                                "Exposure", RGBA(98, 48, 180, 1),
                                                RGBA(50, 49, 48, 1)
                                            )
                                          Fill: |-
                                            =Switch(
                                                ThisItem.Kategori,
                                                "Pendidikan (PTB)", RGBA(222, 236, 249, 1),
                                                "Sertifikasi", RGBA(218, 242, 208, 1),
                                                "Exposure", RGBA(239, 224, 255, 1),
                                                RGBA(245, 245, 245, 1)
                                            )
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          RadiusBottomLeft: =14
                                          RadiusBottomRight: =14
                                          RadiusTopLeft: =14
                                          RadiusTopRight: =14
                                          Size: =12
                                          Text: =Coalesce(ThisItem.Kategori, "-")
                                          Width: =If(ThisItem.Kategori = "Pendidikan (PTB)", 150, 120)
                                          X: =32
                                          Y: =26
                                    - LastCKActionType:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          Size: =15
                                          Text: =Coalesce(ThisItem.Tipe.Value, "-")
                                          Width: =Parent.TemplateWidth - LastCKCategoryBadge.X - LastCKCategoryBadge.Width - 60
                                          X: =LastCKCategoryBadge.X + LastCKCategoryBadge.Width + 16
                                          Y: =25
                                    - LastCKActionDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =42
                                          Size: =13
                                          Text: =Coalesce(ThisItem.Detail, "-")
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.TemplateWidth - 64
                                          X: =32
                                          Y: =60
                              - LastCKActionEmpty:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =90
                                    Size: =12
                                    Text: ="Belum ada Action Items dari Coaching Karir terakhir."
                                    Visible: =IsEmpty(GalleryLastCKActionItems.AllItems)
                                    Width: =Parent.Width
                  - IDPAllSection:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =560
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =560
                        Width: =Parent.Width
                      Children:
                        - IDPAllHeading:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =44
                              Width: =Parent.Width
                            Children:
                              - IDPAllTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(31, 56, 100, 1)
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    Size: =18
                                    Text: ="Daftar IDP"
                              - BtnTambahIDP2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(18, 38, 82, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    OnSelect: |-
                                      =Set(gblIDPEditMode, false);
                                      Set(gblSelectedIDP, Defaults(IDP));
                                      Navigate(S5B_IDP_Edit, ScreenTransition.Fade)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="+ Tambah"
                                    Width: =110
                        - IDPTableCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =480
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width
                            Children:
                              - IDPTableHeader:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =RGBA(250, 249, 248, 1)
                                    FillPortions: =0
                                    Height: =70
                                    LayoutMinHeight: =70
                                    Width: =Parent.Width
                                  Children:
                                    - HeaderTahunIDP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Size: =13
                                          Text: ="TAHUN"
                                          Width: =110
                                          X: =32
                                          Y: =18
                                    - HeaderKategoriIDP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Size: =13
                                          Text: ="KATEGORI"
                                          Width: =190
                                          X: =160
                                          Y: =18
                                    - HeaderTipeIDP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Size: =13
                                          Text: ="TIPE"
                                          Width: =270
                                          X: =370
                                          Y: =18
                                    - HeaderDetailIDP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Size: =13
                                          Text: ="DESKRIPSI / KOMITMEN"
                                          Width: =420
                                          X: =660
                                          Y: =18
                                    - HeaderTargetIDP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Size: =13
                                          Text: ="TARGET"
                                          Width: =140
                                          X: =Parent.Width - 330
                                          Y: =18
                                    - HeaderStatusIDP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Size: =13
                                          Text: ="STATUS"
                                          Width: =140
                                          X: =Parent.Width - 180
                                          Y: =18
                              - GalleryIDP:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Items: |-
                                      =Sort(
                                          IDP,
                                          Value(Tahun) * 100 + Value(ID),
                                          SortOrder.Descending
                                      )
                                    LayoutMinHeight: =380
                                    TemplatePadding: =0
                                    TemplateSize: =105
                                  Children:
                                    - IDPTableDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =RGBA(237, 235, 233, 1)
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                                    - IDPRowTahun:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =44
                                          Size: =13
                                          Text: =Text(ThisItem.Tahun)
                                          Width: =110
                                          X: =32
                                          Y: =30
                                    - IDPRowKategoriBadge:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: |-
                                            =Switch(
                                                ThisItem.Kategori,
                                                "Pendidikan (PTB)", RGBA(0, 84, 153, 1),
                                                "Sertifikasi", RGBA(0, 100, 0, 1),
                                                "Exposure", RGBA(98, 48, 180, 1),
                                                RGBA(50, 49, 48, 1)
                                            )
                                          Fill: |-
                                            =Switch(
                                                ThisItem.Kategori,
                                                "Pendidikan (PTB)", RGBA(222, 236, 249, 1),
                                                "Sertifikasi", RGBA(218, 242, 208, 1),
                                                "Exposure", RGBA(239, 224, 255, 1),
                                                RGBA(245, 245, 245, 1)
                                            )
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          RadiusBottomLeft: =14
                                          RadiusBottomRight: =14
                                          RadiusTopLeft: =14
                                          RadiusTopRight: =14
                                          Size: =11
                                          Text: =Coalesce(ThisItem.Kategori, "-")
                                          Width: =If(ThisItem.Kategori = "Pendidikan (PTB)", 150, 120)
                                          X: =160
                                          Y: =38
                                    - IDPRowTipe:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =50
                                          Size: =13
                                          Text: =Coalesce(ThisItem.Tipe.Value, "-")
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =270
                                          X: =370
                                          Y: =28
                                    - IDPRowDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =58
                                          Size: =13
                                          Text: =Coalesce(ThisItem.Detail, "-")
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Max(260, Parent.TemplateWidth - 1030)
                                          X: =660
                                          Y: =24
                                    - IDPRowTargetBadge:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(0, 84, 153, 1)
                                          Fill: =RGBA(222, 236, 249, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          RadiusBottomLeft: =14
                                          RadiusBottomRight: =14
                                          RadiusTopLeft: =14
                                          RadiusTopRight: =14
                                          Size: =11
                                          Text: =Coalesce(ThisItem.Target, "-")
                                          Width: =74
                                          X: =Parent.TemplateWidth - 330
                                          Y: =38
                                    - IDPRowStatusBadge:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: |-
                                            =Switch(
                                                ThisItem.Status,
                                                "Selesai", RGBA(0, 100, 0, 1),
                                                "Proses", RGBA(0, 84, 153, 1),
                                                "Dibatalkan", RGBA(196, 43, 28, 1),
                                                RGBA(161, 98, 7, 1)
                                            )
                                          Fill: |-
                                            =Switch(
                                                ThisItem.Status,
                                                "Selesai", RGBA(218, 242, 208, 1),
                                                "Proses", RGBA(222, 236, 249, 1),
                                                "Dibatalkan", RGBA(253, 231, 233, 1),
                                                RGBA(255, 244, 206, 1)
                                            )
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          OnSelect: |-
                                            =Set(gblSelectedIDP, ThisItem);
                                            Set(gblIDPEditMode, true);
                                            Navigate(S5B_IDP_Edit, ScreenTransition.Fade)
                                          RadiusBottomLeft: =14
                                          RadiusBottomRight: =14
                                          RadiusTopLeft: =14
                                          RadiusTopRight: =14
                                          Size: =11
                                          Text: =Coalesce(ThisItem.Status, "Rencana")
                                          Width: =120
                                          X: =Parent.TemplateWidth - 180
                                          Y: =38
                              - IDPEmptyState:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =80
                                    Size: =12
                                    Text: ="Belum ada IDP di sistem."
                                    Visible: =IsEmpty(GalleryIDP.AllItems)
                                    Width: =Parent.Width

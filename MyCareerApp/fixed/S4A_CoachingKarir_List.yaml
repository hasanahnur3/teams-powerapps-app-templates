Screens:
  S4A_CoachingKarir_List:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(9, 33, 98, 1)
      OnVisible: |-
        =Refresh(CoachingKarir);
        Set(gblSelectedCoachingKarir, Defaults(CoachingKarir));
        Set(gblCoachingKarirEditMode, false)
    Children:
      - CKListScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - CKListHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - BtnBackCKList:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Back()
                        PaddingLeft: =20
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameCKList:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - HeaderSpacerCKList:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =40
            - CKListMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - CKListTitleRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =48
                      Children:
                        - CKListPageTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =36
                              Size: =18
                              Text: ="Coaching Karir"
                        - BtnCreateCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(9, 33, 98, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =Set(gblCoachingKarirEditMode, false);
                                Set(gblSelectedCoachingKarir, Defaults(CoachingKarir));
                                Navigate(S9B_CoachingKarir_Coach_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: =If(App.Width < 520, "+ Baru", "+ Buat Baru")
                              Visible: =false
                              Width: =If(App.Width < 520, 90, 130)
                  - PimpinanContextCK:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 620, 208, 82)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =If(Parent.Width < 620, 208, 82)
                        LayoutWrap: =true
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(gblPimpinanView, false)
                      Children:
                        - PimpinanEmployeeCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              OnSelect: =Navigate(S11_Pimpinan_DaftarPegawai, ScreenTransition.Fade)
                              PaddingLeft: =8
                              Size: =12
                              Text: '="Pegawai: " & Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP))'
                              Width: =If(Parent.Width < 620, Parent.Width - 32, Max(200, Parent.Width - 460))
                        - PimpinanTabProfileCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: =Navigate(S2_ProfilPegawai, ScreenTransition.Fade)
                              Size: =11
                              Text: ="Profil"
                              Width: =90
                        - PimpinanTabPRCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: =Navigate(S3A_PR_List_Table, ScreenTransition.Fade)
                              Size: =11
                              Text: ="Performance Review"
                              Width: =150
                        - PimpinanTabActiveCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(0, 120, 212, 1)
                              Fill: =RGBA(222, 236, 249, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Size: =11
                              Text: ="Coaching Karir"
                              Width: =140
                  - CKListCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - CKTableHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(243, 246, 250, 1)
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =48
                              PaddingLeft: =12
                              PaddingRight: =12
                              Visible: =App.Width >= 1200
                            Children:
                              - HeaderTanggalCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Tanggal"
                                    Width: =(Parent.Width - 24) * 0.20
                              - HeaderCatatanCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Catatan"
                                    Width: =(Parent.Width - 24) * 0.42
                              - HeaderMentorCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Mentor"
                                    Width: =(Parent.Width - 24) * 0.23
                              - HeaderActionCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Aksi"
                                    Width: =(Parent.Width - 24) * 0.15
                        - GalleryCKList:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Items: |-
                                =Sort(
                                    Filter(
                                        CoachingKarir,
                                        MenteeNIP = Text(
                                            If(
                                                Coalesce(gblPimpinanView, false),
                                                gblSubjectNIP,
                                                gblCurrentNIP
                                            )
                                        )
                                    ),
                                    Tanggal,
                                    SortOrder.Descending
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Set(gblSelectedCoachingKarir, ThisItem);
                                Navigate(S4B_CoachingKarir_Detail, ScreenTransition.Fade)
                              TemplatePadding: =0
                              TemplateSize: =If(App.Width < 1200, 164, 84)
                            Children:
                              - RowBackgroundCK:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(235, 235, 235, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =If(ThisItem.IsSelected, RGBA(245, 250, 255, 1), RGBA(255, 255, 255, 1))
                                    Height: =Parent.TemplateHeight - 6
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                              - ValTanggalCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(ThisItem.Tanggal),
                                          "-",
                                          IfError(
                                              Text(
                                                  ThisItem.Tanggal,
                                                  "[$-id-ID]dd mmmm yyyy"
                                              ),
                                              Text(
                                                  Date(1899, 12, 30) + Value(ThisItem.Tanggal),
                                                  "[$-id-ID]dd mmmm yyyy"
                                              )
                                          )
                                      )
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 120, (Parent.TemplateWidth - 24) * 0.20)
                                    X: =If(App.Width < 1200, 16, 12)
                                    Y: =If(App.Width < 1200, 14, 25)
                              - ValCatatanCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =If(App.Width < 1200, 46, 38)
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: =Coalesce(ThisItem.Catatan, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 132, (Parent.TemplateWidth - 24) * 0.42)
                                    X: =If(App.Width < 1200, 16, 12 + (Parent.TemplateWidth - 24) * 0.20)
                                    Y: =If(App.Width < 1200, 48, 22)
                              - ValMentorCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =If(App.Width < 1200, 38, 32)
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: |-
                                      =If(
                                          App.Width < 1200,
                                          "Mentor: " &
                                              Coalesce(
                                                  LookUp(Pegawai, Title = ThisItem.MentorNIP, Nama),
                                                  ThisItem.MentorNIP,
                                                  "-"
                                              ),
                                          Coalesce(
                                              LookUp(Pegawai, Title = ThisItem.MentorNIP, Nama),
                                              ThisItem.MentorNIP,
                                              "-"
                                          )
                                      )
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 132, (Parent.TemplateWidth - 24) * 0.23)
                                    X: =If(App.Width < 1200, 16, 12 + (Parent.TemplateWidth - 24) * 0.62)
                                    Y: =If(App.Width < 1200, 100, 25)
                              - BtnDetailCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(9, 33, 98, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    OnSelect: |-
                                      =Set(gblSelectedCoachingKarir, ThisItem);
                                      Navigate(S4B_CoachingKarir_Detail, ScreenTransition.Fade)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =11
                                    Text: ="Detail"
                                    Width: =88
                                    X: |-
                                      =If(
                                          App.Width < 1200,
                                          Parent.TemplateWidth - 104,
                                          12 +
                                              (Parent.TemplateWidth - 24) * 0.85 +
                                              (((Parent.TemplateWidth - 24) * 0.15) - 88) / 2
                                      )
                                    Y: =If(App.Width < 1200, 18, 22)
                  - CKEmptyState:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(96, 94, 92, 1)
                        Font: =Font.'Open Sans'
                        Height: =80
                        Size: =13
                        Text: ="Belum ada data Coaching Karir."
                        Visible: =IsEmpty(GalleryCKList.AllItems)

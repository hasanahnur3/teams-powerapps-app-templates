Screens:
  S2F_Profil_Penugasan_Form:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(31, 56, 100, 1)
    Children:
      - ScreenContainerPenugasanForm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - HeaderPenugasanForm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackPenugasanForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: |-
                          =Set(gblPenugasanEditMode, false);
                          Set(gblSelectedPenugasan, Defaults(Profil_Penugasan));
                          Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNamePenugasanForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - HeaderSpacerPenugasanForm:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - TopBarShadowPenugasanForm:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0.08)
                  Height: =5
                  Width: =Parent.Width
            - MainPenugasanForm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - CardPenugasanForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =812
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutMinHeight: =812
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - TitlePenugasanForm:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: =If(Coalesce(gblPenugasanEditMode, false), "Edit Penugasan", "Tambah Penugasan")
                              Width: =Parent.Width
                        - SubtitlePenugasanForm:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Size: =12
                              Text: |-
                                ="Pegawai: " &
                                Coalesce(
                                    LookUp(
                                        Pegawai,
                                        Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                        Nama
                                    ),
                                    Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                )
                              Width: =Parent.Width
                        - DividerPenugasanForm:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 223, 221, 1)
                              Height: =1
                              Width: =Parent.Width
                        - FieldTglMulaiPenugasan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblTglMulaiPenugasan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal Mulai *"
                                    Width: =Parent.Width
                              - DateTglMulaiPenugasan:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Tanggal Mulai"
                                    DefaultDate: =If(Coalesce(gblPenugasanEditMode, false), Date(1899, 12, 30) + Value(gblSelectedPenugasan.TglMulai), Today())
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width

                        - FieldTglAkhirPenugasan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblTglAkhirPenugasan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal Akhir *"
                                    Width: =Parent.Width
                              - DateTglAkhirPenugasan:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Tanggal Akhir"
                                    DefaultDate: =If(Coalesce(gblPenugasanEditMode, false), Date(1899, 12, 30) + Value(gblSelectedPenugasan.TglAkhir), Today())
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width

                        - FieldPICPenugasan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblPICPenugasan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="PIC *"
                                    Width: =Parent.Width
                              - TxtPICPenugasan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="PIC"
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblPenugasanEditMode, false), Coalesce(gblSelectedPenugasan.PIC, ""), "")
                                    Width: =Parent.Width

                        - FieldNamaPenugasanPenugasan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblNamaPenugasanPenugasan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Nama Penugasan *"
                                    Width: =Parent.Width
                              - TxtNamaPenugasanPenugasan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Nama Penugasan"
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblPenugasanEditMode, false), Coalesce(gblSelectedPenugasan.NamaPenugasan, ""), "")
                                    Width: =Parent.Width

                        - FieldDeskripsiPenugasan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =118
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =118
                              Width: =Parent.Width
                            Children:
                              - LblDeskripsiPenugasan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Deskripsi *"
                                    Width: =Parent.Width
                              - TxtDeskripsiPenugasan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Deskripsi"
                                    Height: =76
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeMultiline"
                                    Value: =If(Coalesce(gblPenugasanEditMode, false), Coalesce(gblSelectedPenugasan.Deskripsi, ""), "")
                                    Width: =Parent.Width


                        - FormActionsPenugasan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =48
                              Width: =Parent.Width
                            Children:
                              - BtnBatalPenugasan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =Set(gblPenugasanEditMode, false);
                                      Set(gblSelectedPenugasan, Defaults(Profil_Penugasan));
                                      Back()
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Batal"
                                    Width: =110
                              - BtnSimpanPenugasan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblPenugasanSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(18, 38, 82, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          Or(
                                              IsBlank(DateTglMulaiPenugasan.SelectedDate),
                                              IsBlank(DateTglAkhirPenugasan.SelectedDate),
                                              IsBlank(Trim(TxtPICPenugasan.Value)),
                                              IsBlank(Trim(TxtNamaPenugasanPenugasan.Value)),
                                              IsBlank(Trim(TxtDeskripsiPenugasan.Value))
                                          ),
                                          Notify(
                                              "Lengkapi seluruh field Penugasan.",
                                              NotificationType.Warning
                                          ),
                                          !Coalesce(gblPenugasanSubmitting, false),
                                          Set(gblPenugasanSubmitting, true);
                                          IfError(
                                              If(
                                                  Coalesce(gblPenugasanEditMode, false),
                                                  Patch(
                                                      Profil_Penugasan,
                                                      gblSelectedPenugasan,
                                                      {
                                                          NIP: gblSelectedPenugasan.NIP,
                                                          TglMulai: DateDiff(Date(1899, 12, 30), DateTglMulaiPenugasan.SelectedDate, TimeUnit.Days),
                                                          TglAkhir: DateDiff(Date(1899, 12, 30), DateTglAkhirPenugasan.SelectedDate, TimeUnit.Days),
                                                          PIC: Trim(TxtPICPenugasan.Value),
                                                          NamaPenugasan: Trim(TxtNamaPenugasanPenugasan.Value),
                                                          Deskripsi: Trim(TxtDeskripsiPenugasan.Value)
                                                      }
                                                  ),
                                                  With(
                                                      {
                                                          newRecord:
                                                              Patch(
                                                                  Profil_Penugasan,
                                                                  Defaults(Profil_Penugasan),
                                                                  {
                                                                      Title: "TEMP_" & Text(GUID()),
                                                                      NIP: Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                                                      TglMulai: DateDiff(Date(1899, 12, 30), DateTglMulaiPenugasan.SelectedDate, TimeUnit.Days),
                                                                      TglAkhir: DateDiff(Date(1899, 12, 30), DateTglAkhirPenugasan.SelectedDate, TimeUnit.Days),
                                                                      PIC: Trim(TxtPICPenugasan.Value),
                                                                      NamaPenugasan: Trim(TxtNamaPenugasanPenugasan.Value),
                                                                      Deskripsi: Trim(TxtDeskripsiPenugasan.Value)
                                                                  }
                                                              )
                                                      },
                                                      Patch(
                                                          Profil_Penugasan,
                                                          newRecord,
                                                          {Title: Text(newRecord.ID)}
                                                      )
                                                  )
                                              );
                                              Refresh(Profil_Penugasan);
                                              Notify(
                                                  If(Coalesce(gblPenugasanEditMode, false), "Data Penugasan berhasil diperbarui.", "Data Penugasan berhasil ditambahkan."),
                                                  NotificationType.Success
                                              );
                                              Set(gblPenugasanSubmitting, false);
                                              Set(gblPenugasanEditMode, false);
                                              Set(gblSelectedPenugasan, Defaults(Profil_Penugasan));
                                              Navigate(S2_ProfilPegawai, ScreenTransition.Fade),
                                              Notify(
                                                  "Gagal menyimpan data Penugasan: " & FirstError.Message,
                                                  NotificationType.Error
                                              );
                                              Set(gblPenugasanSubmitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: =If(Coalesce(gblPenugasanSubmitting, false), "Menyimpan...", "Simpan")
                                    Width: =130

Screens:
  S2H_Profil_Kepanitiaan_Form:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(31, 56, 100, 1)
      OnVisible: |-
        =Set(gblKepanitiaanSubmitting, false);
        UpdateContext({locConfirmDeleteKepanitiaan: false})
    Children:
      - ScreenContainerKepanitiaanForm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            Width: =Parent.Width
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
          Children:
            - HeaderKepanitiaanForm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackKepanitiaanForm:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                              =Set(gblKepanitiaanEditMode, false);
                              Set(gblKepanitiaanDetailMode, false);
                              UpdateContext({locConfirmDeleteKepanitiaan: false});
                              Set(gblSelectedKepanitiaan, Defaults(Profil_Kepanitiaan));
                              If(
                                  IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                                  If(
                                      !IsEmpty(colNonFormNavigationHistory),
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  ),
                                  If(
                                      CountRows(colNonFormNavigationHistory) > 1,
                                      Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  )
                              )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameKepanitiaanForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - HeaderSpacerKepanitiaanForm:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - TopBarShadowKepanitiaanForm:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - MainKepanitiaanForm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - CardKepanitiaanForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =1000
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutMinHeight: =1000
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - TitleKepanitiaanForm:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: =If(Coalesce(gblKepanitiaanDetailMode, false), "Detail Kepanitiaan", If(Coalesce(gblKepanitiaanEditMode, false), "Edit Kepanitiaan", "Tambah Kepanitiaan"))
                              Width: =Parent.Width
                        - SubtitleKepanitiaanForm:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Size: =12
                              Text: |-
                                ="Pegawai: " &
                                Coalesce(
                                    LookUp(
                                        Pegawai,
                                        Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                        Nama
                                    ),
                                    Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                )
                              Width: =Parent.Width
                        - DividerKepanitiaanForm:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 223, 221, 1)
                              Height: =1
                              Width: =Parent.Width
                        - FieldNamaKepanitiaanKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblNamaKepanitiaanKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Nama Kepanitiaan *"
                                    Width: =Parent.Width
                              - TxtNamaKepanitiaanKepanitiaan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Nama Kepanitiaan"
                                    DisplayMode: =If(Coalesce(gblKepanitiaanDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblKepanitiaanEditMode, false) || Coalesce(gblKepanitiaanDetailMode, false), Coalesce(gblSelectedKepanitiaan.NamaKepanitiaan, ""), "")
                                    Width: =Parent.Width

                        - FieldPosisiKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblPosisiKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Posisi *"
                                    Width: =Parent.Width
                              - TxtPosisiKepanitiaan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Posisi"
                                    DisplayMode: =If(Coalesce(gblKepanitiaanDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblKepanitiaanEditMode, false) || Coalesce(gblKepanitiaanDetailMode, false), Coalesce(gblSelectedKepanitiaan.Posisi, ""), "")
                                    Width: =Parent.Width

                        - FieldInstitusiKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblInstitusiKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Institusi *"
                                    Width: =Parent.Width
                              - TxtInstitusiKepanitiaan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Institusi"
                                    DisplayMode: =If(Coalesce(gblKepanitiaanDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblKepanitiaanEditMode, false) || Coalesce(gblKepanitiaanDetailMode, false), Coalesce(gblSelectedKepanitiaan.Institusi, ""), "")
                                    Width: =Parent.Width

                        - FieldUraianTugasKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =118
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =118
                              Width: =Parent.Width
                            Children:
                              - LblUraianTugasKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Uraian Tugas *"
                                    Width: =Parent.Width
                              - TxtUraianTugasKepanitiaan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Uraian Tugas"
                                    DisplayMode: =If(Coalesce(gblKepanitiaanDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Height: =76
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeMultiline"
                                    Value: =If(Coalesce(gblKepanitiaanEditMode, false) || Coalesce(gblKepanitiaanDetailMode, false), Coalesce(gblSelectedKepanitiaan.UraianTugas, ""), "")
                                    Width: =Parent.Width

                        - FieldProdukKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblProdukKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Produk *"
                                    Width: =Parent.Width
                              - TxtProdukKepanitiaan:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Produk"
                                    DisplayMode: =If(Coalesce(gblKepanitiaanDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblKepanitiaanEditMode, false) || Coalesce(gblKepanitiaanDetailMode, false), Coalesce(gblSelectedKepanitiaan.Produk, ""), "")
                                    Width: =Parent.Width

                        - FieldStartDateKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblStartDateKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal Mulai *"
                                    Width: =Parent.Width
                              - DateStartDateKepanitiaan:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Tanggal Mulai"
                                    DisplayMode: =If(Coalesce(gblKepanitiaanDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    DefaultDate: |-
                                      =If(
                                          (Coalesce(gblKepanitiaanEditMode, false) || Coalesce(gblKepanitiaanDetailMode, false)) && !IsBlank(gblSelectedKepanitiaan.StartDate),
                                          IfError(
                                              Date(1899, 12, 30) + Value(gblSelectedKepanitiaan.StartDate),
                                              gblSelectedKepanitiaan.StartDate
                                          ),
                                          Today()
                                      )
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width

                        - FieldEndDateKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblEndDateKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal Selesai *"
                                    Width: =Parent.Width
                              - DateEndDateKepanitiaan:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Tanggal Selesai"
                                    DisplayMode: =If(Coalesce(gblKepanitiaanDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    DefaultDate: |-
                                      =If(
                                          (Coalesce(gblKepanitiaanEditMode, false) || Coalesce(gblKepanitiaanDetailMode, false)) && !IsBlank(gblSelectedKepanitiaan.EndDate),
                                          IfError(
                                              Date(1899, 12, 30) + Value(gblSelectedKepanitiaan.EndDate),
                                              gblSelectedKepanitiaan.EndDate
                                          ),
                                          Today()
                                      )
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width


                        - FormActionsKepanitiaan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Coalesce(locConfirmDeleteKepanitiaan, false), 104, 48)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =If(Coalesce(locConfirmDeleteKepanitiaan, false), 104, 48)
                              LayoutWrap: =true
                              Visible: =!Coalesce(gblKepanitiaanDetailMode, false) && !Coalesce(gblPimpinanView, false)
                              Width: =Parent.Width
                            Children:
                              - BtnBatalKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =Set(gblKepanitiaanEditMode, false);
                                      Set(gblKepanitiaanDetailMode, false);
                                      UpdateContext({locConfirmDeleteKepanitiaan: false});
                                      Set(gblSelectedKepanitiaan, Defaults(Profil_Kepanitiaan));
                                      Back()
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Batal"
                                    Width: =110
                              - BtnHapusKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(196, 43, 28, 1))
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteKepanitiaan: true})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Hapus"
                                    Visible: =Coalesce(gblKepanitiaanEditMode, false) && !Coalesce(locConfirmDeleteKepanitiaan, false)
                                    Width: =110
                              - BtnBatalHapusKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteKepanitiaan: false})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Batal Hapus"
                                    Visible: =Coalesce(gblKepanitiaanEditMode, false) && Coalesce(locConfirmDeleteKepanitiaan, false)
                                    Width: =120
                              - BtnKonfirmasiHapusKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblPimpinanView, false) || Coalesce(gblKepanitiaanSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          !Coalesce(gblKepanitiaanSubmitting, false),
                                          Set(gblKepanitiaanSubmitting, true);
                                          IfError(
                                              Remove(Profil_Kepanitiaan, gblSelectedKepanitiaan);
                                              Refresh(Profil_Kepanitiaan);
                                              Notify("Data Kepanitiaan berhasil dihapus.", NotificationType.Success);
                                              Set(gblKepanitiaanSubmitting, false);
                                              Set(gblKepanitiaanEditMode, false);
                                              Set(gblKepanitiaanDetailMode, false);
                                              UpdateContext({locConfirmDeleteKepanitiaan: false});
                                              Set(gblSelectedKepanitiaan, Defaults(Profil_Kepanitiaan));
                                              Navigate(S2_ProfilPegawai, ScreenTransition.Fade),
                                              Notify("Gagal menghapus data Kepanitiaan: " & FirstError.Message, NotificationType.Error);
                                              Set(gblKepanitiaanSubmitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: =If(Coalesce(gblKepanitiaanSubmitting, false), "Menghapus...", "Ya, Hapus")
                                    Visible: =Coalesce(gblKepanitiaanEditMode, false) && Coalesce(locConfirmDeleteKepanitiaan, false)
                                    Width: =120
                              - BtnSimpanKepanitiaan:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblPimpinanView, false) || Coalesce(gblKepanitiaanSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(18, 38, 82, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          Or(
                                              IsBlank(Trim(TxtNamaKepanitiaanKepanitiaan.Value)),
                                              IsBlank(Trim(TxtPosisiKepanitiaan.Value)),
                                              IsBlank(Trim(TxtInstitusiKepanitiaan.Value)),
                                              IsBlank(Trim(TxtUraianTugasKepanitiaan.Value)),
                                              IsBlank(Trim(TxtProdukKepanitiaan.Value)),
                                              IsBlank(DateStartDateKepanitiaan.SelectedDate),
                                              IsBlank(DateEndDateKepanitiaan.SelectedDate)
                                          ),
                                          Notify(
                                              "Lengkapi seluruh field Kepanitiaan.",
                                              NotificationType.Warning
                                          ),
                                          !Coalesce(gblKepanitiaanSubmitting, false),
                                          Set(gblKepanitiaanSubmitting, true);
                                          IfError(
                                              If(
                                                  Coalesce(gblKepanitiaanEditMode, false),
                                                  Patch(
                                                      Profil_Kepanitiaan,
                                                      gblSelectedKepanitiaan,
                                                      {
                                                          NIP: gblSelectedKepanitiaan.NIP,
                                                          NamaKepanitiaan: Trim(TxtNamaKepanitiaanKepanitiaan.Value),
                                                          Posisi: Trim(TxtPosisiKepanitiaan.Value),
                                                          Institusi: Trim(TxtInstitusiKepanitiaan.Value),
                                                          UraianTugas: Trim(TxtUraianTugasKepanitiaan.Value),
                                                          Produk: Trim(TxtProdukKepanitiaan.Value),
                                                          StartDate: DateStartDateKepanitiaan.SelectedDate,
                                                          EndDate: DateEndDateKepanitiaan.SelectedDate
                                                      }
                                                  ),
                                                  With(
                                                      {
                                                          newRecord:
                                                              Patch(
                                                                  Profil_Kepanitiaan,
                                                                  Defaults(Profil_Kepanitiaan),
                                                                  {
                                                                      Title: "TEMP_" & Text(GUID()),
                                                                      NIP: Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                                                      NamaKepanitiaan: Trim(TxtNamaKepanitiaanKepanitiaan.Value),
                                                                      Posisi: Trim(TxtPosisiKepanitiaan.Value),
                                                                      Institusi: Trim(TxtInstitusiKepanitiaan.Value),
                                                                      UraianTugas: Trim(TxtUraianTugasKepanitiaan.Value),
                                                                      Produk: Trim(TxtProdukKepanitiaan.Value),
                                                                      StartDate: DateStartDateKepanitiaan.SelectedDate,
                                                                      EndDate: DateEndDateKepanitiaan.SelectedDate
                                                                  }
                                                              )
                                                      },
                                                      Patch(
                                                          Profil_Kepanitiaan,
                                                          newRecord,
                                                          {Title: Text(newRecord.ID)}
                                                      )
                                                  )
                                              );
                                              Refresh(Profil_Kepanitiaan);
                                              Notify(
                                                  If(Coalesce(gblKepanitiaanEditMode, false), "Data Kepanitiaan berhasil diperbarui.", "Data Kepanitiaan berhasil ditambahkan."),
                                                  NotificationType.Success
                                              );
                                              Set(gblKepanitiaanSubmitting, false);
                                              Set(gblKepanitiaanEditMode, false);
                                              Set(gblKepanitiaanDetailMode, false);
                                              UpdateContext({locConfirmDeleteKepanitiaan: false});
                                              Set(gblSelectedKepanitiaan, Defaults(Profil_Kepanitiaan));
                                              Navigate(S2_ProfilPegawai, ScreenTransition.Fade),
                                              Notify(
                                                  "Gagal menyimpan data Kepanitiaan: " & FirstError.Message,
                                                  NotificationType.Error
                                              );
                                              Set(gblKepanitiaanSubmitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: =If(Coalesce(gblKepanitiaanSubmitting, false), "Menyimpan...", "Simpan")
                                    Visible: =!Coalesce(locConfirmDeleteKepanitiaan, false)
                                    Width: =130

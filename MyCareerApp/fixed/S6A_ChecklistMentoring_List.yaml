Screens:
  S6A_ChecklistMentoring_List:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - ChecklistListContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - ChecklistListTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - BtnBackChecklistList:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Back()
                        PaddingLeft: =20
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameChecklistList:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - ChecklistListTopBarSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =40
            - ChecklistListMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - ChecklistListHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(Parent.Width < 600, 96, 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =If(Parent.Width < 600, 96, 44)
                        LayoutWrap: =true
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - ChecklistListTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Daftar Checklist Mentoring"
                        - BtnTambahChecklist:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(9, 33, 98, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(gblChecklistEditMode, false);
                                Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                Navigate(S6B_ChecklistMentoring_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="+ Tambah Checklist Mentoring"
                              Visible: =!Coalesce(gblPimpinanView, false)
                              Width: =224
                  - ChecklistPimpinanContext:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =82
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =82
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(gblPimpinanView, false)
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - ChecklistContextEmployee:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              OnSelect: =Navigate(S11_Pimpinan_DaftarPegawai, ScreenTransition.Fade)
                              Size: =12
                              Text: '="Pegawai: " & Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-")'
                        - ChecklistContextCount:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =RGBA(0, 120, 212, 1)
                              Fill: =RGBA(222, 236, 249, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =8
                              PaddingTop: =8
                              Size: =11
                              Text: '=CountRows(Filter(ChecklistMentoring, NIP = Text(gblSubjectNIP))) & " checklist"'
                              Width: =120
                  - ChecklistTableCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - ChecklistColumnHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(243, 246, 250, 1)
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =48
                              PaddingLeft: =12
                              PaddingRight: =12
                              Visible: =App.Width >= 1200
                            Children:
                              - HeaderTahunChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Tahun"
                                    Width: =(Parent.Width - 24) * 0.14
                              - HeaderMentorChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Mentor"
                                    Width: =(Parent.Width - 24) * 0.30
                              - HeaderCreatedChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Dibuat"
                                    Width: =(Parent.Width - 24) * 0.24
                              - HeaderStatusChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Status"
                                    Width: =(Parent.Width - 24) * 0.16
                              - HeaderActionChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="Aksi"
                                    Width: =(Parent.Width - 24) * 0.16
                        - GalleryChecklistMentoring:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Items: |-
                                =Sort(
                                    Filter(
                                        ChecklistMentoring,
                                        NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                    ),
                                    Value(Tahun),
                                    SortOrder.Descending
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Set(gblSelectedChecklist, ThisItem);
                                Navigate(S6C_ChecklistMentoring_Detail, ScreenTransition.Fade)
                              TemplatePadding: =0
                              TemplateSize: =If(App.Width < 1200, 152, 92)
                            Children:
                              - RowBackgroundChecklist:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(235, 235, 235, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =If(ThisItem.IsSelected, RGBA(245, 250, 255, 1), RGBA(255, 255, 255, 1))
                                    Height: =Parent.TemplateHeight - 6
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                              - ValTahunChecklistRow:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    OnSelect: =Select(Parent)
                                    Size: =12
                                    Text: =If(App.Width < 1200, "Tahun " & Text(ThisItem.Tahun), Text(ThisItem.Tahun))
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 124, (Parent.TemplateWidth - 24) * 0.14)
                                    X: =12
                                    Y: =If(App.Width < 1200, 12, 30)
                              - ValMentorChecklistRow:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =32
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: '=If(App.Width < 1200, "Mentor: " & Coalesce(LookUp(Pegawai, Title = ThisItem.MentorNIP, Nama), ThisItem.MentorNIP, "-"), Coalesce(LookUp(Pegawai, Title = ThisItem.MentorNIP, Nama), ThisItem.MentorNIP, "-"))'
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 124, (Parent.TemplateWidth - 24) * 0.30)
                                    X: =If(App.Width < 1200, 12, 12 + (Parent.TemplateWidth - 24) * 0.14)
                                    Y: =If(App.Width < 1200, 42, 28)
                              - ValCreatedChecklistRow:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =28
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: '=If(App.Width < 1200, "Dibuat: " & Text(ThisItem.Created, "dd mmm yyyy, HH:mm"), Text(ThisItem.Created, "dd mmm yyyy"))'
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 124, (Parent.TemplateWidth - 24) * 0.24)
                                    X: =If(App.Width < 1200, 12, 12 + (Parent.TemplateWidth - 24) * 0.44)
                                    Y: =If(App.Width < 1200, 74, 31)
                              - ValStatusChecklistRow:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =If(ThisItem.Status = "Lengkap", RGBA(16, 124, 16, 1), RGBA(161, 98, 7, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: '=If(App.Width < 1200, "Status: " & Coalesce(ThisItem.Status, "Belum Lengkap"), Coalesce(ThisItem.Status, "Belum Lengkap"))'
                                    Width: =If(App.Width < 1200, Parent.TemplateWidth - 124, (Parent.TemplateWidth - 24) * 0.16)
                                    X: =If(App.Width < 1200, 12, 12 + (Parent.TemplateWidth - 24) * 0.68)
                                    Y: =If(App.Width < 1200, 106, 31)
                              - BtnDetailChecklistRow:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(9, 33, 98, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    OnSelect: |-
                                      =Set(gblSelectedChecklist, ThisItem);
                                      Navigate(S6C_ChecklistMentoring_Detail, ScreenTransition.Fade)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =11
                                    Text: ="Detail"
                                    Width: =88
                                    X: =If(App.Width < 1200, Parent.TemplateWidth - 100, 12 + (Parent.TemplateWidth - 24) * 0.84 + (((Parent.TemplateWidth - 24) * 0.16) - 88) / 2)
                                    Y: =If(App.Width < 1200, 57, 27)
                        - ChecklistEmptyState:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =80
                              Size: =12
                              Text: ="Belum ada checklist mentoring."
                              Visible: =IsEmpty(GalleryChecklistMentoring.AllItems)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight

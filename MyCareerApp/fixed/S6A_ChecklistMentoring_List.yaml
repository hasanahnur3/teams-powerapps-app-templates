Screens:
  S6A_ChecklistMentoring_List:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - ChecklistListContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - ChecklistListTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackChecklistList:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: =Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNameChecklistList:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - ChecklistListTopBarSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - ChecklistListTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0.08)
                  Height: =5
                  Width: =Parent.Width
            - ChecklistListMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - ChecklistListHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =48
                        Width: =Parent.Width
                      Children:
                        - ChecklistListTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Checklist Mentoring"
                        - BtnTambahChecklist:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(18, 38, 82, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(gblChecklistEditMode, false);
                                Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                Navigate(S6B_ChecklistMentoring_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="+ Tambah"
                              Width: =110
                  - ChecklistPimpinanContext:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =82
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =82
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(gblPimpinanView, false)
                        Width: =Parent.Width
                      Children:
                        - ChecklistContextEmployee:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              OnSelect: =Navigate(S11_Pimpinan_DaftarPegawai, ScreenTransition.Fade)
                              Size: =12
                              Text: '="Pegawai: " & Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-")'
                        - ChecklistContextCount:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(0, 120, 212, 1)
                              Fill: =RGBA(222, 236, 249, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =11
                              Text: '=CountRows(Filter(ChecklistMentoring, NIP = Text(gblSubjectNIP))) & " checklist"'
                              Width: =120
                  - ChecklistTableCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - ChecklistColumnHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(243, 246, 250, 1)
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =44
                              PaddingLeft: =12
                              PaddingRight: =12
                              Visible: =App.Width >= 900
                            Children:
                              - HeaderTahunChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="TAHUN"
                                    Width: =(Parent.Width - 24) * 0.15
                              - HeaderMentorChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="MENTOR"
                                    Width: =(Parent.Width - 24) * 0.30
                              - HeaderDokumenChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="DOKUMEN"
                                    Width: =(Parent.Width - 24) * 0.35
                              - HeaderStatusChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="STATUS"
                                    Width: =(Parent.Width - 24) * 0.20
                        - GalleryChecklistMentoring:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Items: |-
                                =Sort(
                                    Filter(
                                        ChecklistMentoring,
                                        NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                    ),
                                    Value(Tahun),
                                    SortOrder.Descending
                                )
                              LayoutMinHeight: =180
                              OnSelect: |-
                                =Set(gblSelectedChecklist, ThisItem);
                                Navigate(S6C_ChecklistMentoring_Detail, ScreenTransition.Fade)
                              TemplatePadding: =0
                              TemplateSize: =If(App.Width < 900, 112, 64)
                            Children:
                              - ChecklistDesktopRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(235, 235, 235, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Visible: =App.Width >= 900
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - ValTahunChecklistRow:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: =Text(ThisItem.Tahun)
                                          Width: =(Parent.Width - 24) * 0.15
                                    - ValMentorChecklistRow:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Font: =Font.'Open Sans'
                                          OnSelect: =Select(Parent)
                                          Size: =12
                                          Text: =Coalesce(LookUp(Pegawai, Title = ThisItem.MentorNIP, Nama), ThisItem.MentorNIP, "-")
                                          Width: =(Parent.Width - 24) * 0.30
                                    - ValDokumenChecklistRow:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Font: =Font.'Open Sans'
                                          OnSelect: =Select(Parent)
                                          Size: =11
                                          Text: |-
                                            =(
                                                If(IsBlank(ThisItem.PersonalStatementFile), 0, 1) +
                                                If(IsBlank(ThisItem.CareerPlanFile), 0, 1) +
                                                If(IsBlank(ThisItem.BuktiUploadFile), 0, 1)
                                            ) & " dari 3 file"
                                          Width: =(Parent.Width - 24) * 0.35
                                    - ValStatusChecklistRow:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =If(ThisItem.Status = "Lengkap", RGBA(16, 124, 16, 1), RGBA(161, 98, 7, 1))
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          OnSelect: =Select(Parent)
                                          Size: =11
                                          Text: =Coalesce(ThisItem.Status, "Belum Lengkap")
                                          Width: =(Parent.Width - 24) * 0.20
                              - ChecklistMobileRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(235, 235, 235, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Height: =108
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    PaddingBottom: =10
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =10
                                    Visible: =App.Width < 900
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - ChecklistMobileTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(31, 56, 100, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          OnSelect: =Select(Parent)
                                          Size: =13
                                          Text: '="Checklist Mentoring " & Text(ThisItem.Tahun)'
                                          Width: =Parent.Width
                                    - ChecklistMobileMentor:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Font: =Font.'Open Sans'
                                          OnSelect: =Select(Parent)
                                          Size: =11
                                          Text: '="Mentor: " & Coalesce(LookUp(Pegawai, Title = ThisItem.MentorNIP, Nama), ThisItem.MentorNIP, "-")'
                                          Width: =Parent.Width
                                    - ChecklistMobileStatus:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =If(ThisItem.Status = "Lengkap", RGBA(16, 124, 16, 1), RGBA(161, 98, 7, 1))
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          OnSelect: =Select(Parent)
                                          Size: =11
                                          Text: =Coalesce(ThisItem.Status, "Belum Lengkap")
                                          Width: =Parent.Width
                        - ChecklistEmptyState:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =80
                              Size: =12
                              Text: ="Belum ada checklist mentoring."
                              Visible: =IsEmpty(GalleryChecklistMentoring.AllItems)
                              Width: =Parent.Width

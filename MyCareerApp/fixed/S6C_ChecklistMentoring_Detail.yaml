Screens:
  S6C_ChecklistMentoring_Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - ChecklistDetailContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - ChecklistDetailTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackChecklistDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: =Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNameChecklistDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - ChecklistDetailTopBarSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - ChecklistDetailTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0.08)
                  Height: =5
                  Width: =Parent.Width
            - ChecklistDetailMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - ChecklistDetailHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =48
                        Width: =Parent.Width
                      Children:
                        - ChecklistDetailTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Detail Checklist Mentoring"
                        - BtnEditChecklistDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 120, 212, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(0, 120, 212, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: |-
                                =Set(gblChecklistEditMode, true);
                                Navigate(S6B_ChecklistMentoring_Form, ScreenTransition.Fade)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: ="Edit"
                              Visible: =Value(gblSelectedChecklist.Tahun) = Year(Today())
                              Width: =90
                        - BtnDeleteChecklistDetail:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: '=UpdateContext({locShowDeleteChecklist: true})'
                              Text: ="Hapus"
                              Visible: =Value(gblSelectedChecklist.Tahun) = Year(Today())
                              Width: =90
                  - ChecklistDetailCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =620
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: =620
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =28
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - ChecklistDetailInfo:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =If(Parent.Width < 640, 300, 78)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =If(Parent.Width < 640, 300, 78)
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - InfoEmployeeChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =70
                                    Size: =12
                                    Text: '="PEGAWAI" & Char(10) & Coalesce(LookUp(Pegawai, Title = gblSelectedChecklist.NIP, Nama), gblSelectedChecklist.NIP, "-")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                              - InfoYearChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =70
                                    Size: =12
                                    Text: '="TAHUN" & Char(10) & Coalesce(Text(gblSelectedChecklist.Tahun), "-")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                              - InfoMentorChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =70
                                    Size: =12
                                    Text: '="MENTOR" & Char(10) & Coalesce(LookUp(Pegawai, Title = gblSelectedChecklist.MentorNIP, Nama), gblSelectedChecklist.MentorNIP, "-")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                              - InfoStatusChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =If(gblSelectedChecklist.Status = "Lengkap", RGBA(16, 124, 16, 1), RGBA(161, 98, 7, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =70
                                    Size: =12
                                    Text: '="STATUS" & Char(10) & Coalesce(gblSelectedChecklist.Status, "Belum Lengkap")'
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                        - ChecklistDetailDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(235, 235, 235, 1)
                              Height: =1
                              Width: =Parent.Width
                        - ChecklistDocumentTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =14
                              Text: ="Dokumen Checklist"
                              Width: =Parent.Width
                        - ChecklistDocumentGrid:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =If(Parent.Width < 700, 300, 150)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =If(Parent.Width < 700, 300, 150)
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - PersonalStatementDetail:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =If(IsBlank(gblSelectedChecklist.PersonalStatementFile), RGBA(161, 98, 7, 1), RGBA(16, 124, 16, 1))
                                    Font: =Font.'Open Sans'
                                    Height: =140
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =14
                                    Size: =12
                                    Text: '="Personal Statement" & Char(10) & Coalesce(gblSelectedChecklist.PersonalStatementFile, "Belum diunggah")'
                                    Width: =If(Parent.Width < 700, Parent.Width, (Parent.Width - 32) / 3)
                              - CareerPlanDetail:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =If(IsBlank(gblSelectedChecklist.CareerPlanFile), RGBA(161, 98, 7, 1), RGBA(16, 124, 16, 1))
                                    Font: =Font.'Open Sans'
                                    Height: =140
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =14
                                    Size: =12
                                    Text: '="Career Plan" & Char(10) & Coalesce(gblSelectedChecklist.CareerPlanFile, "Belum diunggah")'
                                    Width: =If(Parent.Width < 700, Parent.Width, (Parent.Width - 32) / 3)
                              - BuktiUploadDetail:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =If(IsBlank(gblSelectedChecklist.BuktiUploadFile), RGBA(161, 98, 7, 1), RGBA(16, 124, 16, 1))
                                    Font: =Font.'Open Sans'
                                    Height: =140
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =14
                                    Size: =12
                                    Text: '="Bukti Upload" & Char(10) & Coalesce(gblSelectedChecklist.BuktiUploadFile, "Belum diunggah")'
                                    Width: =If(Parent.Width < 700, Parent.Width, (Parent.Width - 32) / 3)
      - DeleteChecklistOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Visible: =Coalesce(locShowDeleteChecklist, false)
            Width: =Parent.Width
          Children:
            - DeleteChecklistDialog:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(225, 223, 221, 1)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =220
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =220
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Hide
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Min(480, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
                Children:
                  - DeleteChecklistTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        Size: =16
                        Text: ="Hapus Checklist Mentoring?"
                  - DeleteChecklistMessage:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Text: ="Data yang sudah dihapus tidak dapat dikembalikan."
                        Width: =Parent.Width
                  - DeleteChecklistActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =46
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =46
                      Children:
                        - BtnCancelDeleteChecklist:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              Height: =42
                              OnSelect: '=UpdateContext({locShowDeleteChecklist: false})'
                              Text: ="Batal"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
                        - BtnConfirmDeleteChecklist:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =IfError(
                                    Remove(ChecklistMentoring, gblSelectedChecklist);
                                    Refresh(ChecklistMentoring);
                                    UpdateContext({locShowDeleteChecklist: false});
                                    Notify("Checklist Mentoring berhasil dihapus.", NotificationType.Success);
                                    Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                    Set(gblChecklistEditMode, false);
                                    Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade),
                                    Notify("Gagal menghapus: " & FirstError.Message, NotificationType.Error)
                                )
                              Text: ="Ya, Hapus"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)

            - ImgChecklistImagePreviewFull:
                Control: Image@2.2.3
                Properties:
                  AccessibleLabel: ="Pratinjau gambar resolusi penuh"
                  FillPortions: =1
                  Image: =locDetailImageFull
                  ImagePosition: =ImagePosition.Fit
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight

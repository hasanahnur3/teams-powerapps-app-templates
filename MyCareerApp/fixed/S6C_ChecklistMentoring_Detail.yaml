Screens:
  S6C_ChecklistMentoring_Detail:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
            IsEmpty(colNonFormNavigationHistory) ||
            Last(colNonFormNavigationHistory).ScreenName <> App.ActiveScreen.Name,
            Collect(
                colNonFormNavigationHistory,
                {
                    ScreenName: App.ActiveScreen.Name,
                    ScreenRef: App.ActiveScreen
                }
            )
        );
        UpdateContext({locShowDeleteChecklist: false, locShowDetailImagePreview: false, locDetailImageFull: Blank()});
        Refresh(MentoringSesi)
    Children:
      - ChecklistDetailContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            Width: =Parent.Width
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
          Children:
            - ChecklistDetailTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackChecklistDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                              =Set(gblChecklistAdminView, false);
                              If(
                                  IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                                  If(
                                      !IsEmpty(colNonFormNavigationHistory),
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  ),
                                  If(
                                      CountRows(colNonFormNavigationHistory) > 1,
                                      Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  )
                              )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameChecklistDetail:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: =If(Coalesce(gblPimpinanView, false), Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-") & " (" & Text(gblSubjectNIP) & ")", "MyCareerApp")
                  - ChecklistDetailTopBarSpacer:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - ChecklistDetailTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - ChecklistDetailMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - ChecklistDetailHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =48
                        Width: =Parent.Width
                      Children:
                        - ChecklistDetailTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="Detail Checklist Mentoring"
                  - ChecklistDetailCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =Max(
                              620,
                              ChecklistDetailInfo.Height +
                                  ChecklistDetailDivider.Height +
                                  ChecklistDocumentTitle.Height +
                                  ChecklistDocumentGrid.Height +
                                  MentoringSesiDetailTitle.Height +
                                  MentoringSesiDetailGallery.Height +
                                  160
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =20
                        LayoutMinHeight: |-
                          =Max(
                              620,
                              ChecklistDetailInfo.Height +
                                  ChecklistDetailDivider.Height +
                                  ChecklistDocumentTitle.Height +
                                  ChecklistDocumentGrid.Height +
                                  MentoringSesiDetailTitle.Height +
                                  MentoringSesiDetailGallery.Height +
                                  160
                          )
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =28
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - ChecklistDetailInfo:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              FillPortions: =0
                              Height: =If(Parent.Width < 640, 360, 96)
                              LayoutMinHeight: =If(Parent.Width < 640, 360, 96)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - InfoEmployeeChecklistLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="PEGAWAI"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                              - InfoEmployeeChecklistValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =58
                                    Size: =19
                                    Text: =Coalesce(LookUp(Pegawai, Title = gblSelectedChecklist.NIP, Nama), gblSelectedChecklist.NIP, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                                    Y: =32
                              - InfoYearChecklistLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="TAHUN"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                                    X: =If(Parent.Width < 640, 0, ((Parent.Width - 48) / 4) + 16)
                                    Y: =If(Parent.Width < 640, 90, 0)
                              - InfoYearChecklistValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =58
                                    Size: =19
                                    Text: =Coalesce(Text(gblSelectedChecklist.Tahun), "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                                    X: =If(Parent.Width < 640, 0, ((Parent.Width - 48) / 4) + 16)
                                    Y: =If(Parent.Width < 640, 122, 32)
                              - InfoMentorChecklistLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="MENTOR"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 48) / 4) + 16) * 2)
                                    Y: =If(Parent.Width < 640, 180, 0)
                              - InfoMentorChecklistValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =58
                                    Size: =19
                                    Text: =Coalesce(LookUp(Pegawai, Title = gblSelectedChecklist.MentorNIP, Nama), gblSelectedChecklist.MentorNIP, "-")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 48) / 4) + 16) * 2)
                                    Y: =If(Parent.Width < 640, 212, 32)
                              - InfoStatusChecklistLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Size: =13
                                    Text: ="STATUS"
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 48) / 4) + 16) * 3)
                                    Y: =If(Parent.Width < 640, 270, 0)
                              - InfoStatusChecklistValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =If(gblSelectedChecklist.Status = "Lengkap", RGBA(16, 124, 16, 1), RGBA(161, 98, 7, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =58
                                    Size: =19
                                    Text: =Coalesce(gblSelectedChecklist.Status, "Belum Lengkap")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(Parent.Width < 640, Parent.Width, (Parent.Width - 48) / 4)
                                    X: =If(Parent.Width < 640, 0, (((Parent.Width - 48) / 4) + 16) * 3)
                                    Y: =If(Parent.Width < 640, 302, 32)
                        - ChecklistDetailDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(235, 235, 235, 1)
                              Height: =1
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistDocumentTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =14
                              Text: ="Dokumen Checklist"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistDocumentGrid:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =If(Parent.Width < 700, 850, 260)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =If(Parent.Width < 700, 850, 260)
                              LayoutWrap: =true
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - PersonalStatementDetail:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(248, 247, 246, 1)
                                    Height: =250
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =14
                                    Width: =If(Parent.Width < 700, Parent.Width, (Parent.Width - 32) / 3)
                                  Children:
                                    - LblPersonalStatementDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          Text: ="Personal Statement"
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                    - ImgPersonalStatementDetail:
                                        Control: Image@2.2.3
                                        Properties:
                                          AccessibleLabel: ="Klik untuk memperbesar Personal Statement"
                                          Height: =180
                                          Image: =gblSelectedChecklist.PersonalStatementFile.Large
                                          ImagePosition: =ImagePosition.Fit
                                          OnSelect: |-
                                            =If(
                                                !IsBlank(gblSelectedChecklist.PersonalStatementFile),
                                                UpdateContext({locDetailImageFull: gblSelectedChecklist.PersonalStatementFile.Full, locShowDetailImagePreview: true})
                                            )
                                          Visible: =!IsBlank(gblSelectedChecklist.PersonalStatementFile)
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                    - EmptyPersonalStatementDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =180
                                          Text: ="Gambar belum tersedia"
                                          Visible: =IsBlank(gblSelectedChecklist.PersonalStatementFile)
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                              - CareerPlanDetail:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(248, 247, 246, 1)
                                    Height: =250
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =14
                                    Width: =If(Parent.Width < 700, Parent.Width, (Parent.Width - 32) / 3)
                                  Children:
                                    - LblCareerPlanDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          Text: ="Career Plan"
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                    - ImgCareerPlanDetail:
                                        Control: Image@2.2.3
                                        Properties:
                                          AccessibleLabel: ="Klik untuk memperbesar Career Plan"
                                          Height: =180
                                          Image: =gblSelectedChecklist.CareerPlanFile.Large
                                          ImagePosition: =ImagePosition.Fit
                                          OnSelect: |-
                                            =If(
                                                !IsBlank(gblSelectedChecklist.CareerPlanFile),
                                                UpdateContext({locDetailImageFull: gblSelectedChecklist.CareerPlanFile.Full, locShowDetailImagePreview: true})
                                            )
                                          Visible: =!IsBlank(gblSelectedChecklist.CareerPlanFile)
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                    - EmptyCareerPlanDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =180
                                          Text: ="Gambar belum tersedia"
                                          Visible: =IsBlank(gblSelectedChecklist.CareerPlanFile)
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                              - BuktiUploadDetail:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(248, 247, 246, 1)
                                    Height: =250
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    PaddingTop: =14
                                    Width: =If(Parent.Width < 700, Parent.Width, (Parent.Width - 32) / 3)
                                  Children:
                                    - LblBuktiUploadDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          Text: ="Bukti Upload"
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                    - ImgBuktiUploadDetail:
                                        Control: Image@2.2.3
                                        Properties:
                                          AccessibleLabel: ="Klik untuk memperbesar Bukti Upload"
                                          Height: =180
                                          Image: =gblSelectedChecklist.BuktiUploadFile.Large
                                          ImagePosition: =ImagePosition.Fit
                                          OnSelect: |-
                                            =If(
                                                !IsBlank(gblSelectedChecklist.BuktiUploadFile),
                                                UpdateContext({locDetailImageFull: gblSelectedChecklist.BuktiUploadFile.Full, locShowDetailImagePreview: true})
                                            )
                                          Visible: =!IsBlank(gblSelectedChecklist.BuktiUploadFile)
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                    - EmptyBuktiUploadDetail:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(96, 94, 92, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =180
                                          Text: ="Gambar belum tersedia"
                                          Visible: =IsBlank(gblSelectedChecklist.BuktiUploadFile)
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - MentoringSesiDetailTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =14
                              Text: ="Sesi Mentoring"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - MentoringSesiDetailGallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =Max(
                                    120,
                                    CountRows(
                                        Filter(
                                            MentoringSesi,
                                            ChecklistMentoringID = Text(gblSelectedChecklist.ID)
                                        )
                                    ) * If(Parent.Width < 700, 380, 220)
                                )
                              Items: |-
                                =Sort(
                                    Filter(
                                        MentoringSesi,
                                        ChecklistMentoringID = Text(gblSelectedChecklist.ID)
                                    ),
                                    NoSesi,
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: |-
                                =Max(
                                    120,
                                    CountRows(
                                        Filter(
                                            MentoringSesi,
                                            ChecklistMentoringID = Text(gblSelectedChecklist.ID)
                                        )
                                    ) * If(Parent.Width < 700, 380, 220)
                                )
                              TemplatePadding: =8
                              TemplateSize: =If(Parent.Width < 700, 364, 204)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - MentoringSesiDetailCard:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =RGBA(248, 247, 246, 1)
                                    Height: =Parent.TemplateHeight - 4
                                    Width: =Parent.TemplateWidth - 8
                              - MentoringSesiDetailNumber:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(31, 56, 100, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =30
                                    Size: =13
                                    Text: '="Sesi " & Text(ThisItem.NoSesi)'
                                    Width: =If(Parent.TemplateWidth < 700, Parent.TemplateWidth - 40, Parent.TemplateWidth - 360)
                                    X: =20
                                    Y: =16
                              - MentoringSesiDetailDate:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =28
                                    Size: =12
                                    Text: |-
                                      =If(
                                          IsBlank(ThisItem.Tanggal),
                                          "-",
                                          IfError(
                                              Text(ThisItem.Tanggal, "[$-id-ID]dd mmm yyyy"),
                                              Text(Date(1899, 12, 30) + Value(ThisItem.Tanggal), "[$-id-ID]dd mmm yyyy")
                                          )
                                      )
                                    Width: =If(Parent.TemplateWidth < 700, Parent.TemplateWidth - 40, Parent.TemplateWidth - 360)
                                    X: =20
                                    Y: =50
                              - MentoringSesiDetailPhoto:
                                  Control: Image@2.2.3
                                  Properties:
                                    AccessibleLabel: ="Klik untuk memperbesar foto bukti sesi mentoring"
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Height: =If(Parent.TemplateWidth < 700, 248, 164)
                                    Image: =ThisItem.FotoBukti.Large
                                    ImagePosition: =ImagePosition.Fit
                                    OnSelect: |-
                                      =If(
                                          !IsBlank(ThisItem.FotoBukti),
                                          UpdateContext({locDetailImageFull: ThisItem.FotoBukti.Full, locShowDetailImagePreview: true})
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =If(Parent.TemplateWidth < 700, Parent.TemplateWidth - 40, 300)
                                    X: =If(Parent.TemplateWidth < 700, 20, Parent.TemplateWidth - 328)
                                    Y: =If(Parent.TemplateWidth < 700, 94, 16)
                              - MentoringSesiDetailPhotoEmpty:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =40
                                    Text: ="Foto belum tersedia"
                                    Visible: =IsBlank(ThisItem.FotoBukti)
                                    Width: =If(Parent.TemplateWidth < 700, Parent.TemplateWidth - 60, 280)
                                    X: =If(Parent.TemplateWidth < 700, 30, Parent.TemplateWidth - 318)
                                    Y: =If(Parent.TemplateWidth < 700, 196, 78)
                        - MentoringSesiDetailEmpty:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =36
                              Text: ="Belum ada sesi mentoring."
                              Visible: |-
                                =IsEmpty(
                                    Filter(
                                        MentoringSesi,
                                        ChecklistMentoringID = Text(gblSelectedChecklist.ID)
                                    )
                                )
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistDetailActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =48
                              Visible: =!Coalesce(gblChecklistAdminView, false)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - BtnEditChecklistDetail:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    BorderThickness: =0
                                    BorderStyle: =BorderStyle.None
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Align: =Align.Center
                                    Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(9, 33, 98, 1))
                                    Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(235, 240, 252, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =Set(gblChecklistEditMode, true);
                                      Set(gblChecklistAdminView, false);
                                      Navigate(S6B_ChecklistMentoring_Form, ScreenTransition.Fade)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Edit"
                                    Visible: =And(!Coalesce(gblChecklistAdminView, false), !Coalesce(gblPimpinanView, false))
                                    Width: =If(Parent.Width < 480, (Parent.Width - 12) / 2, 120)
                              - BtnDeleteChecklistDetail:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    BorderThickness: =0
                                    BorderStyle: =BorderStyle.None
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Align: =Align.Center
                                    Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                                    Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(196, 43, 28, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: '=UpdateContext({locShowDeleteChecklist: true})'
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Hapus"
                                    Visible: =And(!Coalesce(gblChecklistAdminView, false), !Coalesce(gblPimpinanView, false))
                                    Width: =If(Parent.Width < 480, (Parent.Width - 12) / 2, 120)
      - DeleteChecklistOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            Visible: =Coalesce(locShowDeleteChecklist, false)
            Width: =Parent.Width
          Children:
            - DeleteChecklistDialog:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(225, 223, 221, 1)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =220
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  LayoutMinHeight: =220
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Hide
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Min(480, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
                Children:
                  - DeleteChecklistTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: ="Hapus Checklist Mentoring?"
                        Width: =Parent.Width
                  - DeleteChecklistMessage:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Text: ="Data yang sudah dihapus tidak dapat dikembalikan."
                        Width: =Parent.Width
                  - DeleteChecklistActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Height: =46
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =46
                        Width: =Parent.Width
                      Children:
                        - BtnCancelDeleteChecklist:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(200, 198, 196, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              Height: =42
                              OnSelect: '=UpdateContext({locShowDeleteChecklist: false})'
                              Text: ="Batal"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
                        - BtnConfirmDeleteChecklist:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(196, 43, 28, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =IfError(
                                    RemoveIf(
                                        MentoringSesi,
                                        ChecklistMentoringID = Text(gblSelectedChecklist.ID)
                                    );
                                    Remove(ChecklistMentoring, gblSelectedChecklist);
                                    Refresh(MentoringSesi);
                                    Refresh(ChecklistMentoring);
                                    UpdateContext({locShowDeleteChecklist: false});
                                    Notify("Checklist Mentoring berhasil dihapus.", NotificationType.Success);
                                    Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                    Set(gblChecklistEditMode, false);
                                    Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade),
                                    Notify("Gagal menghapus: " & FirstError.Message, NotificationType.Error)
                                )
                              Text: ="Ya, Hapus"
                              Width: =If(Parent.Width < 280, (Parent.Width - 12) / 2, 120)
      - ChecklistImagePreviewOverlay:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.88)

            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =16
            Visible: =Coalesce(locShowDetailImagePreview, false)
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - ChecklistImagePreviewHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =48
                Children:
                  - BtnCloseChecklistImagePreview:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Tutup pratinjau gambar"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(50, 49, 48, 0.75)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: '=UpdateContext({locShowDetailImagePreview: false, locDetailImageFull: Blank()})'
                        RadiusBottomLeft: =22
                        RadiusBottomRight: =22
                        RadiusTopLeft: =22
                        RadiusTopRight: =22
                        Size: =22
                        Text: ="×"

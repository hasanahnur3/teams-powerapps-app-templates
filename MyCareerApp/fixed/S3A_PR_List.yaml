Screens:
  S3A_PR_List:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - ScreenContainer1_3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - BtnBack_3:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Back()
                        PaddingLeft: =20
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppName_2:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - HeaderSpacer_2:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =40
            - MainContainer1_3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - PimpinanContextPR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 480, 328, If(Parent.Width < 900, 156, 94))
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =If(Parent.Width < 480, 328, If(Parent.Width < 900, 156, 94))
                        LayoutWrap: =true
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(gblPimpinanView, false)
                        Width: =Parent.Width
                      Children:
                        - PRContextNama:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextNama:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="NAMA PEGAWAI"
                              - ValContextNama:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    OnSelect: =Navigate(S11_Pimpinan_DaftarPegawai, ScreenTransition.Fade)
                                    Size: =14
                                    Text: =Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP), "-")
                        - PRContextTanggal:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextTanggal:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="TANGGAL"
                              - ValContextTanggal:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: |-
                                      =With(
                                          {
                                              PRTerbaru:
                                                  First(
                                                      SortByColumns(
                                                          Filter(PerformanceReview, NIP = Text(gblSubjectNIP)),
                                                          "Tahun", SortOrder.Descending,
                                                          "Semester", SortOrder.Descending
                                                      )
                                                  )
                                          },
                                          If(IsBlank(PRTerbaru.Tanggal), "-", Text(PRTerbaru.Tanggal, "[$-id-ID]dd mmmm yyyy"))
                                      )
                        - PRContextSemester:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextSemester:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="SEMESTER"
                              - ValContextSemester:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: |-
                                      =Coalesce(
                                          Text(
                                              First(
                                                  SortByColumns(
                                                      Filter(PerformanceReview, NIP = Text(gblSubjectNIP)),
                                                      "Tahun", SortOrder.Descending,
                                                      "Semester", SortOrder.Descending
                                                  )
                                              ).Semester
                                          ),
                                          "-"
                                      )
                        - PRContextLineManager:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =62
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =62
                              LayoutMinWidth: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                              Width: =If(Parent.Width < 480, Parent.Width - 40, If(Parent.Width < 900, (Parent.Width - 56) / 2, (Parent.Width - 88) / 4))
                            Children:
                              - LblContextLineManager:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(145, 145, 145, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =11
                                    Text: ="LINE MANAGER"
                              - ValContextLineManager:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: |-
                                      =With(
                                          {
                                              ManagerNIP:
                                                  First(
                                                      SortByColumns(
                                                          Filter(PerformanceReview, NIP = Text(gblSubjectNIP)),
                                                          "Tahun", SortOrder.Descending,
                                                          "Semester", SortOrder.Descending
                                                      )
                                                  ).LineManagerNIP
                                          },
                                          Coalesce(LookUp(Pegawai, Title = ManagerNIP, Nama), ManagerNIP, "-")
                                      )
                  - Gallery2:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(245, 245, 245, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Items: |-
                          =Filter(
                              PerformanceReview,
                              NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(gblSelectedPR, ThisItem);
                          Navigate(S3C_PR_Detail, ScreenTransition.Fade)
                      Children:
                        - Image2:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =72
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: =ThisItem.FotoBukti
                              OnSelect: =Select(Parent)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =72
                              X: =16
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - Title2:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =ThisItem.Tahun
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.TemplateWidth - 173
                              X: =103
                              Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle1.Size * 1.8)) / 2
                        - Subtitle1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                ="Semester: " & ThisItem.Semester
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Title2.Width
                              X: =Title2.X
                              Y: =Title2.Y + Title2.Height
                        - NextArrow1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =Self.Tooltip
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(166, 166, 166, 1)
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              DisabledColor: =RGBA(119, 119, 119, 1)
                              Height: =50
                              Icon: =Icon.ChevronRight
                              OnSelect: =Select(Parent)
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Tooltip: ="View item details"
                              Width: =50
                              X: =Parent.TemplateWidth - Self.Width - 12
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - Separator1:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =8
                              OnSelect: =Select(Parent)
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - Self.Height
                        - Rectangle1:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 120, 212, 1)
                              Height: =Parent.TemplateHeight - Separator1.Height
                              OnSelect: =Select(Parent)
                              Visible: =ThisItem.IsSelected
                              Width: =4

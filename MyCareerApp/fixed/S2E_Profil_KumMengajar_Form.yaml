Screens:
  S2E_Profil_KumMengajar_Form:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(31, 56, 100, 1)
      OnVisible: |-
        =Set(gblKumMengajarSubmitting, false);
        UpdateContext({locConfirmDeleteKumMengajar: false})
    Children:
      - ScreenContainerKumMengajarForm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            Width: =Parent.Width
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
          Children:
            - HeaderKumMengajarForm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackKumMengajarForm:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                              =Set(gblKumMengajarEditMode, false);
                              Set(gblKumMengajarDetailMode, false);
                              UpdateContext({locConfirmDeleteKumMengajar: false});
                              Set(gblSelectedKumMengajar, Defaults(Profil_KumMengajar));
                              If(
                                  IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                                  If(
                                      !IsEmpty(colNonFormNavigationHistory),
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  ),
                                  If(
                                      CountRows(colNonFormNavigationHistory) > 1,
                                      Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                      Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                      Back()
                                  )
                              )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameKumMengajarForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - HeaderSpacerKumMengajarForm:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - TopBarShadowKumMengajarForm:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =0
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - MainKumMengajarForm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - CardKumMengajarForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =488
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutMinHeight: =488
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - TitleKumMengajarForm:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =20
                              Text: =If(Coalesce(gblKumMengajarDetailMode, false), "Detail Kum Mengajar", If(Coalesce(gblKumMengajarEditMode, false), "Edit Kum Mengajar", "Tambah Kum Mengajar"))
                              Width: =Parent.Width
                        - SubtitleKumMengajarForm:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Size: =12
                              Text: |-
                                ="Pegawai: " &
                                Coalesce(
                                    LookUp(
                                        Pegawai,
                                        Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                        Nama
                                    ),
                                    Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                )
                              Width: =Parent.Width
                        - DividerKumMengajarForm:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 223, 221, 1)
                              Height: =1
                              Width: =Parent.Width
                        - FieldNamaIHTKumMengajar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblNamaIHTKumMengajar:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Nama IHT *"
                                    Width: =Parent.Width
                              - TxtNamaIHTKumMengajar:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Nama IHT"
                                    DisplayMode: =If(Coalesce(gblKumMengajarDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblKumMengajarEditMode, false) || Coalesce(gblKumMengajarDetailMode, false), Coalesce(gblSelectedKumMengajar.NamaIHT, ""), "")
                                    Width: =Parent.Width

                        - FieldTanggalPelaksanaanKumMengajar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width
                            Children:
                              - LblTanggalPelaksanaanKumMengajar:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal Pelaksanaan *"
                                    Width: =Parent.Width
                              - DateTanggalPelaksanaanKumMengajar:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Tanggal Pelaksanaan"
                                    DisplayMode: =If(Coalesce(gblKumMengajarDetailMode, false), DisplayMode.View, DisplayMode.Edit)
                                    DefaultDate: |-
                                      =If(
                                          (Coalesce(gblKumMengajarEditMode, false) || Coalesce(gblKumMengajarDetailMode, false)) && !IsBlank(gblSelectedKumMengajar.TanggalPelaksanaan),
                                          IfError(
                                              Date(1899, 12, 30) + Value(gblSelectedKumMengajar.TanggalPelaksanaan),
                                              gblSelectedKumMengajar.TanggalPelaksanaan
                                          ),
                                          Today()
                                      )
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width


                        - FormActionsKumMengajar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Coalesce(locConfirmDeleteKumMengajar, false), 104, 48)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =If(Coalesce(locConfirmDeleteKumMengajar, false), 104, 48)
                              LayoutWrap: =true
                              Visible: =!Coalesce(gblKumMengajarDetailMode, false) && !Coalesce(gblPimpinanView, false)
                              Width: =Parent.Width
                            Children:
                              - BtnBatalKumMengajar:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =Set(gblKumMengajarEditMode, false);
                                      Set(gblKumMengajarDetailMode, false);
                                      UpdateContext({locConfirmDeleteKumMengajar: false});
                                      Set(gblSelectedKumMengajar, Defaults(Profil_KumMengajar));
                                      Back()
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Batal"
                                    Width: =110
                              - BtnHapusKumMengajar:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(196, 43, 28, 1))
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteKumMengajar: true})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Hapus"
                                    Visible: =Coalesce(gblKumMengajarEditMode, false) && !Coalesce(locConfirmDeleteKumMengajar, false)
                                    Width: =110
                              - BtnBatalHapusKumMengajar:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteKumMengajar: false})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: ="Batal Hapus"
                                    Visible: =Coalesce(gblKumMengajarEditMode, false) && Coalesce(locConfirmDeleteKumMengajar, false)
                                    Width: =120
                              - BtnKonfirmasiHapusKumMengajar:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblPimpinanView, false) || Coalesce(gblKumMengajarSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          !Coalesce(gblKumMengajarSubmitting, false),
                                          Set(gblKumMengajarSubmitting, true);
                                          IfError(
                                              Remove(Profil_KumMengajar, gblSelectedKumMengajar);
                                              Refresh(Profil_KumMengajar);
                                              Notify("Data Kum Mengajar berhasil dihapus.", NotificationType.Success);
                                              Set(gblKumMengajarSubmitting, false);
                                              Set(gblKumMengajarEditMode, false);
                                              Set(gblKumMengajarDetailMode, false);
                                              UpdateContext({locConfirmDeleteKumMengajar: false});
                                              Set(gblSelectedKumMengajar, Defaults(Profil_KumMengajar));
                                              Navigate(S2_ProfilPegawai, ScreenTransition.Fade),
                                              Notify("Gagal menghapus data Kum Mengajar: " & FirstError.Message, NotificationType.Error);
                                              Set(gblKumMengajarSubmitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: =If(Coalesce(gblKumMengajarSubmitting, false), "Menghapus...", "Ya, Hapus")
                                    Visible: =Coalesce(gblKumMengajarEditMode, false) && Coalesce(locConfirmDeleteKumMengajar, false)
                                    Width: =120
                              - BtnSimpanKumMengajar:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblPimpinanView, false) || Coalesce(gblKumMengajarSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(18, 38, 82, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          Or(
                                              IsBlank(Trim(TxtNamaIHTKumMengajar.Value)),
                                              IsBlank(DateTanggalPelaksanaanKumMengajar.SelectedDate)
                                          ),
                                          Notify(
                                              "Lengkapi seluruh field Kum Mengajar.",
                                              NotificationType.Warning
                                          ),
                                          !Coalesce(gblKumMengajarSubmitting, false),
                                          Set(gblKumMengajarSubmitting, true);
                                          IfError(
                                              If(
                                                  Coalesce(gblKumMengajarEditMode, false),
                                                  Patch(
                                                      Profil_KumMengajar,
                                                      gblSelectedKumMengajar,
                                                      {
                                                          NIP: gblSelectedKumMengajar.NIP,
                                                          NamaIHT: Trim(TxtNamaIHTKumMengajar.Value),
                                                          TanggalPelaksanaan: DateTanggalPelaksanaanKumMengajar.SelectedDate
                                                      }
                                                  ),
                                                  With(
                                                      {
                                                          newRecord:
                                                              Patch(
                                                                  Profil_KumMengajar,
                                                                  Defaults(Profil_KumMengajar),
                                                                  {
                                                                      Title: "TEMP_" & Text(GUID()),
                                                                      NIP: Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                                                      NamaIHT: Trim(TxtNamaIHTKumMengajar.Value),
                                                                      TanggalPelaksanaan: DateTanggalPelaksanaanKumMengajar.SelectedDate
                                                                  }
                                                              )
                                                      },
                                                      Patch(
                                                          Profil_KumMengajar,
                                                          newRecord,
                                                          {Title: Text(newRecord.ID)}
                                                      )
                                                  )
                                              );
                                              Refresh(Profil_KumMengajar);
                                              Notify(
                                                  If(Coalesce(gblKumMengajarEditMode, false), "Data Kum Mengajar berhasil diperbarui.", "Data Kum Mengajar berhasil ditambahkan."),
                                                  NotificationType.Success
                                              );
                                              Set(gblKumMengajarSubmitting, false);
                                              Set(gblKumMengajarEditMode, false);
                                              Set(gblKumMengajarDetailMode, false);
                                              UpdateContext({locConfirmDeleteKumMengajar: false});
                                              Set(gblSelectedKumMengajar, Defaults(Profil_KumMengajar));
                                              Navigate(S2_ProfilPegawai, ScreenTransition.Fade),
                                              Notify(
                                                  "Gagal menyimpan data Kum Mengajar: " & FirstError.Message,
                                                  NotificationType.Error
                                              );
                                              Set(gblKumMengajarSubmitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =12
                                    Text: =If(Coalesce(gblKumMengajarSubmitting, false), "Menyimpan...", "Simpan")
                                    Visible: =!Coalesce(locConfirmDeleteKumMengajar, false)
                                    Width: =130

Screens:
  S9B_CoachingKarir_Coach_Form:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(9, 33, 98, 1)
      OnVisible: |-
        =Set(gblCoachingKarirSubmitting, false);
        ResetForm(CKFotoBuktiForm);
        Clear(colCKActionItemsDeleted);
        ClearCollect(
            colCKActionItems,
            {
                LocalID: "",
                RecordID: 0,
                Tipe: "",
                Kategori: "",
                Detail: ""
            }
        );
        RemoveIf(colCKActionItems, true);
        ForAll(
            Filter(
                ActionItem,
                Coalesce(gblCoachingKarirCoachEditMode, false) && CoachingID = gblSelectedCoachingKarir.ID
            ) As existingActionItem,
            Collect(
                colCKActionItems,
                {
                    LocalID: Text(existingActionItem.ID),
                    RecordID: existingActionItem.ID,
                    Tipe: existingActionItem.Tipe.Value,
                    Kategori: existingActionItem.Kategori,
                    Detail: existingActionItem.Detail
                }
            )
        )
    Children:
      - CKFormScreenContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height - 75
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - CKFormHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackCKForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblCoachingKarirSubmitting, false);
                          If(
                              IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                              If(
                                  !IsEmpty(colNonFormNavigationHistory),
                                  Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                  Back()
                              ),
                              If(
                                  CountRows(colNonFormNavigationHistory) > 1,
                                  Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                  Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                  Back()
                              )
                          )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameCKForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - CKFormHeaderSpacer:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - CKFormHeaderShadow:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - CKFormScroll:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - CKFormCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =1800
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutMinHeight: =1800
                        PaddingBottom: =If(Parent.Width < 640, 18, 28)
                        PaddingLeft: =If(Parent.Width < 640, 18, 28)
                        PaddingRight: =If(Parent.Width < 640, 18, 28)
                        PaddingTop: =If(Parent.Width < 640, 18, 24)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - CKFormTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =36
                              Size: =20
                              Text: =If(Coalesce(gblCoachingKarirCoachEditMode, false), "Edit Coaching Karir", "Buat Coaching Karir")
                              Width: =300
                              Wrap: =false
                        - CKFormSubject:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Size: =12
                              Text: |-
                                ="Mentee: " & Coalesce(CmbMenteeCKForm.Selected.Value, "-")
                        - CKFormDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 223, 221, 1)
                              Height: =1
                              Width: =Parent.Width
                        - FieldTanggalCKForm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                            Children:
                              - LblTanggalCKForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tanggal *"
                              - DateTanggalCKForm:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    AccessibleLabel: ="Tanggal coaching"
                                    DefaultDate: |-
                                      =If(
                                          Coalesce(gblCoachingKarirCoachEditMode, false),
                                          IfError(
                                              Date(1899, 12, 30) + Value(gblSelectedCoachingKarir.Tanggal),
                                              gblSelectedCoachingKarir.Tanggal
                                          ),
                                          Today()
                                      )
                                    Format: ="dd/mm/yyyy"
                                    Placeholder: ="Pilih tanggal"
                                    Width: =Parent.Width
                        - FieldMentorCKForm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                            Children:
                              - LblMentorCKForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Mentee *"
                              - CmbMenteeCKForm:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    AccessibleLabel: ="Pilih mentee"
                                    DefaultSelectedItems: |-
                                      =If(
                                          Coalesce(gblCoachingKarirCoachEditMode, false),
                                          Filter(
                                              ForAll(Pegawai, {Value: Nama, NIP: Title}),
                                              NIP = gblSelectedCoachingKarir.MenteeNIP
                                          ),
                                          Blank()
                                      )
                                    InputTextPlaceholder: ="Cari nama mentee"
                                    Items: |-
                                      =ForAll(
                                          Pegawai,
                                          {
                                              Value: Nama,
                                              NIP: Title
                                          }
                                      )
                                    Width: =Parent.Width
                        - FieldCatatanCKForm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =96
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =96
                            Children:
                              - LblCatatanCKForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Catatan *"
                              - TxtCatatanCKForm:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Catatan coaching"
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeSingleLine"
                                    Value: =If(Coalesce(gblCoachingKarirCoachEditMode, false), Coalesce(gblSelectedCoachingKarir.Catatan, ""), "")
                                    Width: =Parent.Width
                        - FieldHasilCKForm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =250
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =250
                            Children:
                              - LblHasilCKForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Foto Bukti *"
                              - CKFotoBuktiForm:
                                  Control: Form@2.4.4
                                  Layout: Vertical
                                  Properties:
                                    DataSource: =CoachingKarir
                                    DefaultMode: =If(Coalesce(gblCoachingKarirCoachEditMode, false), FormMode.Edit, FormMode.New)
                                    FillPortions: =0
                                    Height: =210
                                    Item: =If(Coalesce(gblCoachingKarirCoachEditMode, false), gblSelectedCoachingKarir, Defaults(CoachingKarir))
                                    LayoutMinHeight: =210
                                    Width: =Parent.Width
                                  Children:
                                    - FotoBukti_DataCardCK:
                                        Control: TypedDataCard@1.0.7
                                        Variant: LargePicture
                                        Properties:
                                          DataField: ="FotoBukti"
                                          Default: =ThisItem.FotoBukti
                                          DisplayName: =DataSourceInfo([@CoachingKarir],DataSourceInfo.DisplayName,FotoBukti)
                                          Height: =210
                                          Required: =false
                                          Update: =ImageFotoBuktiCK.Image
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =0
                                        Children:
                                          - ImageFotoBuktiCK:
                                              Control: Image@2.2.3
                                              MetadataKey: FieldValue
                                              Properties:
                                                BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =2
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =150
                                                Image: =If(IsBlank(AddMediaFotoBuktiCK.Media), Parent.Default, AddMediaFotoBuktiCK.Media)
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Tooltip: =Parent.DisplayName
                                                Width: =Min(420, Parent.Width)
                                          - AddMediaFotoBuktiCK:
                                              Control: AddMedia@2.2.1
                                              MetadataKey: AddPicture
                                              Properties:
                                                BorderColor: =RGBA(200, 198, 196, 1)
                                                BorderThickness: =1
                                                ChangePictureText: ="Ganti foto"
                                                Color: =RGBA(50, 49, 48, 1)
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =44
                                                HoverColor: =RGBA(50, 49, 48, 1)
                                                HoverFill: =RGBA(250, 250, 250, 1)
                                                PressedColor: =RGBA(50, 49, 48, 1)
                                                PressedFill: =RGBA(243, 242, 241, 1)
                                                Size: =12
                                                Text: ="Unggah foto"
                                                Width: =110
                                                Y: =ImageFotoBuktiCK.Y + ImageFotoBuktiCK.Height + 8
                                          - ErrorMessageFotoBuktiCK:
                                              Control: Text@0.0.51
                                              MetadataKey: ErrorMessage
                                              Properties:
                                                Height: =24
                                                Size: =12
                                                Text: =Parent.Error
                                                Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                                Width: =Parent.Width
                                                Y: =ImageFotoBuktiCK.Y + ImageFotoBuktiCK.Height
                        - CKActionItemsTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =14
                              Text: ="Action Items"
                        - GalleryCKActionItems:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =Max(210, CountRows(colCKActionItems) * 210)
                              Items: =colCKActionItems
                              LayoutMinHeight: =Max(210, CountRows(colCKActionItems) * 210)
                              TemplatePadding: =8
                              TemplateSize: =194
                              Visible: =!IsEmpty(colCKActionItems)
                            Children:
                              - ActionItemBackgroundCK:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(248, 247, 246, 1)
                                    Height: =Parent.TemplateHeight - 4
                                    Width: =Parent.TemplateWidth - 8
                              - LblActionItemNumberCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(31, 56, 100, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    Size: =12
                                    Text: ="Action Item"
                                    Width: =Parent.TemplateWidth - 130
                                    X: =12
                                    Y: =8
                              - BtnDeleteActionItemCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    OnSelect: |-
                                      =If(
                                          ThisItem.RecordID > 0,
                                          Collect(colCKActionItemsDeleted, {RecordID: ThisItem.RecordID})
                                      );
                                      Remove(colCKActionItems, ThisItem)
                                    Size: =11
                                    Text: ="× Hapus"
                                    Width: =90
                                    X: =Parent.TemplateWidth - 106
                                    Y: =6
                              - CmbTipeActionCK:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    AccessibleLabel: ="Tipe action item"
                                    DefaultSelectedItems: |-
                                      =Filter(
                                          Table(
                                              {Value: "S2"},
                                              {Value: "S3"},
                                              {Value: "Sertifikasi Tier 1"},
                                              {Value: "Sertifikasi Tier 2"},
                                              {Value: "PMK"},
                                              {Value: "Kum Mengajar"},
                                              {Value: "Penugasan DN/LN, Penugasan Strategis atau lainnya"},
                                              {Value: "Prestasi BI Wide atau lainnya"},
                                              {Value: "Kepanitiaan BI Wide"},
                                              {Value: "Plt/Penunjukan/Rangkap Jabatan/Penugasan tetap"}
                                          ),
                                          Value = ThisItem.Tipe
                                      )
                                    InputTextPlaceholder: ="Pilih tipe"
                                    Items: |-
                                      =Table(
                                          {Value: "S2"},
                                          {Value: "S3"},
                                          {Value: "Sertifikasi Tier 1"},
                                          {Value: "Sertifikasi Tier 2"},
                                          {Value: "PMK"},
                                          {Value: "Kum Mengajar"},
                                          {Value: "Penugasan DN/LN, Penugasan Strategis atau lainnya"},
                                          {Value: "Prestasi BI Wide atau lainnya"},
                                          {Value: "Kepanitiaan BI Wide"},
                                          {Value: "Plt/Penunjukan/Rangkap Jabatan/Penugasan tetap"}
                                      )
                                    OnChange: |-
                                      =Patch(
                                          colCKActionItems,
                                          ThisItem,
                                          {
                                              Tipe: Self.Selected.Value,
                                              Kategori: Switch(
                                                  Self.Selected.Value,
                                                  "S2", "Pendidikan (PTB)",
                                                  "S3", "Pendidikan (PTB)",
                                                  "Sertifikasi Tier 1", "Sertifikasi",
                                                  "Sertifikasi Tier 2", "Sertifikasi",
                                                  "PMK", "Sertifikasi",
                                                  "Kum Mengajar", "Sertifikasi",
                                                  "Penugasan DN/LN, Penugasan Strategis atau lainnya", "Exposure",
                                                  "Prestasi BI Wide atau lainnya", "Exposure",
                                                  "Kepanitiaan BI Wide", "Exposure",
                                                  "Plt/Penunjukan/Rangkap Jabatan/Penugasan tetap", "Exposure",
                                                  ""
                                              )
                                          }
                                      )
                                    Width: =If(Parent.TemplateWidth < 700, Parent.TemplateWidth - 32, (Parent.TemplateWidth - 44) * 0.45)
                                    X: =12
                                    Y: =42
                              - LblKategoriActionCK:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =11
                                    Text: |-
                                      ="Kategori: " & Coalesce(ThisItem.Kategori, "-")
                                    Width: =If(Parent.TemplateWidth < 700, Parent.TemplateWidth - 32, (Parent.TemplateWidth - 44) * 0.55)
                                    X: =If(Parent.TemplateWidth < 700, 12, CmbTipeActionCK.X + CmbTipeActionCK.Width + 12)
                                    Y: =If(Parent.TemplateWidth < 700, 82, 44)
                              - TxtDetailActionCK:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Detail action item"
                                    Height: =72
                                    Mode: ="'TextInputCanvas.Mode'.TextInputModeMultiLine"
                                    OnChange: |-
                                      =Patch(colCKActionItems, ThisItem, {Detail: Self.Value})
                                    Value: =ThisItem.Detail
                                    Width: =Parent.TemplateWidth - 32
                                    X: =12
                                    Y: =If(Parent.TemplateWidth < 700, 116, 88)
                        - BtnAddActionItemCK:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(9, 33, 98, 1)
                              Fill: =RGBA(222, 236, 249, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =Collect(
                                    colCKActionItems,
                                    {
                                        LocalID: Text(GUID()),
                                        RecordID: 0,
                                        Tipe: "",
                                        Kategori: "",
                                        Detail: ""
                                    }
                                )
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="+ Tambah Action Item"
                              Width: =220
      - CKFormActions:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =75
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.End
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            PaddingLeft: =8
            PaddingRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
          Children:
            - BtnCancelCKForm:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(200, 198, 196, 1)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Color: =RGBA(50, 49, 48, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  OnSelect: |-
                    =Reset(DateTanggalCKForm);
                    Reset(CmbMenteeCKForm);
                    Reset(TxtCatatanCKForm);
                    ResetForm(CKFotoBuktiForm);
                    Clear(colCKActionItems);
                    Clear(colCKActionItemsDeleted);
                    Set(gblCoachingKarirSubmitting, false);
                    Set(gblCoachingKarirCoachEditMode, false);
                    Set(gblSelectedCoachingKarir, Defaults(CoachingKarir));
                    Navigate(S9A_CoachingKarir_Coach_List, ScreenTransition.Fade)
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =12
                  Text: ="Batal"
                  Width: =110
            - BtnSaveCKForm:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(Coalesce(gblCoachingKarirSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(9, 33, 98, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  OnSelect: |-
                    =If(
                        Or(
                            IsBlank(DateTanggalCKForm.SelectedDate),
                            IsBlank(CmbMenteeCKForm.Selected.NIP),
                            IsBlank(Trim(TxtCatatanCKForm.Value)),
                            IsBlank(AddMediaFotoBuktiCK.Media) && !Coalesce(gblCoachingKarirCoachEditMode, false),
                            CountRows(Filter(colCKActionItems, IsBlank(Tipe) || IsBlank(Trim(Detail)))) > 0
                        ),
                        Notify(
                            "Lengkapi Tanggal, Mentee, Catatan, Foto Bukti, serta Tipe dan Detail pada setiap Action Item.",
                            NotificationType.Warning
                        ),
                        !Coalesce(gblCoachingKarirSubmitting, false),
                        Set(gblCoachingKarirSubmitting, true);
                        IfError(
                            With(
                                {
                                    savedCoachingKarir: If(
                                        Coalesce(gblCoachingKarirCoachEditMode, false),
                                        Patch(
                                            CoachingKarir,
                                            gblSelectedCoachingKarir,
                                            {
                                                MenteeNIP: CmbMenteeCKForm.Selected.NIP,
                                                MentorNIP: Text(gblCurrentNIP),
                                                Tanggal: DateTanggalCKForm.SelectedDate,
                                                Catatan: Trim(TxtCatatanCKForm.Value),
                                                FotoBukti: FotoBukti_DataCardCK.Update
                                            }
                                        ),
                                        With(
                                            {
                                                newCoachingKarir: Patch(
                                                    CoachingKarir,
                                                    Defaults(CoachingKarir),
                                                    {
                                                        Title: "TEMP_" & Text(GUID()),
                                                        MenteeNIP: CmbMenteeCKForm.Selected.NIP,
                                                        MentorNIP: Text(gblCurrentNIP),
                                                        Tanggal: DateTanggalCKForm.SelectedDate,
                                                        Catatan: Trim(TxtCatatanCKForm.Value),
                                                        FotoBukti: FotoBukti_DataCardCK.Update
                                                    }
                                                )
                                            },
                                            Patch(
                                                CoachingKarir,
                                                newCoachingKarir,
                                                {Title: Text(newCoachingKarir.ID)}
                                            )
                                        )
                                    )
                                },
                                If(
                                    Coalesce(gblCoachingKarirCoachEditMode, false),
                                    RemoveIf(
                                        ActionItem,
                                        CoachingID = savedCoachingKarir.ID
                                    )
                                );
                                IfError(
                                    ClearCollect(
                                        colCKSavedActionItems,
                                        ForAll(
                                            Sequence(CountRows(colCKActionItems)) As actionIndex,
                                            With(
                                                {
                                                    actionItem: Last(FirstN(colCKActionItems, actionIndex.Value))
                                                },
                                                Patch(
                                                    ActionItem,
                                                    Defaults(ActionItem),
                                                    {
                                                        Title: Text(savedCoachingKarir.ID) & "_" & Text(actionIndex.Value),
                                                        CoachingID: savedCoachingKarir.ID,
                                                        Kategori: actionItem.Kategori,
                                                        Tipe: {Value: actionItem.Tipe},
                                                        Detail: Trim(actionItem.Detail)
                                                    }
                                                )
                                            )
                                        )
                                    ),
                                    Clear(colCKSavedActionItems);
                                    Notify("Action Items gagal disimpan: " & FirstError.Message, NotificationType.Warning)
                                );
                                Refresh(ActionItem);
                                Refresh(CoachingKarir);
                                Notify(
                                    If(
                                        Coalesce(gblCoachingKarirCoachEditMode, false),
                                        "Coaching Karir berhasil diperbarui.",
                                        "Coaching Karir berhasil disimpan. ID: " & Text(savedCoachingKarir.ID) & ". Action Items: " & CountRows(colCKActionItems)
                                    ),
                                    NotificationType.Success
                                );
                                Set(gblCoachingKarirSubmitting, false);
                                Set(gblCoachingKarirCoachEditMode, false);
                                Set(gblSelectedCoachingKarir, Defaults(CoachingKarir));
                                Navigate(S9A_CoachingKarir_Coach_List, ScreenTransition.Fade)
                            ),
                            Notify("Gagal menyimpan Coaching Karir: " & FirstError.Message, NotificationType.Error);
                            Set(gblCoachingKarirSubmitting, false)
                        )
                    )
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =13
                  Text: =If(Coalesce(gblCoachingKarirSubmitting, false), "Menyimpan...", If(Coalesce(gblCoachingKarirCoachEditMode, false), "Simpan Perubahan", "Simpan"))
                  Width: =170

Screens:
  S6B_ChecklistMentoring_Form:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(gblChecklistSubmitting, false);
        UpdateContext({locConfirmDeleteChecklistForm: false});
        Reset(AddMediaPersonalStatementChecklist);
        Reset(AddMediaCareerPlanChecklist);
        Reset(AddMediaBuktiUploadChecklist)
    Children:
      - ChecklistFormContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - ChecklistFormTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackChecklistForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: |-
                          =Set(gblChecklistEditMode, false);
                          Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                          Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNameChecklistForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - ChecklistFormTopBarSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - ChecklistFormTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =0
                  Width: =Parent.Width
            - ChecklistFormMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - ChecklistFormCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =1220
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutMinHeight: =1220
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - ChecklistFormTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              Size: =20
                              Text: =If(Coalesce(gblChecklistEditMode, false), "Edit Checklist Mentoring", "Tambah Checklist Mentoring")
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistFormSubtitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =44
                              Size: =12
                              Text: |-
                                ="Pegawai: " &
                                Coalesce(
                                    LookUp(
                                        Pegawai,
                                        Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                        Nama
                                    ),
                                    Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                )
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistFormDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 223, 221, 1)
                              Height: =1
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - FieldTahunChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblTahunChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tahun *"
                                    Width: =Parent.Width
                              - NumTahunChecklist:
                                  Control: NumberInput@2.9.12
                                  Properties:
                                    AccessibleLabel: ="Tahun"
                                    Max: =Year(Today()) + 5
                                    Min: =2000
                                    Value: =If(Coalesce(gblChecklistEditMode, false), Value(gblSelectedChecklist.Tahun), Year(Today()))
                                    Width: =Parent.Width
                        - FieldMentorChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblMentorChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Mentor *"
                                    Width: =Parent.Width
                              - CmbMentorChecklist:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    AccessibleLabel: ="Pilih mentor"
                                    DefaultSelectedItems: |-
                                      =If(
                                          Coalesce(gblChecklistEditMode, false),
                                          Filter(
                                              ForAll(Pegawai, {Value: Nama, NIP: Title}),
                                              NIP = gblSelectedChecklist.MentorNIP
                                          ),
                                          Blank()
                                      )
                                    InputTextPlaceholder: ="Cari mentor"
                                    Items: |-
                                      =ForAll(
                                          Pegawai,
                                          {
                                              Value: Nama,
                                              NIP: Title
                                          }
                                      )
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                        - FieldPersonalStatementChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =210
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =210
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblPersonalStatementChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Personal Statement"
                                    Width: =Parent.Width
                              - UploadPersonalStatementChecklist:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =170
                                    Width: =Parent.Width
                                  Children:
                                    - ImgPersonalStatementChecklist:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =150
                                          Image: =If(IsBlank(AddMediaPersonalStatementChecklist.Media), If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.PersonalStatementFile, Blank()), AddMediaPersonalStatementChecklist.Media)
                                          ImagePosition: =ImagePosition.Fit
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Min(320, Parent.Width)
                                    - AddMediaPersonalStatementChecklist:
                                        Control: AddMedia@2.2.1
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          ChangePictureText: ="Ganti gambar"
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =RGBA(18, 38, 82, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =150
                                          Text: ="Unggah gambar"
                                          Width: =Min(320, Parent.Width)
                        - FieldCareerPlanChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =210
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =210
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblCareerPlanChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Career Plan"
                                    Width: =Parent.Width
                              - UploadCareerPlanChecklist:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =170
                                    Width: =Parent.Width
                                  Children:
                                    - ImgCareerPlanChecklist:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =150
                                          Image: =If(IsBlank(AddMediaCareerPlanChecklist.Media), If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.CareerPlanFile, Blank()), AddMediaCareerPlanChecklist.Media)
                                          ImagePosition: =ImagePosition.Fit
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Min(320, Parent.Width)
                                    - AddMediaCareerPlanChecklist:
                                        Control: AddMedia@2.2.1
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          ChangePictureText: ="Ganti gambar"
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =RGBA(18, 38, 82, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =150
                                          Text: ="Unggah gambar"
                                          Width: =Min(320, Parent.Width)
                        - FieldBuktiUploadChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =210
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =210
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblBuktiUploadChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Bukti Upload"
                                    Width: =Parent.Width
                              - UploadBuktiUploadChecklist:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =170
                                    Width: =Parent.Width
                                  Children:
                                    - ImgBuktiUploadChecklist:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =150
                                          Image: =If(IsBlank(AddMediaBuktiUploadChecklist.Media), If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.BuktiUploadFile, Blank()), AddMediaBuktiUploadChecklist.Media)
                                          ImagePosition: =ImagePosition.Fit
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Min(320, Parent.Width)
                                    - AddMediaBuktiUploadChecklist:
                                        Control: AddMedia@2.2.1
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          ChangePictureText: ="Ganti gambar"
                                          Color: =RGBA(255, 255, 255, 1)
                                          Fill: =RGBA(18, 38, 82, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =150
                                          Text: ="Unggah gambar"
                                          Width: =Min(320, Parent.Width)
                        - ChecklistStatusPreview:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: |-
                                =If(
                                    And(
                                        !IsBlank(ImgPersonalStatementChecklist.Image),
                                        !IsBlank(ImgCareerPlanChecklist.Image),
                                        !IsBlank(ImgBuktiUploadChecklist.Image)
                                    ),
                                    RGBA(16, 124, 16, 1),
                                    RGBA(161, 98, 7, 1)
                                )
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Text: |-
                                ="Status: " &
                                If(
                                    And(
                                        !IsBlank(ImgPersonalStatementChecklist.Image),
                                        !IsBlank(ImgCareerPlanChecklist.Image),
                                        !IsBlank(ImgBuktiUploadChecklist.Image)
                                    ),
                                    "Lengkap",
                                    "Belum Lengkap"
                                )
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistFormActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =48
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =48
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - BtnBatalChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteChecklistForm: false});
                                      Back()
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: ="Batal"
                                    Visible: =!Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =110
                              - BtnDeleteChecklistForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: '=UpdateContext({locConfirmDeleteChecklistForm: true})'
                                    Text: ="Hapus"
                                    Visible: |-
                                      =And(
                                          Coalesce(gblChecklistEditMode, false),
                                          Value(gblSelectedChecklist.Tahun) = Year(Today()),
                                          !Coalesce(locConfirmDeleteChecklistForm, false)
                                      )
                                    Width: =110
                              - BtnCancelDeleteChecklistForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: '=UpdateContext({locConfirmDeleteChecklistForm: false})'
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: ="Batal Hapus"
                                    Visible: =Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =120
                              - BtnConfirmDeleteChecklistForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =IfError(
                                          Remove(ChecklistMentoring, gblSelectedChecklist);
                                          Refresh(ChecklistMentoring);
                                          UpdateContext({locConfirmDeleteChecklistForm: false});
                                          Notify("Checklist Mentoring berhasil dihapus.", NotificationType.Success);
                                          Set(gblChecklistEditMode, false);
                                          Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                          Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade),
                                          Notify("Gagal menghapus checklist: " & FirstError.Message, NotificationType.Error)
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: ="Ya, Hapus"
                                    Visible: =Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =120
                              - BtnSimpanChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblChecklistSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(18, 38, 82, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          Or(
                                              IsBlank(NumTahunChecklist.Value),
                                              IsBlank(CmbMentorChecklist.Selected.NIP)
                                          ),
                                          Notify(
                                              "Lengkapi Tahun dan Mentor.",
                                              NotificationType.Warning
                                          ),
                                          !Coalesce(gblChecklistSubmitting, false),
                                          Set(gblChecklistSubmitting, true);
                                          IfError(
                                              If(
                                                  Coalesce(gblChecklistEditMode, false),
                                                  Patch(
                                                      ChecklistMentoring,
                                                      gblSelectedChecklist,
                                                      {
                                                          NIP: gblSelectedChecklist.NIP,
                                                          Tahun: Value(NumTahunChecklist.Value),
                                                          MentorNIP: CmbMentorChecklist.Selected.NIP,
                                                          Status: If(And(!IsBlank(ImagePersonalStatementSubmit.Image), !IsBlank(ImageCareerPlanSubmit.Image), !IsBlank(ImageBuktiUploadSubmit.Image)), "Lengkap", "Belum Lengkap"),
                                                          PersonalStatementFile: ImagePersonalStatementSubmit.Image,
                                                          CareerPlanFile: ImageCareerPlanSubmit.Image,
                                                          BuktiUploadFile: ImageBuktiUploadSubmit.Image
                                                      }
                                                  ),
                                                  With(
                                                      {
                                                          newChecklist: Patch(
                                                              ChecklistMentoring,
                                                              Defaults(ChecklistMentoring),
                                                              {
                                                                  Title: "TEMP_" & Text(GUID()),
                                                                  NIP: Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                                                  Tahun: Value(NumTahunChecklist.Value),
                                                                  MentorNIP: CmbMentorChecklist.Selected.NIP,
                                                                  Status: If(And(!IsBlank(ImagePersonalStatementSubmit.Image), !IsBlank(ImageCareerPlanSubmit.Image), !IsBlank(ImageBuktiUploadSubmit.Image)), "Lengkap", "Belum Lengkap"),
                                                                  PersonalStatementFile: ImagePersonalStatementSubmit.Image,
                                                                  CareerPlanFile: ImageCareerPlanSubmit.Image,
                                                                  BuktiUploadFile: ImageBuktiUploadSubmit.Image
                                                              }
                                                          )
                                                      },
                                                      Patch(ChecklistMentoring, newChecklist, {Title: Text(newChecklist.ID)})
                                                  )
                                              );
                                              Refresh(ChecklistMentoring);
                                              Notify(If(Coalesce(gblChecklistEditMode, false), "Checklist berhasil diperbarui.", "Checklist berhasil disimpan."), NotificationType.Success);
                                              Set(gblChecklistSubmitting, false);
                                              Set(gblChecklistEditMode, false);
                                              Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                              Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade),
                                              Notify("Gagal menyimpan checklist: " & FirstError.Message, NotificationType.Error);
                                              Set(gblChecklistSubmitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: =If(Coalesce(gblChecklistSubmitting, false), "Menyimpan...", "Simpan")
                                    Visible: =!Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =130
                  - ChecklistImagesForm:
                      Control: Form@2.4.4
                      Layout: Vertical
                      Properties:
                        BorderThickness: =0
                        DataSource: =ChecklistMentoring
                        DefaultMode: =If(Coalesce(gblChecklistEditMode, false), FormMode.Edit, FormMode.New)
                        FillPortions: =0
                        Height: =1
                        Item: =gblSelectedChecklist
                        LayoutMinHeight: =1
                        LayoutMinWidth: =1
                        OnFailure: |-
                          =Notify("Gagal menyimpan checklist: " & ChecklistImagesForm.Error, NotificationType.Error);
                          Set(gblChecklistSubmitting, false)
                        OnSuccess: |-
                          =If(
                              !Coalesce(gblChecklistEditMode, false),
                              Patch(ChecklistMentoring, ChecklistImagesForm.LastSubmit, {Title: Text(ChecklistImagesForm.LastSubmit.ID)})
                          );
                          Refresh(ChecklistMentoring);
                          Notify(If(Coalesce(gblChecklistEditMode, false), "Checklist berhasil diperbarui.", "Checklist berhasil disimpan."), NotificationType.Success);
                          Set(gblChecklistSubmitting, false);
                          Set(gblChecklistEditMode, false);
                          Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                          Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade)
                        Visible: =true
                        Width: =1
                      Children:
                        - Title_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            IsLocked: false
                            Properties:
                              DataField: ="Title"
                              Default: =ThisItem.Title
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, 'Title')
                              Required: =true
                              Update: =If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.Title, "TEMP_" & Text(GUID()))
                              Visible: =true
                        - NIP_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            IsLocked: false
                            Properties:
                              DataField: ="NIP"
                              Default: =ThisItem.NIP
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, 'NIP')
                              Required: =false
                              Update: =Text(If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.NIP, If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)))
                              Visible: =true
                        - Tahun_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: NumberEdit
                            IsLocked: false
                            Properties:
                              DataField: ="Tahun"
                              Default: =ThisItem.Tahun
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, 'Tahun')
                              Required: =false
                              Update: =Value(NumTahunChecklist.Value)
                              Visible: =true
                        - MentorNIP_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            IsLocked: false
                            Properties:
                              DataField: ="MentorNIP"
                              Default: =ThisItem.MentorNIP
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, 'MentorNIP')
                              Required: =false
                              Update: =CmbMentorChecklist.Selected.NIP
                              Visible: =true
                        - Status_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            IsLocked: false
                            Properties:
                              DataField: ="Status"
                              Default: =ThisItem.Status
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, 'Status')
                              Required: =false
                              Update: =If(And(!IsBlank(ImgPersonalStatementChecklist.Image), !IsBlank(ImgCareerPlanChecklist.Image), !IsBlank(ImgBuktiUploadChecklist.Image)), "Lengkap", "Belum Lengkap")
                              Visible: =true
                        - PersonalStatementFile_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: LargePicture
                            IsLocked: false

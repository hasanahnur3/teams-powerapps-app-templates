Screens:
  S6B_ChecklistMentoring_Form:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(gblChecklistSubmitting, false);
        UpdateContext({locConfirmDeleteChecklistForm: false});
        Reset(AddMediaPersonalStatementChecklist);
        Reset(AddMediaCareerPlanChecklist);
        Reset(AddMediaBuktiUploadChecklist);
        Clear(colMentoringSesiDeleted);
        Clear(colMentoringSesi);
        If(
            Coalesce(gblChecklistEditMode, false) && !IsBlank(gblSelectedChecklist.ID),
            ForAll(
                Sort(
                    Filter(MentoringSesi, ChecklistMentoringID = Text(gblSelectedChecklist.ID)),
                    NoSesi,
                    SortOrder.Ascending
                ) As existingSesi,
                Collect(
                    colMentoringSesi,
                    {
                        LocalID: Text(existingSesi.ID),
                        RecordID: existingSesi.ID,
                        NoSesi: existingSesi.NoSesi,
                        Tanggal: existingSesi.Tanggal,
                        FotoBuktiLama: existingSesi.FotoBukti,
                        FotoBuktiBaru: existingSesi.FotoBukti,
                        FotoDiubah: false
                    }
                )
            )
        )
    Children:
      - ChecklistFormContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - ChecklistFormTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(31, 48, 112, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackChecklistForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblChecklistEditMode, false);
                          Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                          If(
                              IsMatch(App.ActiveScreen.Name, "form", MatchOptions.IgnoreCase),
                              If(
                                  !IsEmpty(colNonFormNavigationHistory),
                                  Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                  Back()
                              ),
                              If(
                                  CountRows(colNonFormNavigationHistory) > 1,
                                  Remove(colNonFormNavigationHistory, Last(colNonFormNavigationHistory));
                                  Navigate(Last(colNonFormNavigationHistory).ScreenRef, ScreenTransition.Fade),
                                  Back()
                              )
                          )
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameChecklistForm:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - ChecklistFormTopBarSpacer:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Kembali ke Homepage"
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =Set(gblPimpinanView, false);
                          Set(gblSubjectNIP, Blank());
                          Set(gblChecklistAdminView, false);
                          Clear(colNonFormNavigationHistory);
                          Navigate(S1_Homepage, ScreenTransition.Fade)
                        Size: =20
                        Text: ="⌂"
                        Width: =40
            - ChecklistFormTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =0
                  LayoutMinHeight: =0
                  Width: =Parent.Width
            - ChecklistFormMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - ChecklistFormCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =1520 + Max(120, CountRows(colMentoringSesi) * If(Parent.Width < 600, 356, 300))
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutMinHeight: =1520 + Max(120, CountRows(colMentoringSesi) * If(Parent.Width < 600, 356, 300))
                        PaddingBottom: =28
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - ChecklistFormTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              Size: =20
                              Text: =If(Coalesce(gblChecklistEditMode, false), "Edit Checklist Mentoring", "Tambah Checklist Mentoring")
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistFormSubtitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =44
                              Size: =12
                              Text: |-
                                ="Pegawai: " &
                                Coalesce(
                                    LookUp(
                                        Pegawai,
                                        Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                        Nama
                                    ),
                                    Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                                )
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - ChecklistFormDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 223, 221, 1)
                              Height: =1
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - FieldTahunChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblTahunChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Tahun *"
                                    Width: =Parent.Width
                              - NumTahunChecklist:
                                  Control: NumberInput@2.9.12
                                  Properties:
                                    AccessibleLabel: ="Tahun"
                                    Max: =Year(Today()) + 5
                                    Min: =2000
                                    Value: =If(Coalesce(gblChecklistEditMode, false), Value(gblSelectedChecklist.Tahun), Year(Today()))
                                    Width: =Parent.Width
                        - FieldMentorChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =76
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblMentorChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Mentor *"
                                    Width: =Parent.Width
                              - CmbMentorChecklist:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    AccessibleLabel: ="Pilih mentor"
                                    DefaultSelectedItems: |-
                                      =If(
                                          Coalesce(gblChecklistEditMode, false),
                                          Filter(
                                              ForAll(Pegawai, {Value: Nama, NIP: Title}),
                                              NIP = gblSelectedChecklist.MentorNIP
                                          ),
                                          Blank()
                                      )
                                    InputTextPlaceholder: ="Cari mentor"
                                    Items: |-
                                      =ForAll(
                                          Pegawai,
                                          {
                                              Value: Nama,
                                              NIP: Title
                                          }
                                      )
                                    Width: =Parent.Width
                        - FieldPersonalStatementChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =210
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =210
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblPersonalStatementChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Personal Statement"
                                    Width: =Parent.Width
                              - UploadPersonalStatementChecklist:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =170
                                    Width: =Parent.Width
                                  Children:
                                    - ImgPersonalStatementChecklist:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =110
                                          Image: =If(IsBlank(AddMediaPersonalStatementChecklist.Media), If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.PersonalStatementFile.Large, Blank()), AddMediaPersonalStatementChecklist.Media)
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Min(320, Parent.Width)
                                    - AddMediaPersonalStatementChecklist:
                                        Control: AddMedia@2.2.1
                                        Properties:
                                          BorderColor: =RGBA(200, 198, 196, 1)
                                          BorderThickness: =1
                                          ChangePictureText: ="Ganti gambar"
                                          Color: =RGBA(50, 49, 48, 1)
                                          Height: =44
                                          HoverColor: =RGBA(50, 49, 48, 1)
                                          HoverFill: =RGBA(250, 250, 250, 1)
                                          PressedColor: =RGBA(50, 49, 48, 1)
                                          PressedFill: =RGBA(243, 242, 241, 1)
                                          Size: =12
                                          Text: ="Unggah gambar"
                                          Width: =110
                                          Y: =ImgPersonalStatementChecklist.Y + ImgPersonalStatementChecklist.Height + 8
                        - FieldCareerPlanChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =210
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =210
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblCareerPlanChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Career Plan"
                                    Width: =Parent.Width
                              - UploadCareerPlanChecklist:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =170
                                    Width: =Parent.Width
                                  Children:
                                    - ImgCareerPlanChecklist:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =110
                                          Image: =If(IsBlank(AddMediaCareerPlanChecklist.Media), If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.CareerPlanFile.Large, Blank()), AddMediaCareerPlanChecklist.Media)
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Min(320, Parent.Width)
                                    - AddMediaCareerPlanChecklist:
                                        Control: AddMedia@2.2.1
                                        Properties:
                                          BorderColor: =RGBA(200, 198, 196, 1)
                                          BorderThickness: =1
                                          ChangePictureText: ="Ganti gambar"
                                          Color: =RGBA(50, 49, 48, 1)
                                          Height: =44
                                          HoverColor: =RGBA(50, 49, 48, 1)
                                          HoverFill: =RGBA(250, 250, 250, 1)
                                          PressedColor: =RGBA(50, 49, 48, 1)
                                          PressedFill: =RGBA(243, 242, 241, 1)
                                          Size: =12
                                          Text: ="Unggah gambar"
                                          Width: =110
                                          Y: =ImgCareerPlanChecklist.Y + ImgCareerPlanChecklist.Height + 8
                        - FieldBuktiUploadChecklist:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =210
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =210
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - LblBuktiUploadChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Bukti Upload"
                                    Width: =Parent.Width
                              - UploadBuktiUploadChecklist:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =170
                                    Width: =Parent.Width
                                  Children:
                                    - ImgBuktiUploadChecklist:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =110
                                          Image: =If(IsBlank(AddMediaBuktiUploadChecklist.Media), If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.BuktiUploadFile.Large, Blank()), AddMediaBuktiUploadChecklist.Media)
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Width: =Min(320, Parent.Width)
                                    - AddMediaBuktiUploadChecklist:
                                        Control: AddMedia@2.2.1
                                        Properties:
                                          BorderColor: =RGBA(200, 198, 196, 1)
                                          BorderThickness: =1
                                          ChangePictureText: ="Ganti gambar"
                                          Color: =RGBA(50, 49, 48, 1)
                                          Height: =44
                                          HoverColor: =RGBA(50, 49, 48, 1)
                                          HoverFill: =RGBA(250, 250, 250, 1)
                                          PressedColor: =RGBA(50, 49, 48, 1)
                                          PressedFill: =RGBA(243, 242, 241, 1)
                                          Size: =12
                                          Text: ="Unggah gambar"
                                          Width: =110
                                          Y: =ImgBuktiUploadChecklist.Y + ImgBuktiUploadChecklist.Height + 8
                        - ChecklistStatusPreview:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: |-
                                =If(
                                    And(
                                        !IsBlank(ImgPersonalStatementChecklist.Image),
                                        !IsBlank(ImgCareerPlanChecklist.Image),
                                        !IsBlank(ImgBuktiUploadChecklist.Image)
                                    ),
                                    RGBA(16, 124, 16, 1),
                                    RGBA(161, 98, 7, 1)
                                )
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Text: |-
                                ="Status: " &
                                If(
                                    And(
                                        !IsBlank(ImgPersonalStatementChecklist.Image),
                                        !IsBlank(ImgCareerPlanChecklist.Image),
                                        !IsBlank(ImgBuktiUploadChecklist.Image)
                                    ),
                                    "Lengkap",
                                    "Belum Lengkap"
                                )
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - MentoringSesiFormTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =14
                              Text: ="Sesi Mentoring"
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - MentoringSesiFormHelp:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =24
                              Size: =11
                              Text: ="Tambah, ubah, atau hapus sesi. Foto lama dipertahankan sampai Anda memilih gambar pengganti."
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - MentoringSesiEditGallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =Max(120, CountRows(colMentoringSesi) * If(Parent.Width < 600, 356, 300))
                              Items: =colMentoringSesi
                              LayoutMinHeight: =Max(120, CountRows(colMentoringSesi) * If(Parent.Width < 600, 356, 300))
                              TemplatePadding: =8
                              TemplateSize: =If(Parent.Width < 600, 340, 284)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - MentoringSesiEditBackground:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(248, 247, 246, 1)
                                    Height: =Parent.TemplateHeight - 4
                                    Width: =Parent.TemplateWidth - 8
                              - MentoringSesiEditLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(31, 56, 100, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =25
                                    Size: =12
                                    Text: ="Sesi " & Text(ThisItem.NoSesi)
                                    Width: =Max(120, Parent.TemplateWidth - 150)
                                    Y: =8
                              - BtnDeleteMentoringSesi:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    AutoHeight: =true
                                    Color: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    OnSelect: |-
                                      =If(
                                          ThisItem.RecordID > 0,
                                          Collect(colMentoringSesiDeleted, {RecordID: ThisItem.RecordID})
                                      );
                                      Remove(colMentoringSesi, ThisItem)
                                    PaddingLeft: =10
                                    Size: =11
                                    Text: ="× Hapus"
                                    Width: =Parent.Width - 30
                                    Y: =6
                              - NumNoMentoringSesi:
                                  Control: NumberInput@2.9.12
                                  Properties:
                                    AccessibleLabel: ="Nomor sesi"
                                    Max: =99
                                    Min: =1
                                    OnChange: |-
                                      =Patch(colMentoringSesi, ThisItem, {NoSesi: Value(Self.Value)})
                                    Value: =ThisItem.NoSesi
                                    Width: =If(Parent.TemplateWidth < 600, Parent.TemplateWidth - 32, 160)
                                    X: =1
                                    Y: =44
                              - DateMentoringSesi:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    AccessibleLabel: ="Tanggal sesi mentoring"
                                    DefaultDate: =Coalesce(ThisItem.Tanggal, Today())
                                    Format: ="dd/mm/yyyy"
                                    OnChange: |-
                                      =Patch(colMentoringSesi, ThisItem, {Tanggal: Self.SelectedDate})
                                    PaddingLeft: =10
                                    Placeholder: ="Pilih tanggal"
                                    Width: =If(Parent.TemplateWidth < 600, Parent.TemplateWidth - 32, 220)
                                    X: =1
                                    Y: =If(Parent.TemplateWidth < 600, 94, 44)
                              - ImgMentoringSesiEdit:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderColor: =RGBA(225, 223, 221, 1)
                                    BorderThickness: =1
                                    Height: =120
                                    Image: |-
                                      =If(
                                          ThisItem.FotoDiubah && !IsBlank(ThisItem.FotoBuktiBaru.Full),
                                          ThisItem.FotoBuktiBaru.Full,
                                          If(
                                              !IsBlank(ThisItem.FotoBuktiLama),
                                              ThisItem.FotoBuktiLama.Large,
                                              Blank()
                                          )
                                      )
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =If(Parent.TemplateWidth < 600, Parent.TemplateWidth - 32, 280)
                                    X: =1
                                    Y: =If(Parent.TemplateWidth < 600, 148, 108)
                              - AddMediaMentoringSesiEdit:
                                  Control: AddMedia@2.2.1
                                  Properties:
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderThickness: =1
                                    ChangePictureText: ="Ganti foto bukti"
                                    Color: =RGBA(50, 49, 48, 1)
                                    Height: =44
                                    HoverColor: =RGBA(50, 49, 48, 1)
                                    HoverFill: =RGBA(250, 250, 250, 1)
                                    OnChange: |-
                                      =Patch(
                                          colMentoringSesi,
                                          ThisItem,
                                          {
                                              FotoBuktiBaru: {
                                                  Full: Self.Media,
                                                  Large: Self.Media,
                                                  Medium: Self.Media,
                                                  Small: Self.Media
                                              },
                                              FotoDiubah: true
                                          }
                                      )
                                    PressedColor: =RGBA(50, 49, 48, 1)
                                    PressedFill: =RGBA(243, 242, 241, 1)
                                    Size: =12
                                    Text: ="Unggah foto"
                                    Width: =If(Parent.TemplateWidth < 600, Parent.TemplateWidth - 32, 280)
                                    Y: =ImgMentoringSesiEdit.Y + ImgMentoringSesiEdit.Height + 8
                        - MentoringSesiEmptyEdit:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =36
                              Text: ="Belum ada sesi mentoring."
                              Visible: =IsEmpty(colMentoringSesi)
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - BtnAddMentoringSesi:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(9, 33, 98, 1)
                              Fill: =RGBA(222, 236, 249, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =Collect(
                                    colMentoringSesi,
                                    {
                                        LocalID: Text(GUID()),
                                        RecordID: 0,
                                        NoSesi: CountRows(colMentoringSesi) + 1,
                                        Tanggal: Today(),
                                        FotoBuktiLama: Blank(),
                                        FotoBuktiBaru: {
                                            Full: "",
                                            Large: "",
                                            Medium: "",
                                            Small: ""
                                        },
                                        FotoDiubah: false
                                    }
                                )
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: ="+ Tambah Sesi Mentoring"
                              Width: =220
                        - ChecklistFormActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =48
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - BtnBatalChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteChecklistForm: false});
                                      Back()
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: ="Batal"
                                    Visible: =!Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =110
                              - BtnDeleteChecklistForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                                    Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(196, 43, 28, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteChecklistForm: true})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: ="Hapus"
                                    Visible: |-
                                      =And(
                                          Coalesce(gblChecklistEditMode, false),
                                          Value(gblSelectedChecklist.Tahun) = Year(Today()),
                                          !Coalesce(locConfirmDeleteChecklistForm, false)
                                      )
                                    Width: =110
                              - BtnCancelDeleteChecklistForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(200, 198, 196, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =UpdateContext({locConfirmDeleteChecklistForm: false})
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: ="Batal Hapus"
                                    Visible: =Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =120
                              - BtnConfirmDeleteChecklistForm:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =IfError(
                                          RemoveIf(
                                              MentoringSesi,
                                              ChecklistMentoringID = Text(gblSelectedChecklist.ID)
                                          );
                                          Remove(ChecklistMentoring, gblSelectedChecklist);
                                          Refresh(MentoringSesi);
                                          Refresh(ChecklistMentoring);
                                          UpdateContext({locConfirmDeleteChecklistForm: false});
                                          Notify("Checklist Mentoring berhasil dihapus.", NotificationType.Success);
                                          Set(gblChecklistEditMode, false);
                                          Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                          Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade),
                                          Notify("Gagal menghapus checklist: " & FirstError.Message, NotificationType.Error)
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: ="Ya, Hapus"
                                    Visible: =Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =120
                              - BtnSimpanChecklist:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisplayMode: =If(Coalesce(gblPimpinanView, false) || Coalesce(gblChecklistSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(18, 38, 82, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    OnSelect: |-
                                      =If(
                                          Or(
                                              IsBlank(NumTahunChecklist.Value),
                                              IsBlank(CmbMentorChecklist.Selected.NIP),
                                              CountRows(
                                                  Filter(
                                                      colMentoringSesi,
                                                      IsBlank(NoSesi) ||
                                                          IsBlank(Tanggal) ||
                                                          (RecordID = 0 && IsBlank(FotoBuktiBaru.Full))
                                                  )
                                              ) > 0,
                                              CountRows(Distinct(colMentoringSesi, NoSesi)) <> CountRows(colMentoringSesi)
                                          ),
                                          Notify(
                                              "Lengkapi Tahun, Mentor, Nomor/Tanggal sesi, Foto Bukti setiap sesi baru, dan pastikan nomor sesi tidak duplikat.",
                                              NotificationType.Warning
                                          ),
                                          !Coalesce(gblChecklistSubmitting, false),
                                          Set(gblChecklistSubmitting, true);
                                          IfError(
                                              With(
                                                  {
                                                      savedChecklist: If(
                                                          Coalesce(gblChecklistEditMode, false),
                                                          Patch(
                                                              ChecklistMentoring,
                                                              gblSelectedChecklist,
                                                              {
                                                                  NIP: gblSelectedChecklist.NIP,
                                                                  Tahun: Value(NumTahunChecklist.Value),
                                                                  MentorNIP: CmbMentorChecklist.Selected.NIP,
                                                                  Status: If(And(!IsBlank(ImagePersonalStatementSubmit.Image), !IsBlank(ImageCareerPlanSubmit.Image), !IsBlank(ImageBuktiUploadSubmit.Image)), "Lengkap", "Belum Lengkap"),
                                                                  PersonalStatementFile: ImagePersonalStatementSubmit.Image,
                                                                  CareerPlanFile: ImageCareerPlanSubmit.Image,
                                                                  BuktiUploadFile: ImageBuktiUploadSubmit.Image
                                                              }
                                                          ),
                                                          With(
                                                              {
                                                                  newChecklist: Patch(
                                                                      ChecklistMentoring,
                                                                      Defaults(ChecklistMentoring),
                                                                      {
                                                                          Title: "TEMP_" & Text(GUID()),
                                                                          NIP: Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                                                          Tahun: Value(NumTahunChecklist.Value),
                                                                          MentorNIP: CmbMentorChecklist.Selected.NIP,
                                                                          Status: If(And(!IsBlank(ImagePersonalStatementSubmit.Image), !IsBlank(ImageCareerPlanSubmit.Image), !IsBlank(ImageBuktiUploadSubmit.Image)), "Lengkap", "Belum Lengkap"),
                                                                          PersonalStatementFile: ImagePersonalStatementSubmit.Image,
                                                                          CareerPlanFile: ImageCareerPlanSubmit.Image,
                                                                          BuktiUploadFile: ImageBuktiUploadSubmit.Image
                                                                      }
                                                                  )
                                                              },
                                                              Patch(ChecklistMentoring, newChecklist, {Title: Text(newChecklist.ID)})
                                                          )
                                                      )
                                                  },
                                                  ForAll(
                                                      colMentoringSesiDeleted As deletedSesi,
                                                      RemoveIf(MentoringSesi, ID = deletedSesi.RecordID)
                                                  );
                                                  ForAll(
                                                      colMentoringSesi As sesi,
                                                      If(
                                                          sesi.RecordID > 0,
                                                          If(
                                                              sesi.FotoDiubah,
                                                              Patch(
                                                                  MentoringSesi,
                                                                  LookUp(MentoringSesi, ID = sesi.RecordID),
                                                                  {
                                                                      Title: Text(savedChecklist.ID) & "_" & Text(sesi.NoSesi),
                                                                      ChecklistMentoringID: Text(savedChecklist.ID),
                                                                      NoSesi: Value(sesi.NoSesi),
                                                                      Tanggal: sesi.Tanggal,
                                                                      FotoBukti: sesi.FotoBuktiBaru
                                                                  }
                                                              ),
                                                              Patch(
                                                                  MentoringSesi,
                                                                  LookUp(MentoringSesi, ID = sesi.RecordID),
                                                                  {
                                                                      Title: Text(savedChecklist.ID) & "_" & Text(sesi.NoSesi),
                                                                      ChecklistMentoringID: Text(savedChecklist.ID),
                                                                      NoSesi: Value(sesi.NoSesi),
                                                                      Tanggal: sesi.Tanggal
                                                                  }
                                                              )
                                                          ),
                                                          Patch(
                                                              MentoringSesi,
                                                              Defaults(MentoringSesi),
                                                              {
                                                                  Title: Text(savedChecklist.ID) & "_" & Text(sesi.NoSesi) & "_" & Text(GUID()),
                                                                  ChecklistMentoringID: Text(savedChecklist.ID),
                                                                  NoSesi: Value(sesi.NoSesi),
                                                                  Tanggal: sesi.Tanggal,
                                                                  FotoBukti: sesi.FotoBuktiBaru
                                                              }
                                                          )
                                                      )
                                                  )
                                              );
                                              Refresh(MentoringSesi);
                                              Refresh(ChecklistMentoring);
                                              Notify(If(Coalesce(gblChecklistEditMode, false), "Checklist berhasil diperbarui.", "Checklist berhasil disimpan."), NotificationType.Success);
                                              Set(gblChecklistSubmitting, false);
                                              Set(gblChecklistEditMode, false);
                                              Clear(colMentoringSesi);
                                              Clear(colMentoringSesiDeleted);
                                              Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                                              Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade),
                                              Notify("Gagal menyimpan checklist: " & FirstError.Message, NotificationType.Error);
                                              Set(gblChecklistSubmitting, false)
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: =If(Coalesce(gblChecklistSubmitting, false), "Menyimpan...", "Simpan")
                                    Visible: =!Coalesce(locConfirmDeleteChecklistForm, false)
                                    Width: =130
                  - ChecklistImagesForm:
                      Control: Form@2.4.4
                      Layout: Vertical
                      Properties:
                        DataSource: =ChecklistMentoring
                        DefaultMode: =If(Coalesce(gblChecklistEditMode, false), FormMode.Edit, FormMode.New)
                        FillPortions: =0
                        Height: =1
                        Item: =gblSelectedChecklist
                        LayoutMinHeight: =1
                        LayoutMinWidth: =16
                        OnFailure: |-
                          =Notify("Gagal menyimpan checklist: " & ChecklistImagesForm.Error, NotificationType.Error);
                          Set(gblChecklistSubmitting, false)
                        OnSuccess: |-
                          =If(
                              !Coalesce(gblChecklistEditMode, false),
                              Patch(ChecklistMentoring, ChecklistImagesForm.LastSubmit, {Title: Text(ChecklistImagesForm.LastSubmit.ID)})
                          );
                          Refresh(ChecklistMentoring);
                          Notify(If(Coalesce(gblChecklistEditMode, false), "Checklist berhasil diperbarui.", "Checklist berhasil disimpan."), NotificationType.Success);
                          Set(gblChecklistSubmitting, false);
                          Set(gblChecklistEditMode, false);
                          Set(gblSelectedChecklist, Defaults(ChecklistMentoring));
                          Navigate(S6A_ChecklistMentoring_List, ScreenTransition.Fade)
                        Width: =Parent.Width
                      Children:
                        - Title_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              DataField: ="Title"
                              Default: =ThisItem.Title
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, Title)
                              MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                              Required: =true
                              Update: =If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.Title, "TEMP_" & Text(GUID()))
                              X: =0
                              Y: =0
                        - NIP_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              DataField: ="NIP"
                              Default: =ThisItem.NIP
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, NIP)
                              MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                              Required: =false
                              Update: =Text(If(Coalesce(gblChecklistEditMode, false), gblSelectedChecklist.NIP, If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)))
                              X: =0
                              Y: =0
                        - Tahun_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: NumberEdit
                            Properties:
                              DataField: ="Tahun"
                              Default: =ThisItem.Tahun
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, Tahun)
                              Required: =false
                              Update: =Value(NumTahunChecklist.Value)
                              X: =0
                              Y: =0
                        - MentorNIP_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              DataField: ="MentorNIP"
                              Default: =ThisItem.MentorNIP
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, MentorNIP)
                              MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                              Required: =false
                              Update: =CmbMentorChecklist.Selected.NIP
                              X: =0
                              Y: =0
                        - Status_Checklist_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              DataField: ="Status"
                              Default: =ThisItem.Status
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, Status)
                              MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                              Required: =false
                              Update: =If(And(!IsBlank(ImgPersonalStatementChecklist.Image), !IsBlank(ImgCareerPlanChecklist.Image), !IsBlank(ImgBuktiUploadChecklist.Image)), "Lengkap", "Belum Lengkap")
                              X: =0
                              Y: =0
                        - PersonalStatementFile_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: LargePicture
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="PersonalStatementFile"
                              Default: =ThisItem.PersonalStatementFile
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, PersonalStatementFile)
                              Height: =200
                              Required: =false
                              Update: =ImagePersonalStatementSubmit.Image
                              Width: =Parent.Width
                              X: =0
                              Y: =5
                            Children:
                              - ImagePersonalStatementSubmit:
                                  Control: Image@2.2.3
                                  MetadataKey: FieldValue
                                  Properties:
                                    DisplayMode: =Parent.DisplayMode
                                    Height: =150
                                    Image: =If(IsBlank(AddMediaPersonalStatementChecklist.Media), Parent.Default, AddMediaPersonalStatementChecklist.Media)
                                    Visible: =false
                                    Width: =Parent.Width
                        - CareerPlanFile_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: LargePicture
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="CareerPlanFile"
                              Default: =ThisItem.CareerPlanFile
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, CareerPlanFile)
                              Height: =200
                              Required: =false
                              Update: =ImageCareerPlanSubmit.Image
                              Width: =Parent.Width
                              X: =0
                              Y: =6
                            Children:
                              - ImageCareerPlanSubmit:
                                  Control: Image@2.2.3
                                  MetadataKey: FieldValue
                                  Properties:
                                    DisplayMode: =Parent.DisplayMode
                                    Height: =150
                                    Image: =If(IsBlank(AddMediaCareerPlanChecklist.Media), Parent.Default, AddMediaCareerPlanChecklist.Media)
                                    Visible: =false
                                    Width: =Parent.Width
                        - BuktiUploadFile_DataCard:
                            Control: TypedDataCard@1.0.7
                            Variant: LargePicture
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="BuktiUploadFile"
                              Default: =ThisItem.BuktiUploadFile
                              DisplayName: =DataSourceInfo([@ChecklistMentoring], DataSourceInfo.DisplayName, BuktiUploadFile)
                              Height: =200
                              Required: =false
                              Update: =ImageBuktiUploadSubmit.Image
                              Width: =Parent.Width
                              X: =0
                              Y: =7
                            Children:
                              - ImageBuktiUploadSubmit:
                                  Control: Image@2.2.3
                                  MetadataKey: FieldValue
                                  Properties:
                                    DisplayMode: =Parent.DisplayMode
                                    Height: =150
                                    Image: =If(IsBlank(AddMediaBuktiUploadChecklist.Media), Parent.Default, AddMediaBuktiUploadChecklist.Media)
                                    Visible: =false
                                    Width: =Parent.Width

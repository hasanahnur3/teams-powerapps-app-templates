Screens:
  S2_ProfilPegawai:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(31, 56, 100, 1)
    Children:
      - ScreenContainerS2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainerS2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - BtnBackS2:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: =Back()
                        PaddingLeft: =20
                        Size: =22
                        Text: ="‹"
                        Width: =40
                  - LblAppNameS2:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="MyCareerApp"
                  - HeaderSpacerS2:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =40
            - MainS2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:

                  - PimpinanContextS2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 620, 160, 82)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =If(Parent.Width < 620, 160, 82)
                        LayoutWrap: =true
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =Coalesce(gblPimpinanView, false)
                        Width: =Parent.Width
                      Children:
                        - PimpinanEmployeeS2:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              OnSelect: =Navigate(S11_Pimpinan_DaftarPegawai, ScreenTransition.Fade)
                              PaddingLeft: =8
                              Size: =12
                              Text: '="Pegawai: " & Coalesce(LookUp(Pegawai, Title = Text(gblSubjectNIP), Nama), Text(gblSubjectNIP))'
                              Width: =If(Parent.Width < 620, Parent.Width - 32, Max(220, Parent.Width - 310))
                        - PimpinanTabProfileS2:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(0, 120, 212, 1)
                              Fill: =RGBA(222, 236, 249, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Size: =11
                              Text: ="Profil"
                              Width: =120
                        - PimpinanTabPRS2:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: =Navigate(S3A_PR_List, ScreenTransition.Fade)
                              Size: =11
                              Text: ="Performance Review"
                              Width: =150

                  # ════════════════════════════════
                  # SECTION I — IDENTITAS PEGAWAI
                  # ════════════════════════════════
                  - SectionI:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 620, 560, 350)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutMinHeight: =If(Parent.Width < 620, 560, 350)
                        LayoutMinWidth: =0
                        LayoutOverflowX: =LayoutOverflow.Hide
                        LayoutOverflowY: =LayoutOverflow.Hide
                        PaddingBottom: =22
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =22
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - SIHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =36
                            Children:
                              - TagI:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(31, 56, 100, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =11
                                    Text: ="I"
                                    Width: =28
                              - TitleI:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(31, 56, 100, 1)
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: ="Identitas Pegawai"
                        - SIDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(243, 242, 241, 1)
                              Height: =1
                        - SIRow1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Parent.Width < 564, 140, 70)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =24
                              LayoutMinHeight: =If(Parent.Width < 564, 140, 70)
                              LayoutMinWidth: =0
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - FldNama:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinWidth: =If(Parent.Width < 564, Parent.Width, 120)
                                    Width: =If(Parent.Width < 564, Parent.Width, (Parent.Width - 24) / 2)
                                  Children:
                                    - LblNama:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="NAMA PEGAWAI"
                                    - ValNama:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: =LookUp(Pegawai, Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)), Nama)
                              - FldSatker:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinWidth: =If(Parent.Width < 564, Parent.Width, 120)
                                    Width: =If(Parent.Width < 564, Parent.Width, (Parent.Width - 24) / 2)
                                  Children:
                                    - LblSatker:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="SATUAN KERJA"
                                    - ValSatker:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: =LookUp(Pegawai, Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)), Satker)
                        - SIRow2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Parent.Width < 564, 140, 70)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =24
                              LayoutMinHeight: =If(Parent.Width < 564, 140, 70)
                              LayoutMinWidth: =0
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - FldNIP:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinWidth: =If(Parent.Width < 564, Parent.Width, 120)
                                    Width: =If(Parent.Width < 564, Parent.Width, (Parent.Width - 24) / 2)
                                  Children:
                                    - LblNIP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="NIP"
                                    - ValNIP:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: =Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))
                              - FldJabatan:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinWidth: =If(Parent.Width < 564, Parent.Width, 120)
                                    Width: =If(Parent.Width < 564, Parent.Width, (Parent.Width - 24) / 2)
                                  Children:
                                    - LblJabatan:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="JABATAN"
                                    - ValJabatan:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: =LookUp(Pegawai, Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)), Jabatan)
                        - SIRow3:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(Parent.Width < 564, 140, 70)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =24
                              LayoutMinHeight: =If(Parent.Width < 564, 140, 70)
                              LayoutMinWidth: =0
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              LayoutWrap: =true
                              Width: =Parent.Width
                            Children:
                              - FldPangkat:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinWidth: =If(Parent.Width < 564, Parent.Width, 120)
                                    Width: =If(Parent.Width < 564, Parent.Width, (Parent.Width - 24) / 2)
                                  Children:
                                    - LblPangkat:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="PANGKAT (PKT)"
                                    - ValPangkat:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: ="Pkt. " & Text(LookUp(Pegawai, Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)), Pangkat), "0")
                              - FldTglPengisian:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinWidth: =If(Parent.Width < 564, Parent.Width, 120)
                                    Width: =If(Parent.Width < 564, Parent.Width, (Parent.Width - 24) / 2)
                                  Children:
                                    - LblTglPengisian:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="TANGGAL PENGISIAN"
                                    - ValTglPengisian:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: =Text(LookUp(Pegawai, Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)), LastUpdated), "[$-id-ID]dd mmmm yyyy")

                  # ════════════════════════════════
                  # SECTION II — QUANTITATIVE
                  # ════════════════════════════════
                  - SectionII:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, 2460, 1300)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutMinHeight: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, 2460, 1300)
                        LayoutMinWidth: =0
                        LayoutOverflowX: =LayoutOverflow.Hide
                        LayoutOverflowY: =LayoutOverflow.Hide
                        PaddingBottom: =22
                        PaddingLeft: =28
                        PaddingRight: =28
                        PaddingTop: =22
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - SIIHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =36
                            Children:
                              - TagII:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(31, 56, 100, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =11
                                    Text: ="II"
                                    Width: =32
                              - TitleII:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(31, 56, 100, 1)
                                    FillPortions: =1
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: ="Quantitative"
                        - SIIDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(243, 242, 241, 1)
                              Height: =1

                        # A & B
                        - RowAB:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =70
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =24
                              LayoutMinHeight: =70
                            Children:
                              - FldNilaiKinerja:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                  Children:
                                    - LblNilaiKinerja:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="A. NILAI KINERJA RATA² 5 TAHUN"
                                    - ValNilaiKinerja:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: =Text(LookUp(Pegawai, Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)), NilaiKinerja), "0.0")
                              - FldMasaDinas:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                  Children:
                                    - LblMasaDinas:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(145, 145, 145, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =11
                                          Text: ="B. MASA DINAS PANGKAT"
                                    - ValMasaDinas:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(50, 49, 48, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =14
                                          Text: |-
                                            =With(
                                                {
                                                    TanggalMulai:
                                                        LookUp(
                                                            Pegawai,
                                                            Title = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)),
                                                            TanggalAwalDinas
                                                        )
                                                },
                                                DateDiff(TanggalMulai, Today(), TimeUnit.Years) & " Tahun " &
                                                Mod(DateDiff(TanggalMulai, Today(), TimeUnit.Months), 12) & " Bulan"
                                            )

                        # ── C. Pendidikan ──
                        - TitlePendidikan:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(0, 120, 212, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =13
                              Text: ="C. Pendidikan"
                        - TblPendidikan:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(IsEmpty(Filter(Profil_Pendidikan, NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)))), 64, If(S2_ProfilPegawai.Size <= ScreenSize.Medium, If(CountRows(Filter(Profil_Pendidikan, NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)))) >= 2, 410, 200), 110))
                              LayoutDirection: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                              LayoutGap: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, 10, 0)
                              LayoutMinHeight: =If(IsEmpty(Filter(Profil_Pendidikan, NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)))), 64, If(S2_ProfilPegawai.Size <= ScreenSize.Medium, If(CountRows(Filter(Profil_Pendidikan, NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP)))) >= 2, 410, 200), 110))
                              LayoutWrap: =S2_ProfilPegawai.Size <= ScreenSize.Medium
                            Children:
                              - PendidikanHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(243, 242, 241, 1)
                                    FillPortions: =0
                                    Height: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, 200, 34)
                                    LayoutDirection: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutMinHeight: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, 200, 34)
                                    Visible: =!IsEmpty(Filter(Profil_Pendidikan, NIP = Text(If(Coalesce(gblPimpinanView, false), gblSubjectNIP, gblCurrentNIP))))
                                    Width: =If(S2_ProfilPegawai.Size <= ScreenSize.Medium, (Parent.Width - 10) * 0.38, Parent.Width)
                                  Children:
                                    - PHNo:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          FillPortions: =0.35
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =34
                                          PaddingLeft: =10
                                          Size: =11
                                          Text: ="NO"
                                    - PHJenjang:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =RGBA(96, 94, 92, 1)
                                          FillPortions: =0.9
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =34
                                          PaddingLeft: =10

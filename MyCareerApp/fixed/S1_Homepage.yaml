Screens:
  S1_Homepage:
    Properties:
      Fill: =RGBA(242, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(35, 48, 108, 1)
      OnVisible: |-
        =If(
            IsEmpty(colNonFormNavigationHistory) ||
            Last(colNonFormNavigationHistory).ScreenName <> App.ActiveScreen.Name,
            Collect(
                colNonFormNavigationHistory,
                {
                    ScreenName: App.ActiveScreen.Name,
                    ScreenRef: App.ActiveScreen
                }
            )
        );
        UpdateContext({locShowDevelopmentWarning: false})
    Children:
      - TopBar_2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(35, 48, 108, 1)
            Height: =52
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =6
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =6
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - TopBarLogo_1:
                Control: Image@2.2.3
                Properties:
                  BorderStyle: =BorderStyle.None
                  Height: =32
                  Image: =test
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: =32
            - LblTitle_2:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FillPortions: =1
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =40
                  Text: ="MyCareerApp"
            - TopBarYear_1:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(56, 83, 142, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =11
                  Text: ="DPID - " & Year(Today())
                  Width: =116
            - TopBarUserAvatar_1:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Fill: =RGBA(250, 176, 5, 1)
                  Height: =32
                  Image: |-
                    =With(
                        {
                            currentEmployee: LookUp(
                                Pegawai,
                                Title = Text(gblCurrentNIP)
                            )
                        },
                        If(
                            IsBlank(currentEmployee.Email),
                            User().Image,
                            IfError(
                                Office365Users.UserPhotoV2(currentEmployee.Email),
                                User().Image
                            )
                        )
                    )
                  ImagePosition: =ImagePosition.Fill
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =32
            - TopBarUserName_1:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =34
                  Size: =11
                  Text: =Coalesce(LookUp(Pegawai, Title = Text(gblCurrentNIP), Nama), "Pegawai")
                  Width: =If(Parent.Width < 720, 0, 150)
      - TopBarShadow_2:
          Control: Rectangle@2.3.0

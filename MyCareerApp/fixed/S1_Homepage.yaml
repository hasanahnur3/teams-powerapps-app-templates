Screens:
  S1_Homepage:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
            IsEmpty(colNonFormNavigationHistory) ||
            Last(colNonFormNavigationHistory).ScreenName <> App.ActiveScreen.Name,
            Collect(
                colNonFormNavigationHistory,
                {
                    ScreenName: App.ActiveScreen.Name,
                    ScreenRef: App.ActiveScreen
                }
            )
        );
        UpdateContext({locShowDevelopmentWarning: false})
    Children:
      - TopBar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(31, 48, 112, 1)
            Height: =75
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width - 32
            X: =16
            Y: =16
          Children:
            - LblTitle:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FillPortions: =1
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =40
                  Size: =18
                  Text: ="MyCareerApp"
      - TopBarShadow:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0)
            Height: =0
            Width: =Parent.Width
            Y: =91
      - ContentArea:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height - 107
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
            Y: =107
          Children:
            - DevelopmentWarningBanner:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(161, 98, 7, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 244, 206, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =64
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =Coalesce(locShowDevelopmentWarning, false)
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - DevelopmentWarningIcon:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(161, 98, 7, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =20
                        Text: ="⚠"
                        Width: =36
                  - DevelopmentWarningText:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(122, 70, 0, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        Size: =13
                        Text: ="Fitur Dalam Development"
                  - BtnCloseDevelopmentWarning:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: ="Tutup peringatan"
                        Align: =Align.Center
                        Color: =RGBA(122, 70, 0, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =UpdateContext({locShowDevelopmentWarning: false})
                        Size: =18
                        Text: ="×"
                        Width: =40
            - CardStatus:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(225, 223, 221, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =If(Parent.Width < 620, 340, 156)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =If(Parent.Width < 620, 340, 156)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - StatusTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(50, 49, 48, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =14
                        Text: ="Status Kamu"
                  - StatusItemsRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout

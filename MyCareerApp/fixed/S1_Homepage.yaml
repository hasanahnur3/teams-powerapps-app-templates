                              FillPortions: =If(Parent.Width < 588, 0, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =80
                              LayoutMinWidth: =If(Parent.Width < 588, (Parent.Width - 12) / 2, 140)
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              Width: =If(Parent.Width < 588, (Parent.Width - 12) / 2, 140)
                            Children:
                              - St1Label:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =11
                                    Text: ="Performance Review 1"
                              - St1Badge:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: |-
                                      =With(
                                          {
                                              pr1ID: LookUp(
                                                  PerformanceReview,
                                                  NIP = Text(gblCurrentNIP) && Tahun = Year(Today()) && Semester = 1,
                                                  ID
                                              )
                                          },
                                          If(
                                              Month(Today()) > 6,
                                              RGBA(96, 94, 92, 1),
                                              If(IsBlank(pr1ID), RGBA(122, 70, 0, 1), RGBA(16, 124, 16, 1))
                                          )
                                      )
                                    Fill: |-
                                      =With(
                                          {
                                              pr1ID: LookUp(
                                                  PerformanceReview,
                                                  NIP = Text(gblCurrentNIP) && Tahun = Year(Today()) && Semester = 1,
                                                  ID
                                              )
                                          },
                                          If(
                                              Month(Today()) > 6,
                                              RGBA(243, 242, 241, 1),
                                              If(IsBlank(pr1ID), RGBA(255, 244, 206, 1), RGBA(223, 246, 221, 1))
                                          )
                                      )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    PaddingBottom: =4
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =4
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =11
                                    Text: |-
                                      =With(
                                          {
                                              pr1ID: LookUp(
                                                  PerformanceReview,
                                                  NIP = Text(gblCurrentNIP) && Tahun = Year(Today()) && Semester = 1,
                                                  ID
                                              )
                                          },
                                          If(
                                              Month(Today()) <= 6,
                                              If(IsBlank(pr1ID), "Perlu Diisi", "Sudah Diisi"),
                                              "Sudah Berakhir"
                                          )
                                      )

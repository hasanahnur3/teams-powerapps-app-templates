                        OnSelect: =Back()
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: ="Batal"
                        Width: =110
                  - Button2_1:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =If(Coalesce(gblPimpinanView, false), RGBA(96, 94, 92, 1), RGBA(255, 255, 255, 1))
                        DisplayMode: =If(Coalesce(gblPRSubmitting, false), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =If(Coalesce(gblPimpinanView, false), RGBA(225, 223, 221, 1), RGBA(9, 33, 98, 1))
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        OnSelect: |-
                          =If(
                              Or(
                                  IsBlank(DataCardValue28.Selected.Value),
                                  IsBlank(DataCardValue30.Selected.NIP),
                                  IsBlank(Trim(DataCardValue31.Value)),
                                  IsBlank(Trim(DataCardValue32.Value)),
                                  IsBlank(Trim(DataCardValue33.Value)),
                                  IsBlank(Trim(DataCardValue34.Value))
                              ),
                              Notify(
                                  "Lengkapi Semester, Line Manager, Goal, Reality, Options, dan Will.",
                                  NotificationType.Warning
                              ),
                              !Coalesce(gblPRSubmitting, false),
                              Set(gblPRSubmitting, true);
                              IfError(
                                  If(
                                      Coalesce(gblPREditMode, false),
                                      Patch(
                                          PerformanceReview,
                                          gblSelectedPR,
                                          {
                                              NIP: gblSelectedPR.NIP,
                                              Tahun: Value(DataCardValue27.Value),
                                              Semester: DataCardValue28.Selected,
                                              Tanggal: DataCardValue29.SelectedDate,
                                              LineManagerNIP: DataCardValue30.Selected.NIP,
                                              Goal: DataCardValue31.Value,
                                              Reality: DataCardValue32.Value,
                                              Options: DataCardValue33.Value,
                                              Will: DataCardValue34.Value,
                                              FotoBukti: ImageFotoBukti.Image
                                          }
                                      ),
                                      With(
                                          {
                                              newPerformanceReview: Patch(
                                                  PerformanceReview,
                                                  Defaults(PerformanceReview),
                                                  {
                                                      Title: "TEMP_" & Text(GUID()),
                                                      NIP: Text(gblCurrentNIP),
                                                      Tahun: Value(DataCardValue27.Value),
                                                      Semester: DataCardValue28.Selected,
                                                      Tanggal: DataCardValue29.SelectedDate,
                                                      LineManagerNIP: DataCardValue30.Selected.NIP,
                                                      Goal: DataCardValue31.Value,
                                                      Reality: DataCardValue32.Value,
                                                      Options: DataCardValue33.Value,
                                                      Will: DataCardValue34.Value,
                                                      FotoBukti: ImageFotoBukti.Image
                                                  }
                                              )
                                          },
                                          Patch(
                                              PerformanceReview,
                                              newPerformanceReview,
                                              {
                                                  Title: Text(newPerformanceReview.ID)
                                              }
                                          )
                                      )
                                  );
                                  Refresh(PerformanceReview);
                                  Notify(
                                      If(
                                          Coalesce(gblPREditMode, false),
                                          "Performance Review berhasil diperbarui.",
                                          "Performance Review berhasil disimpan."
                                      ),
                                      NotificationType.Success
                                  );
                                  Set(gblPRSubmitting, false);
                                  Set(gblPREditMode, false);
                                  Navigate(S3A_PR_List, ScreenTransition.Fade),
                                  Notify(
                                      "Gagal menyimpan: " & FirstError.Message,
                                      NotificationType.Error
                                  );
                                  Set(gblPRSubmitting, false)
                              )
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =13
                        Text: =If(Coalesce(gblPREditMode, false), "Simpan Perubahan", "Simpan")
                        Width: =If(App.Width < 520, 145, 170)

Screens:
  S12_Admin_MonitoringMentoring:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Refresh(Pegawai);
        Refresh(ChecklistMentoring);
        Set(gblChecklistAdminView, false)
    Children:
      - AdminMonitoringContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - AdminMonitoringTopBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(18, 38, 82, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  PaddingRight: =8
                  Width: =Parent.Width
                Children:
                  - BtnBackAdminMonitoring:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        OnSelect: |-
                          =Set(gblChecklistAdminView, false);
                          Back()
                        Size: =24
                        Text: ="‹"
                        Width: =44
                  - LblAppNameAdminMonitoring:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        Size: =16
                        Text: ="MyCareerApp"
                  - AdminMonitoringTopBarSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =44
            - AdminMonitoringTopBarShadow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0.08)
                  Height: =5
                  Width: =Parent.Width
            - AdminMonitoringMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - AdminMonitoringBreadcrumb:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(96, 94, 92, 1)
                        FillPortions: =0
                        Font: =Font.'Open Sans'
                        Height: =24
                        Size: =12
                        Text: ="Home › Monitoring Mentoring"
                        Width: =Parent.Width
                  - AdminMonitoringHeading:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =56
                        Width: =Parent.Width
                      Children:
                        - AdminMonitoringTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(31, 56, 100, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              Size: =20
                              Text: ="Monitoring Mentoring"
                        - CmbTahunAdminMonitoring:
                            Control: ComboBox@0.0.51
                            Properties:
                              AccessibleLabel: ="Pilih tahun monitoring"
                              DefaultSelectedItems: |-
                                =Table({Value: Year(Today())})
                              InputTextPlaceholder: ="Tahun"
                              Items: |-
                                =Table(
                                    {Value: Year(Today()) + 1},
                                    {Value: Year(Today())},
                                    {Value: Year(Today()) - 1},
                                    {Value: Year(Today()) - 2},
                                    {Value: Year(Today()) - 3}
                                )
                              SelectMultiple: =false
                              Width: =180
                  - AdminMonitoringTableCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(225, 223, 221, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =720
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =420
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - AdminMonitoringTableHeader:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =RGBA(250, 249, 248, 1)
                              FillPortions: =0
                              Height: =70
                              LayoutMinHeight: =70
                              Width: =Parent.Width
                            Children:
                              - HeaderNoAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    Size: =13
                                    Text: ="NO"
                                    Width: =80
                                    X: =40
                                    Y: =18
                              - HeaderNamaAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    Size: =13
                                    Text: ="NAMA PEGAWAI"
                                    Width: =360
                                    X: =140
                                    Y: =18
                              - HeaderNIPAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    Size: =13
                                    Text: ="NIP"
                                    Width: =220
                                    X: =If(Parent.Width < 900, Parent.Width - 420, Parent.Width * 0.48)
                                    Y: =18
                              - HeaderStatusAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    Size: =13
                                    Text: ="CHECKLIST MENTORING " & Text(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                    Width: =360
                                    X: =If(Parent.Width < 900, Parent.Width - 250, Parent.Width * 0.72)
                                    Y: =18
                        - GalleryAdminMonitoring:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Items: |-
                                =SortByColumns(
                                    Filter(Pegawai, Coalesce(IsPegawai, true)),
                                    "Nama",
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =320
                              OnSelect: |-
                                =With(
                                    {
                                        selectedChecklist: LookUp(
                                            ChecklistMentoring,
                                            NIP = ThisItem.Title &&
                                                Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                        )
                                    },
                                    If(
                                        !IsBlank(selectedChecklist.ID),
                                        Set(gblSelectedChecklist, selectedChecklist);
                                        Set(gblChecklistEditMode, false);
                                        Set(gblChecklistAdminView, true);
                                        Navigate(S6C_ChecklistMentoring_Detail, ScreenTransition.Fade)
                                    )
                                )
                              TemplatePadding: =0
                              TemplateSize: =86
                            Children:
                              - AdminMonitoringRowBackground:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: |-
                                      =With(
                                          {
                                              rowChecklist: LookUp(
                                                  ChecklistMentoring,
                                                  NIP = ThisItem.Title &&
                                                      Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                              )
                                          },
                                          If(!IsBlank(rowChecklist.ID), RGBA(255, 255, 255, 1), RGBA(252, 252, 252, 1))
                                      )
                                    Height: =Parent.TemplateHeight - 1
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                              - AdminMonitoringRowDivider:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =RGBA(237, 235, 233, 1)
                                    Height: =1
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                              - ValNoAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =40
                                    OnSelect: =Select(Parent)
                                    Size: =13
                                    Text: =Text(CountRows(Filter(Pegawai, Coalesce(IsPegawai, true) && Nama <= ThisItem.Nama)))
                                    Width: =80
                                    X: =40
                                    Y: =24
                              - ValNamaAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    OnSelect: =Select(Parent)
                                    Size: =13
                                    Text: =Coalesce(ThisItem.Nama, "-")
                                    Width: =360
                                    X: =140
                                    Y: =24
                              - ValNIPAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(50, 49, 48, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =40
                                    OnSelect: =Select(Parent)
                                    Size: =13
                                    Text: =Coalesce(ThisItem.Title, "-")
                                    Width: =220
                                    X: =If(Parent.TemplateWidth < 900, Parent.TemplateWidth - 420, Parent.TemplateWidth * 0.48)
                                    Y: =24
                              - ValStatusAdminMonitoring:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: |-
                                      =With(
                                          {
                                              rowChecklist: LookUp(
                                                  ChecklistMentoring,
                                                  NIP = ThisItem.Title &&
                                                      Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                              )
                                          },
                                          If(!IsBlank(rowChecklist.ID), RGBA(16, 124, 16, 1), RGBA(161, 98, 7, 1))
                                      )
                                    Fill: |-
                                      =With(
                                          {
                                              rowChecklist: LookUp(
                                                  ChecklistMentoring,
                                                  NIP = ThisItem.Title &&
                                                      Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                              )
                                          },
                                          If(!IsBlank(rowChecklist.ID), RGBA(218, 242, 208, 1), RGBA(255, 244, 206, 1))
                                      )
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    OnSelect: =Select(Parent)
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =12
                                    Text: |-
                                      =With(
                                          {
                                              rowChecklist: LookUp(
                                                  ChecklistMentoring,
                                                  NIP = ThisItem.Title &&
                                                      Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                              )
                                          },
                                          If(!IsBlank(rowChecklist.ID), "✓ Sudah Diisi", "✗ Belum Diisi")
                                      )
                                    Width: =150
                                    X: =If(Parent.TemplateWidth < 900, Parent.TemplateWidth - 250, Parent.TemplateWidth * 0.72)
                                    Y: =30
                        - AdminMonitoringEmptyState:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(96, 94, 92, 1)
                              Font: =Font.'Open Sans'
                              Height: =80
                              Size: =12
                              Text: ="Belum ada data pegawai."
                              Visible: =IsEmpty(GalleryAdminMonitoring.AllItems)
                              Width: =Parent.Width
                  - AdminMonitoringStats:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =118
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =118
                        LayoutWrap: =true
                        Width: =Parent.Width
                      Children:
                        - StatTotalPegawai:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =110
                              LayoutMinWidth: =180
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - StatTotalPegawaiLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    Size: =12
                                    Text: ="TOTAL PEGAWAI"
                                    Width: =Parent.Width
                              - StatTotalPegawaiValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(31, 56, 100, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =44
                                    Size: =28
                                    Text: =Text(CountRows(Filter(Pegawai, Coalesce(IsPegawai, true))))
                                    Width: =Parent.Width
                        - StatSudahDiisi:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =110
                              LayoutMinWidth: =180
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - StatSudahDiisiLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    Size: =12
                                    Text: ="SUDAH DIISI"
                                    Width: =Parent.Width
                              - StatSudahDiisiValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(16, 124, 16, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =44
                                    Size: =28
                                    Text: |-
                                      =Text(
                                          CountRows(
                                              Filter(
                                                  Pegawai As pegawai,
                                                  Coalesce(pegawai.IsPegawai, true) &&
                                                      !IsBlank(
                                                          LookUp(
                                                              ChecklistMentoring,
                                                              NIP = pegawai.Title &&
                                                                  Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                                          ).ID
                                                      )
                                              )
                                          )
                                      )
                                    Width: =Parent.Width
                        - StatBelumDiisi:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =110
                              LayoutMinWidth: =180
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - StatBelumDiisiLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    Size: =12
                                    Text: ="BELUM DIISI"
                                    Width: =Parent.Width
                              - StatBelumDiisiValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(196, 43, 28, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =44
                                    Size: =28
                                    Text: |-
                                      =Text(
                                          CountRows(Filter(Pegawai, Coalesce(IsPegawai, true))) -
                                          CountRows(
                                              Filter(
                                                  Pegawai As pegawai,
                                                  Coalesce(pegawai.IsPegawai, true) &&
                                                      !IsBlank(
                                                          LookUp(
                                                              ChecklistMentoring,
                                                              NIP = pegawai.Title &&
                                                                  Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                                          ).ID
                                                      )
                                              )
                                          )
                                      )
                                    Width: =Parent.Width
                        - StatCompletionRate:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(225, 223, 221, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Height: =110
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =110
                              LayoutMinWidth: =180
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - StatCompletionRateLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(96, 94, 92, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    Size: =12
                                    Text: ="COMPLETION RATE"
                                    Width: =Parent.Width
                              - StatCompletionRateValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(0, 120, 212, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =44
                                    Size: =28
                                    Text: |-
                                      =With(
                                          {
                                              totalPegawai: CountRows(Filter(Pegawai, Coalesce(IsPegawai, true))),
                                              totalChecklist:
                                                  CountRows(
                                                      Filter(
                                                          Pegawai As pegawai,
                                                          Coalesce(pegawai.IsPegawai, true) &&
                                                              !IsBlank(
                                                                  LookUp(
                                                                      ChecklistMentoring,
                                                                      NIP = pegawai.Title &&
                                                                          Tahun = Value(Coalesce(CmbTahunAdminMonitoring.Selected.Value, Year(Today())))
                                                                  ).ID
                                                              )
                                                      )
                                                  )
                                          },
                                          If(totalPegawai = 0, "0%", Text(Round(totalChecklist / totalPegawai * 100, 0), "0") & "%")
                                      )
                                    Width: =Parent.Width
